<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket DJ Studio - PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: white; user-select: none; overflow-x: hidden; }
        .pad-btn { background: #151515; border: 1px solid #333; aspect-ratio: 1/1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; touch-action: none; }
        .pad-btn.active { background: #00e676 !important; color: black; box-shadow: 0 0 15px #00e676; border-color: #fff; }
        .pad-btn.has-code { border-color: #00e676; }
        
        /* จุดดึงสำหรับลาก (Drag Handle) */
        .drag-handle { position: absolute; top: 5px; left: 8px; color: #444; font-size: 16px; cursor: grab; padding: 5px; z-index: 20; line-height: 1; }
        .drag-handle:active { cursor: grabbing; color: #00e676; }

        /* สไตล์ตอนกำลังลาก */
        .sortable-ghost { opacity: 0.1; }
        .sortable-drag { opacity: 0.9; transform: scale(1.1); z-index: 9999; border: 2px solid #00e676 !important; }

        /* Timeline & Other Styles (คงเดิม) */
        #timelineViewport { background: #0a0a0a; border-bottom: 1px solid #222; position: relative; height: 180px; overflow-x: auto; }
        #timelineContent { position: relative; height: 100%; width: 2000px; background-image: linear-gradient(to right, #1a1a1a 1px, transparent 1px); background-size: 100px 100%; }
        #playhead { position: absolute; top: 0; width: 2px; height: 100%; background: #ff3d00; z-index: 50; pointer-events: none; }
        .light-clip { position: absolute; height: 34px; color: black; border-radius: 6px; font-size: 9px; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body class="p-4">

    <div id="consoleView" class="max-w-xl mx-auto">
        <div class="bg-gray-900/50 p-5 rounded-3xl border border-gray-800 shadow-xl mb-4">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-black text-green-500 italic uppercase">DJ Studio Pro</h1>
                <button id="connectBtn" class="bg-green-500 text-black text-[10px] font-black px-5 py-2 rounded-2xl transition">CONNECT</button>
            </div>
            <div class="space-y-1">
                <input type="range" id="globalSpeed" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full accent-green-500 h-8">
            </div>
        </div>
        <div id="padGrid" class="grid grid-cols-5 gap-3 pb-32"></div>
    </div>

    <div id="modal" class="fixed inset-0 hidden z-50 flex flex-col bg-[#050505]">
        <div class="flex justify-between items-center p-3 bg-gray-900 border-b border-gray-800">
            <button onclick="closePopup()" class="text-gray-400 font-bold text-xs uppercase">Back</button>
            <div class="flex space-x-2">
                <button id="playBtn" onclick="togglePlay()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black">PLAY</button>
                <button onclick="saveAndSend()" class="bg-white text-black font-black px-4 py-2 rounded-lg text-xs uppercase">Save</button>
            </div>
        </div>
        <div id="timelineViewport">
            <div id="timelineContent"><div id="playhead"></div><div id="trackArea" class="relative h-full py-6"></div></div>
        </div>
        </div>

    <script>
        let device, characteristic;
        let patterns = Array.from({length: 60}, (_, i) => ({ id: i, code: "" }));
        let selectedIdx = -1;
        const colorMap = { 'bl': '#0000FF', 're': '#FF0000', 'gr': '#00FF00', 'ye': '#FFFF00', 'wh': '#FFFFFF', 'pu': '#8000FF', 'aq': '#00FFFF', 'or': '#FF8000' };

        function renderPads() {
            const grid = document.getElementById('padGrid');
            grid.innerHTML = '';
            patterns.forEach((p, idx) => {
                const btn = document.createElement('div');
                btn.className = `pad-btn ${p.code ? 'has-code' : ''}`;
                
                // 1. ใส่ Handle สำหรับลาก
                const handle = document.createElement('div');
                handle.className = 'drag-handle';
                handle.innerHTML = '⠿';
                btn.appendChild(handle);

                // 2. ใส่ตัวเลข
                const num = document.createElement('span');
                num.className = 'text-xs font-black pad-num';
                num.innerText = idx + 1;
                btn.appendChild(num);

                // 3. ระบบคลิกเล่นไฟ / ดับเบิ้ลคลิกแก้ไฟ
                let lastTap = 0;
                btn.onclick = (e) => {
                    // ถ้าคลิกที่ handle ไม่ต้องทำงาน
                    if (e.target.classList.contains('drag-handle')) return;
                    
                    const now = Date.now();
                    if (now - lastTap < 300) { 
                        openPopup(idx); // เคาะ 2 ทีแก้ไฟ
                    } else {
                        playFX(idx, btn); // เคาะทีเดียวเล่นไฟ
                    }
                    lastTap = now;
                };

                grid.appendChild(btn);
            });

            // 4. ตั้งค่า Sortable ให้ลากเฉพาะที่ Handle
            new Sortable(grid, { 
                handle: '.drag-handle', // บังคับให้ลากได้เฉพาะจุด ⠿
                animation: 150,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                onEnd: (evt) => {
                    const item = patterns.splice(evt.oldIndex, 1)[0];
                    patterns.splice(evt.newIndex, 0, item);
                    // อัปเดตตัวเลขแบบลื่นๆ
                    grid.querySelectorAll('.pad-btn').forEach((p, i) => {
                        p.querySelector('.pad-num').innerText = i + 1;
                    });
                }
            });
        }

        // ฟังก์ชัน playFX, openPopup, saveAndSend และ Bluetooth Connect (รักษาของเดิมไว้)
        async function playFX(idx, el) {
            if(!characteristic || !patterns[idx].code) return;
            document.querySelectorAll('.pad-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode("5" + patterns[idx].code)); } catch(e){}
        }

        renderPads();
    </script>
</body>
</html>
