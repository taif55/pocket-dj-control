<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket DJ Studio - Final Touch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; background: #050505; color: white; 
            user-select: none; overflow: hidden; height: 100vh;
            display: flex; flex-direction: column; touch-action: none; 
        }

        .pad-container { margin: 0 auto; width: 95%; height: 60vh; background: #0a0a0a; border: 2px solid #222; border-radius: 20px; position: relative; overflow: hidden; display: flex; }
        #padGrid { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 15px; overflow-y: scroll; scrollbar-width: none; touch-action: none; }
        #padGrid::-webkit-scrollbar { display: none; } 
        .side-scroll-track { width: 30px; background: #111; border-left: 1px solid #222; display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
        .side-scroll-track::after { content: '↕'; color: #444; font-size: 20px; }

        .pad-btn { background: #151515; border: 1px solid #333; aspect-ratio: 1/1; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: transform 0.05s, box-shadow 0.1s; }
        .pad-btn:active { transform: scale(0.92); box-shadow: inset 0 0 15px rgba(255,255,255,0.2); }
        .pad-btn.playing { box-shadow: 0 0 20px #00e676; border-color: #fff; transform: scale(0.95); background: #00e676 !important; color: black; }

        .poten-slot { border: 2px dashed #ff9100 !important; background: rgba(255, 145, 0, 0.05); }
        .poten-slot::before { content: 'POTEN'; position: absolute; top: 4px; font-size: 7px; font-weight: 900; color: #ff9100; letter-spacing: 0.5px; opacity: 0.9; }
        .poten-slot.has-code { border: 2px solid #ff9100 !important; box-shadow: inset 0 0 15px rgba(255, 145, 0, 0.3), 0 0 10px rgba(255, 145, 0, 0.5) !important; }
        .pad-btn:not(.poten-slot).has-code { border: 2px solid #00e676 !important; box-shadow: inset 0 0 10px rgba(0,230,118,0.2) !important; background-color: #151515 !important; }

        .sortable-drag { opacity: 1 !important; transform: scale(1.1) !important; z-index: 9999 !important; box-shadow: 0 10px 30px #000 !important; border: 2px solid #00e676 !important; pointer-events: none; }
        .sortable-ghost { opacity: 0.1; background: #00e676 !important; }

        /* --- Designer UI & Timeline --- */
        #timelineViewport { background: #0a0a0a; border-bottom: 1px solid #222; position: relative; height: 160px; overflow-x: auto; overflow-y: hidden; }
        #timelineContent { position: relative; height: 100%; width: 2000px; background-size: 100px 100%; background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px); }
        
        #playhead { position: absolute; top: 0; width: 2px; height: 100%; background: #ff3d00; z-index: 50; pointer-events: none; box-shadow: 0 0 8px #ff3d00; }
        #loopLine { position: absolute; top: 0; width: 2px; height: 100%; background: #00e676; z-index: 45; pointer-events: none; box-shadow: 0 0 10px #00e676; opacity: 0.8; }
        
        .light-clip { position: absolute; height: 16px; color: black; border-radius: 4px; font-size: 8px; font-weight: 900; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; border: 1px solid rgba(255,255,255,0.4); cursor: grab; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .light-clip:active { cursor: grabbing; }
        .light-clip.selected { border: 2px solid white; box-shadow: 0 0 10px #00e676; z-index: 40; }
        
        .color-scroll::-webkit-scrollbar { height: 4px; }
        .color-scroll::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        #ledGrid { touch-action: pan-y; overflow-y: scroll; padding-right: 5px; }
        #ledGrid::-webkit-scrollbar { display: block; width: 14px; }
        #ledGrid::-webkit-scrollbar-track { background: #0a0a0a; border-radius: 8px; }
        #ledGrid::-webkit-scrollbar-thumb { background: #333; border-radius: 8px; border: 3px solid #0a0a0a; }

        .led-mark { border: 1px solid #444 !important; background: #151515; }
        .led-active { background: #00e676 !important; color: #000 !important; border-color: #fff !important; box-shadow: 0 0 8px #00e676; }
    </style>
</head>
<body class="p-4">

    <div id="consoleView" class="max-w-xl mx-auto w-full">
        <div class="flex justify-between items-center mb-2 bg-gray-900/50 p-4 rounded-3xl border border-gray-800 shadow-xl">
            <h1 class="text-lg font-black text-green-500 italic uppercase">DJ Master Sync</h1>
            <button id="connectBtn" class="bg-blue-600 text-white text-[10px] font-black px-4 py-2 rounded-xl active:scale-95 transition">CONNECT</button>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-2 mb-4 flex items-center space-x-3 shadow-lg">
            <div class="text-[9px] font-bold text-gray-400 whitespace-nowrap">GLOBAL SPEED</div>
            <input type="range" id="masterSpeedSlider" min="0" max="8" step="0.1" value="1.0" class="flex-1 accent-orange-500 h-2 bg-gray-700 rounded-lg appearance-none" oninput="updateMasterSpeed(this.value)">
            <div id="masterSpeedText" class="text-orange-500 font-black text-xs w-8 text-right">1.0x</div>
            <button onclick="resetMasterSpeed()" class="bg-gray-700 text-white rounded-full w-6 h-6 flex items-center justify-center text-[10px] font-bold active:bg-gray-500 transition">1x</button>
        </div>
    </div>

    <div class="pad-container max-w-xl shadow-2xl">
        <div id="padGrid"></div>
        <div class="side-scroll-track" id="sideScroll"></div>
    </div>

    <div id="modal" class="fixed inset-0 hidden z-50 flex flex-col bg-[#050505] pb-[50px]">
        <div class="flex justify-between items-center p-3 bg-gray-900 border-b border-gray-800">
            <button onclick="closePopup()" class="text-gray-400 font-bold text-xs uppercase px-2 py-1">Back</button>
            <div class="flex space-x-2">
                <button id="playBtn" onclick="togglePlay()" class="bg-red-600 text-white px-4 py-2 rounded-xl text-[10px] font-black shadow-lg">STOP</button>
                <button onclick="addClipAtPlayhead()" class="bg-green-600 text-black px-4 py-2 rounded-xl text-[10px] font-black">+ CLIP</button>
                <button onclick="deleteSelectedClip()" class="bg-red-900 text-white px-4 py-2 rounded-xl text-[10px] font-black">Del</button>
            </div>
            <button onclick="saveAndSend()" class="bg-white text-black font-black px-4 py-2 rounded-lg text-xs uppercase active:bg-gray-300">Save</button>
        </div>
        
        <div id="timelineViewport" onclick="handleTimelineClick(event)">
            <div id="timelineContent">
                <div id="playhead"></div>
                <div id="loopLine"></div>
                <div id="trackArea" class="relative h-full py-2"></div>
            </div>
        </div>
        <div class="flex justify-between bg-black text-[9px] text-gray-500 font-mono px-2 py-1">
            <span id="timeText">PLAYHEAD: 0.0s</span>
            <span>* กดก้อนแช่ไว้เพื่อ COPY</span>
        </div>

        <div class="bg-gray-900 border-b border-gray-800 p-2 grid grid-cols-2 gap-4">
            <div class="flex items-center space-x-2">
                <button onclick="adjZoom(-20)" class="bg-gray-700 text-white px-2 py-1 rounded text-[10px]">&lt;</button>
                <input type="range" id="zoomSlider" min="20" max="300" value="100" class="flex-1 accent-blue-500" oninput="updateZoom(this.value)">
                <button onclick="adjZoom(20)" class="bg-gray-700 text-white px-2 py-1 rounded text-[10px]">&gt;</button>
            </div>
            <div class="flex items-center space-x-2 text-[10px] font-bold text-gray-400">
                <span>TIME SCALE</span>
                <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" class="flex-1 accent-orange-500" onchange="applySpeedScale(this.value)">
            </div>
        </div>
        
        <div id="editorPanel" class="flex-1 overflow-y-auto p-3 space-y-3 opacity-30 pointer-events-none">
            
            <div class="bg-gray-900/40 p-3 rounded-2xl border border-gray-800">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] font-black text-gray-400 uppercase">Color Builder</span>
                    <div class="flex space-x-2">
                        <button onclick="addColorSlot()" class="bg-blue-600 text-white font-bold text-[9px] px-2 py-1 rounded shadow">+ ADD</button>
                        <button onclick="resetColorBuilder()" class="text-red-500 font-bold text-[9px] px-1">RESET</button>
                    </div>
                </div>
                <div id="colorSlots" class="flex items-center space-x-2 mb-3 px-1 h-8"></div>
                <div id="colorPalette" class="color-scroll flex flex-nowrap overflow-x-auto gap-2 pb-2"></div>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <div class="bg-gray-900/40 p-2 rounded-2xl border border-gray-800 text-center flex flex-col justify-center">
                    <div class="text-[9px] text-gray-500 mb-1 font-bold uppercase">Bright</div>
                    <input type="number" id="cBright" value="10" class="bg-transparent text-center font-black text-lg w-full outline-none" oninput="updateSelectedClip()">
                </div>
                
                <div class="bg-gray-900/40 p-2 rounded-2xl border border-gray-800 flex flex-col items-center justify-center cursor-pointer" onclick="toggleMirror()">
                    <div class="text-[9px] text-gray-500 mb-1 font-bold uppercase">Mirror</div>
                    <div id="cMirrorBtn" class="w-6 h-6 rounded-full border-2 border-gray-600 transition-colors"></div>
                </div>

                <div class="bg-gray-900/40 p-2 rounded-2xl border border-gray-800 flex flex-col justify-center">
                    <div class="text-[9px] text-gray-500 mb-1 font-bold uppercase text-center">Effect</div>
                    <select id="cFX" class="w-full bg-transparent text-[10px] font-black text-green-400 uppercase outline-none text-center" onchange="updateSelectedClip()">
                        <option value="o">STATIC</option><option value="u">FADE UP</option><option value="f">FADE OUT</option><option value="s">STROBE</option><option value="b">BLINK</option>
                    </select>
                </div>
            </div>

            <div class="bg-gray-900/40 p-3 rounded-2xl border border-gray-800">
                <div id="ledGrid" class="grid grid-cols-10 gap-1 h-32 bg-black p-2 rounded-lg border border-gray-900"></div>
            </div>
        </div>

        <div class="fixed bottom-0 w-full bg-gray-950 border-t border-gray-800 p-2 flex justify-between items-center z-50">
            <div id="liveCode" class="text-[8px] font-mono text-green-400 overflow-x-auto whitespace-nowrap flex-1 mr-2">No code yet...</div>
            <button onclick="copyCode()" class="bg-gray-700 text-white text-[9px] font-bold px-3 py-1 rounded">COPY</button>
        </div>
    </div>

    <script>
        let device, characteristic;
        let patterns = Array.from({length: 60}, (_, i) => ({ id: i, code: "" }));
        
        let clips = []; 
        let selectedClipId = null;
        let selectedIdx = -1;
        let playheadTime = 0;
        let isPlaying = false;
        let playInterval, startAnimateTime;
        let currentLoopLimit = 1.0;
        let pxPerSec = 100;
        const colorMap = { 'bl': '#0000FF', 're': '#FF0000', 'gr': '#00FF00', 'ye': '#FFFF00', 'wh': '#FFFFFF', 'pu': '#8000FF', 'aq': '#00FFFF', 'or': '#FF8000', 'pi': '#FF00FF', 'cy': '#00FFFF' };
        const fxNames = { o: 'STATIC', u: 'FADE UP', f: 'FADE OUT', s: 'STROBE', b: 'BLINK' };

        const grid = document.getElementById('padGrid');
        let sortableInstance = null; 
        let isDraggingPad = false; 

        // --- ระบบ ส่งคำสั่ง Global Speed ไปที่ ESP32 ---
        async function updateMasterSpeed(val) {
            document.getElementById('masterSpeedText').innerText = parseFloat(val).toFixed(1) + 'x';
            if(!characteristic) return;
            try {
                // ส่งคำสั่ง T(ค่าความเร็ว) ไปยัง ESP32
                await characteristic.writeValueWithoutResponse(new TextEncoder().encode("T" + parseFloat(val).toFixed(1)));
            } catch(e) {}
        }
        
        function resetMasterSpeed() {
            document.getElementById('masterSpeedSlider').value = 1.0;
            updateMasterSpeed(1.0);
        }

        // --- Bluetooth Logic (ปรับปุ่ม Connect เป็น ONLINE สั้นๆ) ---
        document.getElementById('connectBtn').onclick = async () => {
            const btn = document.getElementById('connectBtn');
            if(device && device.gatt.connected) {
                device.gatt.disconnect();
                return;
            }
            try {
                device = await navigator.bluetooth.requestDevice({ 
                    filters: [{ namePrefix: 'PocketDJ-' }], optionalServices: ["0000ffe0-0000-1000-8000-00805f9b34fb"] 
                });
                device.addEventListener('gattserverdisconnected', onDisconnected);
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
                characteristic = await service.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");
                btn.innerText = "ONLINE"; // เปลี่ยนเป็นแค่ ONLINE
                btn.className = "bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl shadow-[0_0_15px_#00e676] transition";
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (e) => {
                    let val = new TextDecoder().decode(e.target.value);
                    if (val.startsWith("D")) {
                        let p = val.substring(1).split(":");
                        if(p.length >= 3) { patterns[parseInt(p[0])].code = p[2] || ""; updatePadsVisuals(); }
                    }
                });
                await characteristic.writeValue(new TextEncoder().encode("GET_ALL"));
            } catch (e) { alert("BT Error: " + e.message); }
        };

        function onDisconnected() {
            characteristic = null;
            const btn = document.getElementById('connectBtn');
            btn.innerText = "CONNECT"; btn.className = "bg-blue-600 text-white text-[10px] font-black px-4 py-2 rounded-xl active:scale-95 transition";
        }

        async function autoSyncTop10() {
            if(!characteristic) return; 
            const btn = document.getElementById('connectBtn');
            btn.innerText = "SYNCING..."; btn.className = "bg-yellow-500 text-black text-[10px] font-black px-4 py-2 rounded-xl transition";
            try {
                for(let i=0; i<10; i++) {
                    let codeToSend = patterns[i].code ? patterns[i].code : ""; 
                    await characteristic.writeValue(new TextEncoder().encode(`S${i}:${codeToSend}`));
                    await new Promise(r => setTimeout(r, 60)); 
                }
                btn.innerText = "ONLINE"; btn.className = "bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl shadow-[0_0_15px_#00e676]";
            } catch(e) { 
                btn.innerText = "ONLINE"; btn.className = "bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl shadow-[0_0_15px_#00e676]";
            }
        }

        function renderPads() {
            grid.innerHTML = '';
            patterns.forEach((p, index) => {
                const btn = document.createElement('div');
                const isPotenZone = index < 10;
                btn.className = `pad-btn ${isPotenZone ? 'poten-slot' : ''} ${p.code ? 'has-code' : ''}`;
                if(!p.code) { const hue = (p.id * 6) % 360; btn.style.backgroundColor = `hsl(${hue}, 30%, 15%)`; }
                btn.innerHTML = `<span class="text-lg font-black pad-num">${p.id + 1}</span>`;
                
                let clickTimer = null;
                btn.addEventListener('pointerdown', (e) => {
                    if (isDraggingPad) return; 
                    const currentVisualIndex = patterns.indexOf(p);
                    if (clickTimer) {
                        clearTimeout(clickTimer); clickTimer = null;
                        openPopup(currentVisualIndex); 
                    } else {
                        playFX(currentVisualIndex, btn); 
                        clickTimer = setTimeout(() => { clickTimer = null; }, 300);
                    }
                });
                grid.appendChild(btn);
            });

            if (sortableInstance) sortableInstance.destroy();
            sortableInstance = new Sortable(grid, {
                animation: 150, delay: 250, delayOnTouchOnly: false, touchStartThreshold: 5,
                forceFallback: true, fallbackClass: "sortable-drag", fallbackOnBody: true, swapThreshold: 0.65,
                onStart: () => { isDraggingPad = true; if (window.navigator.vibrate) window.navigator.vibrate(30); },
                onEnd: (evt) => {
                    const item = patterns.splice(evt.oldIndex, 1)[0];
                    patterns.splice(evt.newIndex, 0, item);
                    Array.from(grid.children).forEach((btn, i) => {
                        if (i < 10) btn.classList.add('poten-slot'); else btn.classList.remove('poten-slot');
                    });
                    autoSyncTop10();
                    setTimeout(() => { isDraggingPad = false; }, 50);
                }
            });
        }

        function updatePadsVisuals() {
            const btns = grid.children;
            patterns.forEach((p, index) => {
                const btn = btns[index];
                if (!btn) return;
                if(p.code) { btn.classList.add('has-code'); btn.style.backgroundColor = ""; } 
                else { btn.classList.remove('has-code'); const hue = (p.id * 6) % 360; btn.style.backgroundColor = `hsl(${hue}, 30%, 15%)`; }
            });
        }

        async function playFX(idx, btnElement) {
            document.querySelectorAll('.pad-btn').forEach(b => b.classList.remove('playing'));
            if(btnElement) btnElement.classList.add('playing');
            setTimeout(() => { if(btnElement) btnElement.classList.remove('playing'); }, 200);
            if(!characteristic || !patterns[idx].code) return;
            try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode("5" + patterns[idx].code)); } catch(e){}
        }

        const sideScroll = document.getElementById('sideScroll');
        let isScrolling = false, startY, startScrollTop;
        sideScroll.addEventListener('touchstart', (e) => { isScrolling = true; startY = e.touches[0].pageY; startScrollTop = grid.scrollTop; }, {passive: true});
        sideScroll.addEventListener('touchmove', (e) => { if (!isScrolling) return; grid.scrollTop = startScrollTop - ((e.touches[0].pageY - startY) * 2); }, {passive: true});
        sideScroll.addEventListener('touchend', () => isScrolling = false);

        function openPopup(idx) {
            selectedIdx = idx; clips = [];
            let rawCode = patterns[idx].code || "";
            let brackets = rawCode.match(/m?\(([^)]+)\)/g);
            if (brackets) {
                brackets.forEach((bracket, i) => {
                    let m = bracket.startsWith('m');
                    let content = bracket.replace('m','').replace('(','').replace(')','').split(',');
                    if(content.length >= 5) {
                        clips.push({ 
                            id: Date.now() + i, start: parseInt(content[0].substring(0,2))/10, bright: parseInt(content[0].substring(2,4)), 
                            target: content[1], color: content[2], fx: content[3].charAt(0), duration: parseInt(content[3].substring(1,3))/10, 
                            loop: 1, mirror: m, track: i % 6 
                        });
                    }
                });
            }
            document.getElementById('modal').classList.remove('hidden');
            initColors(); 
            renderClips();
            if(clips.length > 0) selectClip(clips[0].id);
            if (!isPlaying) togglePlay();
        }

        function closePopup() { stopPlayback(); document.getElementById('modal').classList.add('hidden'); selectedIdx = -1; updatePadsVisuals(); }

        function adjZoom(val) {
            const slider = document.getElementById('zoomSlider');
            slider.value = Math.max(20, Math.min(300, parseInt(slider.value) + val));
            updateZoom(slider.value);
        }
        function updateZoom(val) { pxPerSec = parseInt(val); document.getElementById('timelineContent').style.backgroundSize = `${pxPerSec}px 100%`; renderClips(); }

        function applySpeedScale(val) {
            let scaleRatio = parseFloat(val);
            clips.forEach(c => { c.start = c.start * scaleRatio; c.duration = c.duration * scaleRatio; });
            document.getElementById('speedSlider').value = 1.0;
            renderClips(); updateCodeMonitor();
        }

        function renderClips() {
            const area = document.getElementById('trackArea'); area.innerHTML = '';
            clips.forEach(c => {
                const div = document.createElement('div');
                div.id = `clip-${c.id}`; div.className = `light-clip ${selectedClipId === c.id ? 'selected' : ''}`;
                div.style.left = (c.start * pxPerSec) + 'px'; div.style.width = (c.duration * pxPerSec) + 'px'; 
                div.style.top = (c.track * 20) + 'px';
                div.innerText = fxNames[c.fx] || c.fx.toUpperCase();
                
                if (!c.target || c.target === '') { div.style.backgroundColor = '#555555'; div.style.color = '#aaaaaa'; } 
                else if(c.color.includes('2')) {
                    const parts = c.color.split('2');
                    div.style.background = `linear-gradient(to right, ${colorMap[parts[0]] || '#333'}, ${colorMap[parts[1]] || '#333'})`;
                } else { div.style.backgroundColor = colorMap[c.color] || '#555'; }
                
                area.appendChild(div);
                
                interact(div)
                    .draggable({
                        listeners: {
                            start(e) { c.tempY = c.track * 20; },
                            move(e) {
                                c.start += e.dx / pxPerSec; c.start = Math.max(0, c.start);
                                c.tempY += e.dy; c.track = Math.max(0, Math.min(5, Math.round(c.tempY / 20))); 
                                e.target.style.left = (c.start * pxPerSec) + 'px'; e.target.style.top = (c.track * 20) + 'px';
                                if(!isPlaying) sendLiveFrame();
                            },
                            end(e) { c.tempY = undefined; updateLoopLine(); renderClips(); sendFullCodeToBT(); updateCodeMonitor(); }
                        }
                    })
                    .resizable({ 
                        edges: { right: true, left: true }, 
                        listeners: { 
                            move(e) { 
                                if(e.edges.left) { c.start += e.dx / pxPerSec; c.start = Math.max(0, c.start); }
                                c.duration = e.rect.width / pxPerSec; c.duration = Math.max(0.1, c.duration); 
                                e.target.style.left = (c.start * pxPerSec) + 'px';
                                e.target.style.width = (c.duration * pxPerSec) + 'px'; 
                                if(!isPlaying) sendLiveFrame(); 
                            },
                            end(e) { updateLoopLine(); renderClips(); sendFullCodeToBT(); updateCodeMonitor(); }
                        } 
                    })
                    .on('tap', function(event) {
                        selectClip(c.id);
                    })
                    .on('hold', function(event) {
                        selectClip(c.id);
                        let newClip = JSON.parse(JSON.stringify(c));
                        newClip.id = Date.now(); newClip.start += 0.5; newClip.track = Math.min(5, newClip.track + 1); 
                        clips.push(newClip); renderClips();
                        if (window.navigator.vibrate) window.navigator.vibrate(50);
                    });
            });
            updateLoopLine(); updateCodeMonitor();
        }

        function addColorSlot() {
            const c = clips.find(x => x.id === selectedClipId);
            if(c) {
                let parts = c.color.split('2');
                parts.push(parts[parts.length-1]); 
                c.color = parts.join('2');
                updateSelectedClip();
            }
        }
        function setLastColor(k) {
            const c = clips.find(x => x.id === selectedClipId);
            if(c) {
                let parts = c.color.split('2');
                parts[parts.length - 1] = k; 
                c.color = parts.join('2');
                updateSelectedClip();
            }
        }
        function resetColorBuilder() {
            const c = clips.find(x => x.id === selectedClipId);
            if(c) { c.color = 'bl'; updateSelectedClip(); }
        }
        function renderColorBuilderSlots() {
            const c = clips.find(x => x.id === selectedClipId);
            const slots = document.getElementById('colorSlots');
            slots.innerHTML = '';
            if(!c) return;

            let colors = c.color.split('2');
            colors.forEach((col, idx) => {
                let box = document.createElement('div');
                const isLast = (idx === colors.length - 1);
                box.className = `w-6 h-6 rounded border-2 shadow-lg flex-shrink-0 transition-transform ${isLast ? 'border-white scale-110' : 'border-gray-700'}`;
                box.style.backgroundColor = colorMap[col] || '#333';
                slots.appendChild(box);
            });
        }
        function initColors() {
            const p = document.getElementById('colorPalette'); p.innerHTML = '';
            Object.keys(colorMap).forEach(k => {
                const d = document.createElement('div'); d.className = 'w-6 h-6 rounded border border-gray-700 flex-shrink-0 cursor-pointer'; d.style.backgroundColor = colorMap[k];
                d.onclick = () => setLastColor(k);
                p.appendChild(d);
            });
        }

        function toggleMirror() {
            const c = clips.find(x => x.id === selectedClipId);
            if(c) {
                c.mirror = !c.mirror;
                if(c.mirror) {
                    let currentLEDs = c.target.match(/<(\d+)>/g) || [];
                    currentLEDs.forEach(led => {
                        let num = parseInt(led.replace(/<|>/g, ''));
                        let pair = 69 - num; 
                        if(pair > 0 && pair <= 300 && !c.target.includes('<'+pair+'>')) {
                            c.target += '<'+pair+'>';
                        }
                    });
                }
                updateSelectedClip();
            }
        }
        function updateMirrorUI(isMirror) {
            const btn = document.getElementById('cMirrorBtn');
            if(isMirror) {
                btn.className = "w-6 h-6 rounded-full border-2 border-green-500 bg-green-500 shadow-[0_0_8px_#00e676]";
            } else {
                btn.className = "w-6 h-6 rounded-full border-2 border-gray-600 bg-transparent";
            }
        }

        function selectClip(id) {
            selectedClipId = id; const c = clips.find(x => x.id === id);
            document.getElementById('editorPanel').style.opacity = "1"; document.getElementById('editorPanel').style.pointerEvents = "auto";
            document.getElementById('cBright').value = c.bright; document.getElementById('cFX').value = c.fx;
            updateMirrorUI(c.mirror); 
            renderLEDGrid(); renderColorBuilderSlots();
            
            document.querySelectorAll('.light-clip').forEach(el => {
                if (el.id === `clip-${id}`) el.classList.add('selected'); else el.classList.remove('selected');
            });
            if(!isPlaying) sendLiveFrame();
        }

        function updateSelectedClip() {
            if(!selectedClipId) return; const c = clips.find(x => x.id === selectedClipId);
            c.bright = document.getElementById('cBright').value; c.fx = document.getElementById('cFX').value;
            updateMirrorUI(c.mirror);
            renderClips(); renderColorBuilderSlots(); if(!isPlaying) sendLiveFrame(); else sendFullCodeToBT();
        }

        function renderLEDGrid() {
            const grid = document.getElementById('ledGrid'); grid.innerHTML = '';
            const c = clips.find(x => x.id === selectedClipId);
            if(!c) return;

            const markers = [7,8,9,10, 18,19,20,21, 29,30,31,32, 37,38,39,40, 48,49,50,51, 59,60,61,62];

            for(let i=1; i<=300; i++) { 
                const d = document.createElement('div'); d.innerText = i;
                let isMarked = markers.includes(i) ? 'led-mark' : 'border-[#222]';
                let isActive = c.target.includes('<'+i+'>') ? 'led-active' : 'bg-[#111] text-gray-400';
                
                d.className = `text-[8px] h-6 border rounded flex items-center justify-center cursor-pointer ${isMarked} ${isActive}`;
                
                d.addEventListener('click', (e) => { 
                    let targetStr = '<' + i + '>';
                    let pair = c.mirror ? (69 - i) : null;
                    let pairStr = pair ? '<' + pair + '>' : '';

                    if(c.target.includes(targetStr)) { 
                        c.target = c.target.replace(targetStr,''); 
                        if(pairStr) c.target = c.target.replace(pairStr,'');
                    } else { 
                        c.target += targetStr; 
                        if(pairStr && !c.target.includes(pairStr)) c.target += pairStr;
                    } 
                    renderLEDGrid(); updateSelectedClip(); 
                });
                grid.appendChild(d);
            }
        }

        function generateCodeStr() {
            let code = "";
            clips.sort((a,b)=>a.start-b.start).forEach(c => {
                let m = c.mirror ? 'm' : '';
                let s = Math.round(c.start*10).toString().padStart(2,'0'), b = parseInt(c.bright).toString().padStart(2,'0'), d = Math.round(c.duration*10).toString().padStart(2,'0');
                code += `${m}(${s}${b},${c.target || 'a'},${c.color},${c.fx}${d}00,1)`;
            });
            return code;
        }
        function updateCodeMonitor() { document.getElementById('liveCode').innerText = generateCodeStr() || "No code yet..."; }
        function copyCode() { navigator.clipboard.writeText(generateCodeStr()).then(() => alert("Copied!")); }

        async function saveAndSend() {
            patterns[selectedIdx].code = generateCodeStr();
            if(characteristic) await characteristic.writeValue(new TextEncoder().encode(`S${selectedIdx}:${patterns[selectedIdx].code}`));
            closePopup(); 
            if(selectedIdx < 10) autoSyncTop10();
        }
        
        function updateLoopLine() { let maxT = 0; clips.forEach(c => { let end = c.start + c.duration; if (end > maxT) maxT = end; }); currentLoopLimit = maxT > 0 ? maxT : 1.0; const ll = document.getElementById('loopLine'); if (ll) { ll.style.left = (currentLoopLimit * pxPerSec) + 'px'; ll.style.display = clips.length > 0 ? 'block' : 'none'; } }
        function addClipAtPlayhead() { const id = Date.now(); clips.push({ id, start: playheadTime, duration: 1.0, target: "", color: "bl", fx: "o", bright: 10, loop: 1, mirror: false, track: clips.length % 6 }); renderClips(); selectClip(id); }
        function deleteSelectedClip() { if(selectedClipId) { clips = clips.filter(c => c.id !== selectedClipId); selectedClipId = null; renderClips(); } }
        function handleTimelineClick(e) { if(isPlaying) return; const rect = document.getElementById('timelineContent').getBoundingClientRect(); playheadTime = Math.max(0, (e.clientX - rect.left) / pxPerSec); document.getElementById('playhead').style.left = (playheadTime * pxPerSec) + 'px'; }
        
        function togglePlay() { const btn = document.getElementById('playBtn'); if (!isPlaying) { isPlaying = true; btn.innerText = "STOP"; btn.classList.replace('bg-blue-600', 'bg-red-600'); sendFullCodeToBT(); startAnimateTime = performance.now() - (playheadTime * 1000); playInterval = requestAnimationFrame(animatePlayhead); } else { stopPlayback(); } }
        function stopPlayback() { isPlaying = false; const btn = document.getElementById('playBtn'); if (btn) { btn.innerText = "PLAY"; btn.classList.replace('bg-red-600', 'bg-blue-600'); } cancelAnimationFrame(playInterval); if(selectedClipId) sendLiveFrame(); }
        function animatePlayhead(currentTime) { if (!isPlaying) return; let elapsed = (currentTime - startAnimateTime) / 1000; if (elapsed >= currentLoopLimit) { startAnimateTime = currentTime; elapsed = 0; sendFullCodeToBT(); } playheadTime = elapsed; document.getElementById('playhead').style.left = (playheadTime * pxPerSec) + 'px'; document.getElementById('timeText').innerText = `PLAYHEAD: ${playheadTime.toFixed(1)}s / END: ${currentLoopLimit.toFixed(1)}s`; playInterval = requestAnimationFrame(animatePlayhead); }
        
        async function sendFullCodeToBT() { if(!characteristic) return; let code = "5" + generateCodeStr(); try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode(code)); } catch(e){} }
        async function sendLiveFrame() { if(!characteristic || !selectedClipId) return; const c = clips.find(x => x.id === selectedClipId); let b = parseInt(c.bright).toString().padStart(2,'0'); let code = `5${c.mirror?'m':''}(00${b},${c.target || 'a'},${c.color},o9900,1)`; try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode(code)); } catch(e){} }

        renderPads();
    </script>
</body>
</html>
