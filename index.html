<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket DJ Studio - PRO Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; background: #050505; color: white; 
            user-select: none; overflow: hidden; height: 100vh;
            display: flex; flex-direction: column;
        }

        /* --- กรอบขังปุ่ม และ แถบสไลด์ข้าง --- */
        .pad-container {
            margin: 0 auto; width: 95%; height: 65vh; 
            background: #0a0a0a; border: 2px solid #222; border-radius: 20px;
            position: relative; overflow: hidden; display: flex;
        }
        #padGrid {
            flex: 1; display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 10px; padding: 15px; overflow-y: scroll; scrollbar-width: none; 
            touch-action: none; /* ห้ามสไลด์ทับปุ่ม */
        }
        #padGrid::-webkit-scrollbar { display: none; } 
        .side-scroll-track {
            width: 35px; background: #111; border-left: 1px solid #222;
            display: flex; align-items: center; justify-content: center;
            touch-action: pan-y; cursor: ns-resize;
        }
        .side-scroll-track::after { content: '↕'; color: #444; font-size: 20px; }

        /* --- ปุ่มกด และ จุดดึงไข่ปลา --- */
        .pad-btn { 
            background: #151515; border: 1px solid #333; aspect-ratio: 1/1; 
            border-radius: 12px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; position: relative; transition: 0.1s;
        }
        .pad-btn.active { background: #00e676 !important; color: black; box-shadow: 0 0 15px #00e676; border-color: #fff; }
        .drag-handle { 
            position: absolute; top: 0; left: 0; width: 35px; height: 35px; 
            display: flex; align-items: center; justify-content: center; 
            color: #444; font-size: 16px; cursor: grab; z-index: 10;
        }

        /* สไตล์ตอนกำลังลาก */
        .sortable-ghost { opacity: 0.1; background: #00e676 !important; }
        .sortable-drag { 
            opacity: 1 !important; transform: scale(1.1) !important; 
            z-index: 9999 !important; box-shadow: 0 15px 30px #000 !important; 
            border: 2px solid #00e676 !important; background: #222 !important; pointer-events: none;
        }

        /* --- Popup Designer Styles --- */
        #timelineViewport { background: #0a0a0a; border-bottom: 1px solid #222; position: relative; height: 180px; overflow-x: auto; overflow-y: hidden; }
        #timelineContent { position: relative; height: 100%; width: 1500px; background-image: linear-gradient(to right, #1a1a1a 1px, transparent 1px); background-size: 100px 100%; }
        #playhead { position: absolute; top: 0; width: 2px; height: 100%; background: #ff3d00; z-index: 50; pointer-events: none; box-shadow: 0 0 8px #ff3d00; }
        #loopLine { position: absolute; top: 0; width: 2px; height: 100%; background: #00e676; z-index: 45; pointer-events: none; box-shadow: 0 0 10px #00e676; opacity: 0.8; }
        .light-clip { position: absolute; height: 34px; color: black; border-radius: 6px; font-size: 9px; font-weight: 900; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; border: 1px solid rgba(255,255,255,0.2); }
        .light-clip.selected { border: 2px solid white; box-shadow: 0 0 12px #00e676; z-index: 40; }
        .slider-box { background: #121212; padding: 10px; border-radius: 15px; border: 1px solid #252525; }
        .led-dot { font-size: 8px; height: 28px; background: #111; border: 1px solid #222; border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .led-dot.active { background: #00e676; color: black; font-weight: bold; }
        .color-dot { width: 32px; height: 32px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
    </style>
</head>
<body class="p-4">

    <div id="consoleView" class="max-w-xl mx-auto w-full">
        <div class="flex justify-between items-center mb-4 bg-gray-900/50 p-4 rounded-3xl border border-gray-800 shadow-xl">
            <h1 class="text-lg font-black text-green-500 italic uppercase">Pocket DJ Studio</h1>
            <button id="connectBtn" class="bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl active:scale-95 transition">CONNECT</button>
        </div>
    </div>

    <div class="pad-container max-w-xl shadow-2xl">
        <div id="padGrid"></div>
        <div class="side-scroll-track" id="sideScroll"></div>
    </div>

    <div class="max-w-xl mx-auto w-full mt-4 bg-gray-900/30 p-3 rounded-2xl border border-gray-800">
        <div class="flex justify-between text-[10px] font-bold text-gray-500 uppercase mb-2">
            <span>Global Playback Speed</span><span id="speedVal" class="text-green-500">1.0x</span>
        </div>
        <input type="range" id="globalSpeed" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full accent-green-500" oninput="speedVal.innerText=this.value+'x'; updateGlobalSpeed(this.value)">
    </div>

    <div id="modal" class="fixed inset-0 hidden z-50 flex flex-col bg-[#050505]">
        <div class="flex justify-between items-center p-3 bg-gray-900 border-b border-gray-800">
            <button onclick="closePopup()" class="text-gray-400 font-bold text-xs uppercase">Back</button>
            <div class="flex space-x-2">
                <button id="playBtn" onclick="togglePlay()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black">PLAY</button>
                <button onclick="addClipAtPlayhead()" class="bg-green-600 text-black px-4 py-2 rounded-xl text-[10px] font-black">+ CLIP</button>
                <button onclick="deleteSelectedClip()" class="bg-red-900 text-white px-4 py-2 rounded-xl text-[10px] font-black">Del</button>
            </div>
            <button onclick="saveAndSend()" class="bg-white text-black font-black px-4 py-2 rounded-lg text-xs uppercase tracking-widest">Save</button>
        </div>

        <div id="timelineViewport" onclick="handleTimelineClick(event)">
            <div id="timelineContent">
                <div id="playhead"></div><div id="loopLine"></div><div id="trackArea" class="relative h-full py-6"></div>
            </div>
        </div>
        <div id="timeText" class="bg-black text-[10px] text-center p-1 text-gray-500 font-mono">PLAYHEAD: 0.0s</div>

        <div id="editorPanel" class="flex-1 overflow-y-auto p-4 space-y-3 opacity-30 pointer-events-none pb-12">
            <div class="slider-box">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] font-black text-gray-400 uppercase">Color (Mix: bl2re)</span>
                    <input type="text" id="customColor" class="bg-black border border-gray-800 px-2 py-1 rounded text-[10px] text-green-500 outline-none w-20 text-center font-mono" oninput="updateSelectedClip()">
                </div>
                <div id="colorPalette" class="flex flex-wrap gap-2 justify-center"></div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="slider-box text-center">
                    <div class="text-[9px] text-gray-500 mb-1 font-bold uppercase">Bright (0-99)</div>
                    <div class="flex justify-center space-x-2">
                        <button onclick="adjBright(-10)" class="bg-gray-800 w-8 h-8 rounded-lg">-</button>
                        <input type="number" id="cBright" value="50" class="bg-transparent text-center font-black text-xl w-12 outline-none" oninput="updateSelectedClip()">
                        <button onclick="adjBright(10)" class="bg-gray-800 w-8 h-8 rounded-lg">+</button>
                    </div>
                </div>
                <div class="slider-box">
                    <div class="text-[9px] text-gray-500 mb-1 font-bold uppercase">Effect</div>
                    <select id="cFX" class="w-full h-8 bg-transparent text-xs font-black text-green-400 uppercase outline-none" onchange="updateSelectedClip()">
                        <option value="u">Fade Up</option><option value="f">Fade Out</option><option value="s">Strobe</option><option value="o">Static</option><option value="b">Blink</option>
                    </select>
                </div>
            </div>
            <div class="slider-box pb-4">
                <div class="flex justify-between text-[9px] mb-1 font-black text-gray-500"><span>LEDs (1-300)</span><button onclick="clearLEDs()" class="text-red-500 uppercase">Clear</button></div>
                <div id="ledGrid" class="grid grid-cols-10 gap-1.5 h-32 overflow-y-auto bg-black p-2 rounded-lg"></div>
            </div>
            <div class="grid grid-cols-2 gap-2 pb-6">
                <div class="slider-box flex items-center justify-center space-x-2" onclick="document.getElementById('cMirror').click()">
                    <input type="checkbox" id="cMirror" class="accent-green-500 w-4 h-4" onchange="updateSelectedClip()">
                    <span class="text-[10px] font-bold uppercase">Mirror</span>
                </div>
                <div class="slider-box text-center">
                    <div class="text-[9px] text-gray-500 mb-1 font-bold">LOOP</div>
                    <input type="number" id="cLoop" value="1" class="bg-transparent w-full text-center font-black text-xl" oninput="updateSelectedClip()">
                </div>
            </div>
        </div>
    </div>

    <script>
        let device, characteristic;
        let patterns = Array.from({length: 60}, (_, i) => ({ id: i, code: "" }));
        let clips = [], selectedClipId = null, selectedIdx = -1, playheadTime = 0, isPlaying = false, playInterval, startAnimateTime, currentLoopLimit = 1.0;
        const pxPerSec = 100, colorMap = { 'bl': '#0000FF', 're': '#FF0000', 'gr': '#00FF00', 'ye': '#FFFF00', 'wh': '#FFFFFF', 'pu': '#8000FF', 'aq': '#00FFFF', 'or': '#FF8000' };

        const grid = document.getElementById('padGrid');

        // --- 1. ระบบจัดการปุ่มหน้าแรก ---
        function renderPads() {
            grid.innerHTML = '';
            patterns.forEach((p, idx) => {
                const btn = document.createElement('div');
                btn.className = `pad-btn ${p.code ? 'border-green-500 shadow-[inset_0_0_10px_rgba(0,230,118,0.2)]' : ''}`;
                btn.setAttribute('data-idx', idx); // เก็บตำแหน่งปัจจุบันไว้ใช้อ้างอิง

                btn.innerHTML = `
                    <div class="drag-handle">⠿</div>
                    <span class="text-xs font-black pad-num">${idx + 1}</span>
                `;
                
                let lastTap = 0;
                let tapTimer;
                
                // ระบบแยก Single Tap (เล่นไฟ) กับ Double Tap (แก้ไฟ)
                btn.onclick = (e) => {
                    if (e.target.classList.contains('drag-handle')) return;
                    
                    const currentIdx = parseInt(btn.getAttribute('data-idx'));
                    const now = Date.now();
                    
                    if (now - lastTap < 300) { 
                        clearTimeout(tapTimer); // ยกเลิกการเล่นไฟ
                        openPopup(currentIdx);  // เคาะ 2 ที -> เปิด Popup
                    } else {
                        tapTimer = setTimeout(() => {
                            playFX(currentIdx, btn); // เคาะ 1 ที -> เล่นไฟ
                        }, 300);
                    }
                    lastTap = now;
                };

                grid.appendChild(btn);
            });

            // ระบบลากสลับที่
            new Sortable(grid, {
                handle: '.drag-handle',
                animation: 150,
                forceFallback: true,
                fallbackClass: "sortable-drag",
                fallbackOnBody: true,
                swapThreshold: 0.65,
                onEnd: (evt) => {
                    // สลับตำแหน่งข้อมูลใน Array จริงๆ
                    const item = patterns.splice(evt.oldIndex, 1)[0];
                    patterns.splice(evt.newIndex, 0, item);
                    
                    // อัปเดตตัวเลขและ data-idx ให้ตรงกับหน้าจอใหม่ โดยไม่ต้องวาดใหม่ทั้งหมด
                    Array.from(grid.children).forEach((child, i) => {
                        child.querySelector('.pad-num').innerText = i + 1;
                        child.setAttribute('data-idx', i);
                    });
                }
            });
        }

        // --- 2. ระบบ Bluetooth ---
        document.getElementById('connectBtn').onclick = async () => {
            try {
                device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'PocketDJ-' }], optionalServices: ["0000ffe0-0000-1000-8000-00805f9b34fb"] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
                characteristic = await service.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");
                
                document.getElementById('connectBtn').innerText = "ONLINE";
                document.getElementById('connectBtn').className = "bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl";
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (e) => {
                    let val = new TextDecoder().decode(e.target.value);
                    if (val.startsWith("D")) {
                        let p = val.substring(1).split(":");
                        if(p.length >= 3) { patterns[parseInt(p[0])].code = p[2] || ""; renderPads(); }
                    }
                });
                await characteristic.writeValue(new TextEncoder().encode("GET_ALL"));
            } catch (e) { alert("BT Error: " + e.message); }
        };

        async function playFX(idx, el) {
            if(!characteristic || !patterns[idx].code) return;
            document.querySelectorAll('.pad-btn').forEach(b => b.classList.remove('active'));
            if(el) { el.classList.add('active'); setTimeout(() => el.classList.remove('active'), 300); }
            try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode("5" + patterns[idx].code)); } catch(e){}
        }

        async function updateGlobalSpeed(v) { if(characteristic) await characteristic.writeValueWithoutResponse(new TextEncoder().encode("T" + v)); }

        // --- 3. ระบบ Popup Designer ---
        function openPopup(idx) {
            selectedIdx = idx; clips = [];
            let rawCode = patterns[idx].code || "";
            let brackets = rawCode.match(/m?\(([^)]+)\)/g);
            if (brackets) {
                brackets.forEach((bracket, i) => {
                    let m = bracket.startsWith('m');
                    let content = bracket.replace('m','').replace('(','').replace(')','').split(',');
                    if(content.length >= 5) {
                        clips.push({ 
                            id: Date.now() + i, start: parseInt(content[0].substring(0,2))/10, bright: parseInt(content[0].substring(2,4)), 
                            target: content[1], color: content[2], fx: content[3].charAt(0), 
                            duration: parseInt(content[3].substring(1,3))/10, loop: parseInt(content[4]||1), mirror: m, track: i % 3 
                        });
                    }
                });
            }
            document.getElementById('modal').classList.remove('hidden');
            initColors(); renderLEDGrid(); renderClips();
            if(clips.length > 0) selectClip(clips[0].id);
        }

        function closePopup() { stopPlayback(); document.getElementById('modal').classList.add('hidden'); selectedIdx = -1; }

        async function saveAndSend() {
            let code = "";
            clips.sort((a,b)=>a.start-b.start).forEach(c => {
                let m = c.mirror ? 'm' : '';
                let s = Math.round(c.start*10).toString().padStart(2,'0'), b = parseInt(c.bright).toString().padStart(2,'0'), d = Math.round(c.duration*10).toString().padStart(2,'0');
                code += `${m}(${s}${b},${c.target || 'a'},${c.color},${c.fx}${d}00,${c.loop})`;
            });
            patterns[selectedIdx].code = code;
            if(characteristic) await characteristic.writeValue(new TextEncoder().encode(`S${selectedIdx}:${code}`));
            closePopup(); renderPads();
        }

        // --- 4. ฟังก์ชันย่อยของ Designer ---
        function renderClips() {
            const area = document.getElementById('trackArea'); area.innerHTML = '';
            clips.forEach(c => {
                const div = document.createElement('div');
                div.id = `clip-${c.id}`; div.className = `light-clip ${selectedClipId === c.id ? 'selected' : ''}`;
                div.style.left = (c.start * pxPerSec) + 'px'; div.style.width = (c.duration * pxPerSec) + 'px'; div.style.top = (c.track * 40) + 'px';
                div.innerText = c.color.toUpperCase();
                if(c.color.includes('2')) {
                    const parts = c.color.split('2');
                    div.style.background = `linear-gradient(to right, ${colorMap[parts[0]] || '#333'}, ${colorMap[parts[1]] || '#333'})`;
                } else { div.style.backgroundColor = colorMap[c.color] || '#555'; }
                div.onclick = (e) => { e.stopPropagation(); selectClip(c.id); };
                area.appendChild(div);
                interact(div).draggable({ listeners: { move(e) { c.start += e.dx/pxPerSec; c.start=Math.max(0, c.start); renderClips(); sendFullCodeToBT(); } } })
                            .resizable({ edges: { right: true }, listeners: { move(e) { c.duration = e.rect.width/pxPerSec; c.duration=Math.max(0.1, c.duration); renderClips(); sendFullCodeToBT(); } } });
            });
            updateLoopLine();
        }

        function selectClip(id) {
            selectedClipId = id; const c = clips.find(x => x.id === id);
            const panel = document.getElementById('editorPanel');
            panel.style.opacity = "1"; panel.style.pointerEvents = "auto";
            document.getElementById('cBright').value = c.bright;
            document.getElementById('cFX').value = c.fx;
            document.getElementById('customColor').value = c.color;
            document.getElementById('cLoop').value = c.loop;
            document.getElementById('cMirror').checked = c.mirror;
            renderLEDGrid(); renderClips();
        }

        function updateSelectedClip() {
            if(!selectedClipId) return;
            const c = clips.find(x => x.id === selectedClipId);
            c.bright = document.getElementById('cBright').value;
            c.fx = document.getElementById('cFX').value;
            c.color = document.getElementById('customColor').value;
            c.loop = document.getElementById('cLoop').value;
            c.mirror = document.getElementById('cMirror').checked;
            renderClips(); sendFullCodeToBT();
        }

        function addClipAtPlayhead() {
            const id = Date.now();
            clips.push({ id, start: playheadTime, duration: 1.0, target: "", color: "bl", fx: "u", bright: 50, loop: 1, mirror: false, track: clips.length % 3 });
            renderClips(); selectClip(id);
        }

        function deleteSelectedClip() {
            if(selectedClipId) { clips = clips.filter(c => c.id !== selectedClipId); selectedClipId = null; document.getElementById('editorPanel').style.opacity = "0.3"; renderClips(); sendFullCodeToBT(); }
        }

        function initColors() {
            const p = document.getElementById('colorPalette'); p.innerHTML = '';
            Object.keys(colorMap).forEach(k => {
                const d = document.createElement('div'); d.className = 'color-dot'; d.style.backgroundColor = colorMap[k];
                d.onclick = () => { const c = clips.find(x => x.id === selectedClipId); if (c) { c.color = k; document.getElementById('customColor').value = k; updateSelectedClip(); } };
                p.appendChild(d);
            });
        }

        function renderLEDGrid() {
            const grid = document.getElementById('ledGrid'); grid.innerHTML = '';
            const c = clips.find(x => x.id === selectedClipId);
            if(!c) return;
            for(let i=1; i<=300; i++) {
                const d = document.createElement('div'); d.innerText = i; d.className = `led-dot ${c.target.includes('<'+i+'>') ? 'active' : ''}`;
                d.onclick = () => { if(c.target.includes('<'+i+'>')) c.target = c.target.replace('<'+i+'>',''); else c.target += `<${i}>`; renderLEDGrid(); updateSelectedClip(); };
                grid.appendChild(d);
            }
        }

        function adjBright(v) { const input = document.getElementById('cBright'); input.value = Math.max(0, Math.min(99, parseInt(input.value) + v)); updateSelectedClip(); }
        function clearLEDs() { const c = clips.find(x => x.id === selectedClipId); if(c) { c.target = ""; renderLEDGrid(); updateSelectedClip(); } }

        // --- 5. Timeline & Playback ---
        function handleTimelineClick(e) { const rect = document.getElementById('timelineContent').getBoundingClientRect(); playheadTime = Math.max(0, (e.clientX - rect.left) / pxPerSec); updatePlayheadUI(); }
        function togglePlay() { if (!characteristic) return alert("Please Connect First!"); const btn = document.getElementById('playBtn'); if (!isPlaying) { isPlaying = true; btn.innerText = "STOP"; btn.classList.replace('bg-blue-600', 'bg-red-600'); sendFullCodeToBT(); startAnimateTime = performance.now() - (playheadTime * 1000); playInterval = requestAnimationFrame(animatePlayhead); } else { stopPlayback(); } }
        function stopPlayback() { isPlaying = false; document.getElementById('playBtn').innerText = "PLAY"; document.getElementById('playBtn').classList.replace('bg-red-600', 'bg-blue-600'); cancelAnimationFrame(playInterval); }
        function animatePlayhead(currentTime) { if (!isPlaying) return; let elapsed = (currentTime - startAnimateTime) / 1000; if (elapsed >= currentLoopLimit) { startAnimateTime = currentTime; elapsed = 0; sendFullCodeToBT(); } playheadTime = elapsed; updatePlayheadUI(); playInterval = requestAnimationFrame(animatePlayhead); }
        function updatePlayheadUI() { const ph = document.getElementById('playhead'); if (ph) ph.style.left = (playheadTime * pxPerSec) + 'px'; const el = document.getElementById('timeText'); if (el) el.innerText = `PLAYHEAD: ${playheadTime.toFixed(1)}s / END: ${currentLoopLimit.toFixed(1)}s`; }
        function updateLoopLine() { let maxT = 0; clips.forEach(c => { let end = c.start + c.duration; if (end > maxT) maxT = end; }); currentLoopLimit = maxT > 0 ? maxT : 1.0; const ll = document.getElementById('loopLine'); if (ll) { ll.style.left = (currentLoopLimit * pxPerSec) + 'px'; ll.style.display = clips.length > 0 ? 'block' : 'none'; } }
        
        async function sendFullCodeToBT() {
            if(!characteristic) return;
            let code = "5";
            let sortedClips = [...clips].sort((a,b)=>a.start-b.start);
            sortedClips.forEach(c => {
                let m = c.mirror ? 'm' : '';
                let s = Math.round(c.start*10).toString().padStart(2,'0'), b = parseInt(c.bright).toString().padStart(2,'0'), d = Math.round(c.duration*10).toString().padStart(2,'0');
                code += `${m}(${s}${b},${c.target || 'a'},${c.color},${c.fx}${d}00,${c.loop})`;
            });
            try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode(code)); } catch(e){}
        }

        // --- 6. ระบบสไลด์แถบข้าง ---
        const sideScroll = document.getElementById('sideScroll');
        let isScrolling = false, startY, startScrollTop;
        sideScroll.addEventListener('touchstart', (e) => { isScrolling = true; startY = e.touches[0].pageY; startScrollTop = grid.scrollTop; }, {passive: true});
        sideScroll.addEventListener('touchmove', (e) => { if (!isScrolling) return; const deltaY = (e.touches[0].pageY - startY) * 2.5; grid.scrollTop = startScrollTop - deltaY; }, {passive: true});
        sideScroll.addEventListener('touchend', () => isScrolling = false);

        renderPads();
    </script>
</body>
</html>
