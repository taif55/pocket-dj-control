<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket DJ - Sequencer Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: white; user-select: none; }
        .pad-btn { background: #1a1a1a; border: 1px solid #333; transition: 0.2s; aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; position: relative; }
        .pad-btn.active { background: #00e676; color: black; border-color: #fff; box-shadow: 0 0 15px #00e676; z-index: 10; }
        .pad-btn:active { transform: scale(0.95); }
        .pad-label { font-size: 10px; font-weight: bold; margin-top: 4px; opacity: 0.6; }
        .slider-box { background: #151515; padding: 10px; border-radius: 15px; border: 1px solid #222; margin-bottom: 8px; }
        .led-dot { font-size: 8px; height: 28px; background: #111; border: 1px solid #222; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .led-dot.active { background: #00e676; color: black; box-shadow: 0 0 8px #00e676; }
        input[type=range] { accent-color: #00e676; }
        .ghost { opacity: 0.4; background: #00e676 !important; }
        #codeEditor { font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.2; }
        
        /* สไตล์ใหม่สำหรับ Timeline Scroll */
        #timelineScroll { scroll-snap-type: y mandatory; }
        .timeline-item { scroll-snap-align: start; height: 32px; display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; font-size: 11px; border-radius: 8px; transition: 0.2s; }
        .timeline-item.active { background: #00e676; color: black; font-weight: bold; font-size: 13px; }
        
        /* สไตล์สำหรับ Quick Color Palette */
        .color-palette-btn { width: 100%; height: 32px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
        .color-palette-btn.active { border-color: white; box-shadow: 0 0 8px currentColor; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-xl mx-auto">
        <div class="flex justify-between items-center mb-4 bg-gray-900/80 p-4 rounded-2xl border border-gray-800 shadow-2xl">
            <div>
                <h1 class="text-xl font-black text-green-500 tracking-tighter">POCKET DJ CONSOLE</h1>
                <div id="status" class="text-[10px] text-red-500 font-bold uppercase tracking-widest">● Disconnected</div>
            </div>
            <button id="connectBtn" class="bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl shadow-lg active:scale-90 transition">CONNECT</button>
        </div>

        <div id="padGrid" class="grid grid-cols-5 gap-2 mb-24">
            </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/98 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#0f0f0f] w-full max-w-sm rounded-3xl p-6 border border-gray-800 flex space-x-4 h-[90vh]">
            
            <div class="flex-1 overflow-y-auto pr-2 space-y-1">
                <h2 id="modalTitle" class="text-center font-black text-green-400 mb-3 tracking-widest uppercase italic text-sm">Slot 1</h2>
                
                <div class="slider-box bg-black/50">
                    <textarea id="codeEditor" class="w-full bg-black text-green-400 p-3 rounded-xl border border-gray-800 outline-none h-16" placeholder="(...)" oninput="syncFromCode()"></textarea>
                </div>

                <div class="slider-box">
                    <div id="ledGrid" class="grid grid-cols-6 gap-1 h-32 overflow-y-auto p-2 bg-black rounded-lg border border-gray-900"></div>
                    <button onclick="clearLEDs()" class="text-red-500 text-[9px] mt-1 w-full text-right uppercase">Clear Grid</button>
                </div>

                <div class="slider-box"><div class="text-[9px] text-gray-500 uppercase">Bright</div><input type="range" id="s2" min="0" max="99" value="10" oninput="livePre(); updateCode();"></div>
                <div class="grid grid-cols-2 gap-2"><input type="text" id="s4" placeholder="Group" class="bg-black border border-gray-800 p-2 rounded-xl text-center text-sm outline-none" oninput="livePre(); updateCode();"></div>
                <div class="slider-box">
                    <select id="s6" class="w-full bg-transparent text-sm font-black text-center text-green-400 uppercase outline-none" onchange="livePre(); updateCode();">
                        <option value="u">Fade Up/Down</option><option value="f">Fade Out</option><option value="s">Strobe</option><option value="o">Static</option><option value="b">Blink</option>
                    </select>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="slider-box"><input type="number" id="s7" value="1.0" step="0.1" class="w-full bg-transparent text-center text-xs" oninput="livePre(); updateCode();"></div>
                    <div class="slider-box"><input type="number" id="s8" value="0.0" step="0.1" class="w-full bg-transparent text-center text-xs" oninput="livePre(); updateCode();"></div>
                    <div class="slider-box"><input type="number" id="s9" value="1" class="w-full bg-transparent text-center text-xs" oninput="livePre(); updateCode();"></div>
                </div>

                <div class="flex space-x-2 mt-4 pt-3 border-t border-gray-800">
                    <button onclick="closePopup()" class="flex-1 py-3 bg-gray-900 rounded-xl text-[10px] font-bold text-gray-500 uppercase">Close</button>
                    <button onclick="saveAndSend()" class="flex-1 py-3 bg-green-500 text-black font-black rounded-xl text-[10px] uppercase">Save</button>
                </div>
            </div>

            <div class="w-16 flex flex-col space-y-3 bg-gray-900/50 p-2 rounded-2xl border border-gray-800">
                
                <div class="text-[9px] text-gray-500 text-center font-bold uppercase">Time (s)</div>
                <div id="timelineScroll" class="flex-1 overflow-y-auto space-y-1 pr-1">
                    </div>
                <input type="hidden" id="s1" value="0"> <div class="text-[9px] text-gray-500 text-center font-bold uppercase border-t border-gray-800 pt-2">Color</div>
                <div id="colorPalette" class="space-y-1.5">
                    </div>
            </div>

        </div>
    </div>

    <script>
        let device, characteristic;
        let patterns = Array.from({length: 60}, (_, i) => ({ id: i, code: "" }));
        let selectedIdx = -1;
        let selectedLEDs = new Set();
        let pressTimer;

        // 1. สร้างปุ่ม 60 Pads
        function renderPads() {
            const grid = document.getElementById('padGrid');
            grid.innerHTML = '';
            patterns.forEach((p, index) => {
                const btn = document.createElement('div');
                btn.className = `pad-btn ${p.code ? 'border-green-900' : 'opacity-40'}`;
                btn.innerHTML = `<span class="text-xs font-black">${index + 1}</span><span class="pad-label">FX</span>`;
                btn.setAttribute('data-index', index);
                
                btn.onpointerdown = (e) => { pressTimer = setTimeout(() => openPopup(index), 600); };
                btn.onpointerup = (e) => {
                    clearTimeout(pressTimer);
                    if (selectedIdx !== index) playFX(index);
                };
                grid.appendChild(btn);
            });
        }

        // ระบบลากวาง (Sortable)
        new Sortable(document.getElementById('padGrid'), {
            animation: 150, ghostClass: 'ghost', delay: 100,
            onEnd: (evt) => {
                const item = patterns.splice(evt.oldIndex, 1)[0];
                patterns.splice(evt.newIndex, 0, item);
            }
        });

        // 2. ระบบเชื่อมต่อ
        document.getElementById('connectBtn').onclick = async () => {
            try {
                device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'PocketDJ-' }], optionalServices: ["0000ffe0-0000-1000-8000-00805f9b34fb"] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
                characteristic = await service.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");
                document.getElementById('status').innerText = "● Connected: Online";
                document.getElementById('status').className = "text-green-500 font-bold uppercase tracking-widest";
                await characteristic.writeValue(new TextEncoder().encode("GET_ALL"));
            } catch (e) { alert(e.message); }
        };

        // 3. ระบบเล่นลายไฟ
        async function playFX(index) {
            if (!characteristic || !patterns[index].code) return;
            selectedIdx = index;
            document.querySelectorAll('.pad-btn').forEach((b, i) => b.classList.toggle('active', i === index));
            await characteristic.writeValue(new TextEncoder().encode("5" + patterns[index].code));
        }

        // 4. Designer Logic
        function openPopup(index) {
            selectedIdx = index;
            const p = patterns[index];
            document.getElementById('modalTitle').innerText = "Slot " + (index + 1);
            document.getElementById('codeEditor').value = p.code;
            syncFromCode(); // แยกโค้ดลงสไลด์และ Timeline
            genLEDGrid();
            document.getElementById('modal').classList.remove('hidden');
        }

        function updateCode() {
            let s = document.getElementById('s1').value.toString().padStart(2, '0');
            let b = document.getElementById('s2').value.toString().padStart(2, '0');
            let grp = document.getElementById('s4').value.trim();
            let target = selectedLEDs.size > 0 ? Array.from(selectedLEDs).sort((a,b)=>a-b).map(id => `<${id}>`).join('') : (grp || "a");
            let fx = document.getElementById('s6').value;
            let d = (parseFloat(document.getElementById('s7').value)*10).toString().padStart(2,'0');
            let o = (parseFloat(document.getElementById('s8').value)*10).toString().padStart(2,'0');
            let lp = document.getElementById('s9').value;
            let col = getSelectedColor(); // ใหม่!
            
            document.getElementById('codeEditor').value = `(${s}${b},${target},${col},${fx}${d}${o},${lp})`;
        }

        function syncFromCode() {
            let code = document.getElementById('codeEditor').value;
            if (!code.startsWith('(')) return;
            let content = code.replace('(','').replace(')','');
            let p = content.split(',');
            if (p.length < 5) return;

            let startTime = parseInt(p[0].substring(0,2));
            document.getElementById('s1').value = startTime;
            updateTimelineScroll(startTime); // ใหม่!

            document.getElementById('s2').value = p[0].substring(2,4);
            document.getElementById('s4').value = p[1].includes('<') ? "" : p[1];
            setSelectedColor(p[2]); // ใหม่!
            document.getElementById('s6').value = p[3].charAt(0);
            document.getElementById('s7').value = parseInt(p[3].substring(1,3))/10;
            document.getElementById('s8').value = parseInt(p[3].substring(3,5))/10;
            document.getElementById('s9').value = p[4];

            selectedLEDs.clear();
            const ids = p[1].match(/\d+/g);
            if(ids) ids.forEach(id => selectedLEDs.add(parseInt(id)));
            genLEDGrid();
        }

        async function saveAndSend() {
            const code = document.getElementById('codeEditor').value;
            patterns[selectedIdx].code = code;
            if (characteristic) {
                await characteristic.writeValue(new TextEncoder().encode(`S${selectedIdx}:${code}`));
            }
            renderPads();
            closePopup();
        }

        function genLEDGrid() {
            const grid = document.getElementById('ledGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 300; i++) {
                const dot = document.createElement('div');
                dot.innerText = i;
                dot.className = `led-dot ${selectedLEDs.has(i) ? 'active' : ''}`;
                dot.onclick = () => {
                    if (selectedLEDs.has(i)) selectedLEDs.delete(i);
                    else selectedLEDs.add(i);
                    genLEDGrid(); updateCode(); livePre();
                };
                grid.appendChild(dot);
            }
        }

        // ใหม่! ระบบ Timeline Scroll แนวตั้ง
        function genTimeline() {
            const scroll = document.getElementById('timelineScroll');
            scroll.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                const item = document.createElement('div');
                item.className = 'timeline-item';
                item.innerText = (i/10).toFixed(1) + 's';
                item.id = `time-${i}`;
                item.onclick = () => {
                    document.getElementById('s1').value = i;
                    updateTimelineScroll(i);
                    updateCode(); livePre();
                };
                scroll.appendChild(item);
            }
        }

        function updateTimelineScroll(timeIndex) {
            document.querySelectorAll('.timeline-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById(`time-${timeIndex}`);
            if(activeItem) {
                activeItem.classList.add('active');
                // เลื่อนให้ไอเท็มที่เลือกอยู่ตรงกลาง
                document.getElementById('timelineScroll').scrollTop = activeItem.offsetTop - 120;
            }
        }

        // ใหม่! ระบบ Quick Color Palette
        const colorPaletteMap = {
            'bl': '#0000FF', 're': '#FF0000', 'gr': '#00FF00', 
            'ye': '#FFFF00', 'wh': '#FFFFFF', 'pu': '#8000FF', 'aq': '#00FFFF'
        };
        function genColorPalette() {
            const palette = document.getElementById('colorPalette');
            palette.innerHTML = '';
            Object.keys(colorPaletteMap).forEach(key => {
                const btn = document.createElement('div');
                btn.className = 'color-palette-btn';
                btn.style.backgroundColor = colorPaletteMap[key];
                btn.id = `color-${key}`;
                btn.onclick = () => {
                    setSelectedColor(key);
                    updateCode(); livePre();
                };
                palette.appendChild(btn);
            });
        }
        function getSelectedColor() {
            const active = document.querySelector('.color-palette-btn.active');
            return active ? active.id.replace('color-', '') : 'bl';
        }
        function setSelectedColor(colorCode) {
            document.querySelectorAll('.color-palette-btn').forEach(el => el.classList.remove('active'));
            const active = document.getElementById(`color-${colorCode}`);
            if(active) active.classList.add('active');
        }

        async function livePre() {
            if (characteristic) {
                try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode("5" + document.getElementById('codeEditor').value)); } catch(e){}
            }
        }

        function closePopup() { document.getElementById('modal').classList.add('hidden'); selectedIdx = -1; }
        function clearLEDs() { selectedLEDs.clear(); genLEDGrid(); updateCode(); livePre(); }

        // เริ่มต้นระบบ
        renderPads();
        genTimeline();
        genColorPalette();
    }
    </script>
</body>
</html>
