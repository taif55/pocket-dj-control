<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket DJ - Sync Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --primary-green: #2ecc71; --bg-dark: #0a0a0a; --card-bg: #1a1a1a; }
        body { background-color: var(--bg-dark); color: var(--primary-green); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 15px; overflow-x: hidden; }
        .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .connect-btn { background: #444; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .connect-btn.online { background: var(--primary-green); color: black; }

        .controls { width: 100%; max-width: 500px; background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #333; }
        .speed-slider { width: 100%; accent-color: var(--primary-green); cursor: pointer; }

        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 500px; padding-bottom: 50px; }
        .dj-button { 
            aspect-ratio: 1 / 1; background: #1e1e1e; border: 1.5px solid var(--primary-green); 
            border-radius: 10px; color: white; display: flex; align-items: center; 
            justify-content: center; font-size: 14px; font-weight: bold; cursor: grab;
            touch-action: none; user-select: none; position: relative; transition: 0.1s;
        }
        .dj-button:active { transform: scale(0.9); background: #333; }
        /* จุดแสดงว่ามีลายไฟ (Sync แล้ว) */
        .dj-button.has-data::after {
            content: ''; position: absolute; bottom: 5px; right: 5px; width: 8px; height: 8px; background: var(--primary-green); border-radius: 50%; box-shadow: 0 0 5px var(--primary-green);
        }
        .sortable-ghost { opacity: 0.1; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="font-style: italic;">POCKET DJ STUDIO</h2>
        <button id="connectBtn" class="connect-btn">CONNECT BLE</button>
    </div>

    <div class="controls">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size: 14px;">
            <span>TEMPO / SPEED</span>
            <span><span id="speed-val">1.0</span>x</span>
        </div>
        <input type="range" id="speed" class="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="grid-container" id="grid"></div>

    <script>
        const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
        const CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";
        
        let bleChar;
        const grid = document.getElementById('grid');
        const connectBtn = document.getElementById('connectBtn');
        const buttonPatterns = {}; // เก็บคำสั่งไฟรายปุ่ม

        // 1. สร้างปุ่ม 60 ปุ่ม
        for (let i = 0; i < 60; i++) {
            const btn = document.createElement('div');
            btn.className = 'dj-button';
            btn.innerHTML = i + 1;
            btn.dataset.index = i;
            btn.onclick = () => playPattern(i);
            grid.appendChild(btn);
        }

        // 2. เชื่อมต่อ Bluetooth
        connectBtn.onclick = async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'PocketDJ' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleChar = await service.getCharacteristic(CHARACTERISTIC_UUID);

                connectBtn.innerText = "ONLINE";
                connectBtn.classList.add('online');

                await bleChar.startNotifications();
                bleChar.addEventListener('characteristicvaluechanged', (e) => {
                    let val = new TextDecoder().decode(e.target.value);
                    console.log("ESP32 Send:", val);
                    
                    // รับข้อมูล Sync: D(index):(speed):(pattern)
                    if (val.startsWith("D")) {
                        let parts = val.split(':');
                        let idx = parts[0].substring(1);
                        let pattern = parts.slice(2).join(':');

                        if (pattern && pattern !== "" && pattern !== "off") {
                            buttonPatterns[idx] = pattern;
                            document.querySelector(`[data-index="${idx}"]`).classList.add('has-data');
                        }
                    }
                });

                // ดึงข้อมูลทั้งหมดจาก ESP32 มาแสดงจุดเขียวบนเว็บ
                sendValue("GET_ALL");

            } catch (err) { alert("Error: " + err); }
        };

        // 3. ฟังก์ชันสั่งเล่นไฟ
        async function playPattern(idx) {
            if (!bleChar) return;
            const p = buttonPatterns[idx];
            if (p) {
                console.log("Playing:", p);
                sendValue(p); // ส่งชุดคำสั่งที่มีวงเล็บ ( ไปให้ ESP32
            }
        }

        async function sendValue(txt) {
            if (!bleChar) return;
            await bleChar.writeValue(new TextEncoder().encode(txt));
        }

        // 4. ระบบ Drag & Drop (ที่แก้ปัญหาให้แล้ว)
        new Sortable(grid, {
            animation: 150,
            delay: 150,
            delayOnTouchOnly: true,
            onEnd: () => {
                let order = Array.from(grid.children).map(b => b.dataset.index).join(',');
                sendValue("ORDER:" + order);
                console.log("New Order Saved:", order);
            }
        });

        // 5. ปรับความเร็ว
        document.getElementById('speed').oninput = function() {
            document.getElementById('speed-val').innerText = this.value;
            sendValue("T" + (1/this.value).toFixed(2));
        };
    </script>
</body>
</html>
