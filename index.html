<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket DJ Studio - Scroll Lock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        /* ล็อคหน้าจอหลักไม่ให้ขยับเลย */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #050505; 
            color: white; 
            user-select: none; 
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* กรอบสี่เหลี่ยมสำหรับขังปุ่ม (เล็กลงจากหน้าจอเล็กน้อย) */
        .pad-container {
            margin: 0 auto;
            width: 95%; /* เล็กกว่าหน้าจอเล็กน้อย */
            height: 65vh; /* กำหนดความสูงให้พอดีกับสายตา */
            background: #0a0a0a;
            border: 2px solid #222;
            border-radius: 24px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px;
            
            /* ไม้ตาย: ป้องกันไม่ให้การสไลด์ในนี้ไปทำให้หน้าจอข้างนอกขยับ */
            overscroll-behavior: contain; 
            -webkit-overflow-scrolling: touch;
        }

        /* ปรับแต่ง Scrollbar ให้ดูสวยแบบ DJ Gear */
        .pad-container::-webkit-scrollbar { width: 4px; }
        .pad-container::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .pad-btn { 
            background: #151515; border: 1px solid #333; aspect-ratio: 1/1; 
            border-radius: 12px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: 0.1s; border: 1px solid #222;
            
            /* ล็อคระบบสัมผัสที่ตัวปุ่มเพื่อให้ Sortable ทำงานได้ 100% */
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        .pad-btn.active { background: #00e676; color: black; box-shadow: 0 0 15px #00e676; border-color: #fff; }
        .pad-btn.has-code { border-color: #00e676; }

        /* สไตล์ตอนกำลังลาก */
        .sortable-ghost { opacity: 0.1; background: #333 !important; }
        .sortable-drag { opacity: 1 !important; transform: scale(1.1); box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 100; }
    </style>
</head>
<body class="p-4">

    <div id="consoleView" class="max-w-xl mx-auto w-full">
        <div class="flex justify-between items-center mb-4 bg-gray-900/50 p-4 rounded-3xl border border-gray-800 shadow-xl">
            <h1 class="text-lg font-black text-green-500 italic uppercase tracking-tighter">Pocket DJ Studio</h1>
            <button id="connectBtn" class="bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl transition active:scale-95">CONNECT</button>
        </div>
    </div>

    <div class="pad-container max-w-xl shadow-2xl">
        <div id="padGrid" class="grid grid-cols-5 gap-3">
            </div>
    </div>

    <div class="max-w-xl mx-auto w-full mt-4 bg-gray-900/30 p-3 rounded-2xl border border-gray-800">
        <div class="flex justify-between text-[10px] font-bold text-gray-500 uppercase mb-1">
            <span>Global Speed</span>
            <span id="speedVal" class="text-green-500">1.0x</span>
        </div>
        <input type="range" id="globalSpeed" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full accent-green-500 h-6">
    </div>

    <script>
        let patterns = Array.from({length: 60}, (_, i) => ({ id: i, code: "" }));

        function renderPads() {
            const grid = document.getElementById('padGrid');
            grid.innerHTML = '';
            patterns.forEach((p, idx) => {
                const btn = document.createElement('div');
                btn.className = `pad-btn ${p.code ? 'border-green-500' : ''}`;
                btn.innerHTML = `<span class="text-xs font-black pad-num">${idx+1}</span>`;
                
                // ระบบจิ้ม (เปิด Popup)
                btn.onclick = () => {
                    if (!btn.classList.contains('is-dragging')) {
                        // openPopup(idx); // ใส่ฟังก์ชันเปิด Popup เดิมของคุณที่นี่
                        console.log("Open Pad:", idx + 1);
                    }
                };
                grid.appendChild(btn);
            });

            // ตั้งค่า Sortable ภายในกรอบ Lock
            new Sortable(grid, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                delay: 200,             // กดแช่ 0.2 วิเพื่อเริ่มลาก (ป้องกันการพลาด)
                delayOnTouchOnly: true,
                touchStartThreshold: 5,
                
                onStart: (evt) => {
                    evt.item.classList.add('is-dragging');
                    // ใส่สั่นนิดๆ เพื่อบอกว่าเริ่มลากได้แล้ว (เฉพาะ Android)
                    if (window.navigator.vibrate) window.navigator.vibrate(30);
                },
                onEnd: (evt) => {
                    evt.item.classList.remove('is-dragging');
                    // สลับตำแหน่งข้อมูลใน Array
                    const item = patterns.splice(evt.oldIndex, 1)[0];
                    patterns.splice(evt.newIndex, 0, item);
                    
                    // อัปเดตตัวเลขปุ่ม 1-60 ใหม่ให้เรียงถูกต้อง
                    const allNums = grid.querySelectorAll('.pad-num');
                    allNums.forEach((num, i) => {
                        num.innerText = i + 1;
                    });
                }
            });
        }

        renderPads();
    </script>
</body>
</html>
