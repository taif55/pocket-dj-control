<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket DJ Studio - Bluetooth Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; background: #050505; color: white; 
            user-select: none; overflow: hidden; height: 100vh;
            display: flex; flex-direction: column;
            touch-action: none; 
        }

        .pad-container {
            margin: 0 auto; width: 95%; height: 70vh; 
            background: #0a0a0a; border: 2px solid #222; border-radius: 20px;
            position: relative; overflow: hidden; display: flex;
        }

        #padGrid {
            flex: 1; display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 10px; padding: 15px;
            overflow-y: scroll; scrollbar-width: none; 
            touch-action: none; 
        }
        #padGrid::-webkit-scrollbar { display: none; } 

        .side-scroll-track {
            width: 30px; background: #111; border-left: 1px solid #222;
            display: flex; align-items: center; justify-content: center;
            touch-action: pan-y;
        }
        .side-scroll-track::after { content: '↕'; color: #444; font-size: 20px; }

        .pad-btn { 
            background: #151515; border: 1px solid #333; aspect-ratio: 1/1; 
            border-radius: 12px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; position: relative; transition: transform 0.05s, box-shadow 0.1s;
        }
        .pad-btn:active { transform: scale(0.92); box-shadow: inset 0 0 15px rgba(255,255,255,0.2); }
        .pad-btn.playing { box-shadow: 0 0 20px #00e676; border-color: #fff; transform: scale(0.95); background: #00e676 !important; color: black; }

        .poten-slot { 
            border: 2px dashed #ff9100 !important; 
            background: rgba(255, 145, 0, 0.05);
        }
        .poten-slot::before {
            content: 'POTEN';
            position: absolute; top: 4px; font-size: 7px; font-weight: 900; 
            color: #ff9100; letter-spacing: 0.5px; opacity: 0.9;
        }
        .poten-slot.has-code {
            border: 2px solid #ff9100 !important;
            box-shadow: inset 0 0 15px rgba(255, 145, 0, 0.3), 0 0 10px rgba(255, 145, 0, 0.5) !important;
        }
        .pad-btn:not(.poten-slot).has-code {
            border: 2px solid #00e676 !important;
            box-shadow: inset 0 0 10px rgba(0,230,118,0.2) !important;
            background-color: #151515 !important; /* ลบสีรุ้งออกถ้ามีโค้ดไฟ */
        }

        .sortable-drag { 
            opacity: 1 !important; transform: scale(1.1) !important; z-index: 9999 !important; 
            box-shadow: 0 10px 30px #000 !important; border: 2px solid #00e676 !important; 
            pointer-events: none; 
        }
        .sortable-ghost { opacity: 0.1; background: #00e676 !important; }

        #timelineViewport { background: #0a0a0a; border-bottom: 1px solid #222; position: relative; height: 180px; overflow-x: auto; overflow-y: hidden; }
        #timelineContent { position: relative; height: 100%; width: 2000px; background-image: linear-gradient(to right, #1a1a1a 1px, transparent 1px); background-size: 100px 100%; }
        #playhead { position: absolute; top: 0; width: 2px; height: 100%; background: #ff3d00; z-index: 50; pointer-events: none; box-shadow: 0 0 8px #ff3d00; }
        #loopLine { position: absolute; top: 0; width: 2px; height: 100%; background: #00e676; z-index: 45; pointer-events: none; box-shadow: 0 0 10px #00e676; opacity: 0.8; }
        .light-clip { position: absolute; height: 34px; color: black; border-radius: 6px; font-size: 9px; font-weight: 900; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; }
        .light-clip.selected { border: 2px solid white; box-shadow: 0 0 12px #00e676; z-index: 40; }
    </style>
</head>
<body class="p-4">

    <div id="consoleView" class="max-w-xl mx-auto w-full">
        <div class="flex justify-between items-center mb-4 bg-gray-900/50 p-4 rounded-3xl border border-gray-800 shadow-xl">
            <h1 class="text-lg font-black text-green-500 italic uppercase">DJ Master Sync</h1>
            <button id="connectBtn" class="bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl active:scale-95 transition">CONNECT</button>
        </div>
    </div>

    <div class="pad-container max-w-xl shadow-2xl">
        <div id="padGrid"></div>
        <div class="side-scroll-track" id="sideScroll"></div>
    </div>

    <div id="modal" class="fixed inset-0 hidden z-50 flex flex-col bg-[#050505]">
        <div class="flex justify-between items-center p-3 bg-gray-900 border-b border-gray-800">
            <button onclick="closePopup()" class="text-gray-400 font-bold text-xs uppercase px-2 py-1">Back</button>
            <div class="flex space-x-2">
                <button id="playBtn" onclick="togglePlay()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black shadow-lg">PLAY</button>
                <button onclick="addClipAtPlayhead()" class="bg-green-600 text-black px-4 py-2 rounded-xl text-[10px] font-black">+ CLIP</button>
                <button onclick="deleteSelectedClip()" class="bg-red-900 text-white px-4 py-2 rounded-xl text-[10px] font-black">Del</button>
            </div>
            <button onclick="saveAndSend()" class="bg-white text-black font-black px-4 py-2 rounded-lg text-xs uppercase active:bg-gray-300">Save</button>
        </div>
        <div id="timelineViewport" onclick="handleTimelineClick(event)">
            <div id="timelineContent">
                <div id="playhead"></div>
                <div id="loopLine"></div>
                <div id="trackArea" class="relative h-full py-6"></div>
            </div>
        </div>
        <div id="timeText" class="bg-black text-[10px] text-center p-1 text-gray-500 font-mono">PLAYHEAD: 0.0s</div>
        
        <div id="editorPanel" class="flex-1 overflow-y-auto p-4 space-y-3 opacity-30 pointer-events-none pb-12">
            <div class="bg-gray-900/40 p-3 rounded-2xl border border-gray-800">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] font-black text-gray-400 uppercase">Color Selection</span>
                    <input type="text" id="customColor" class="bg-black border border-gray-800 px-2 py-1 rounded text-[10px] text-green-500 outline-none w-20 text-center" oninput="updateSelectedClip()">
                </div>
                <div id="colorPalette" class="flex flex-wrap gap-2 justify-center"></div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-gray-900/40 p-3 rounded-2xl border border-gray-800 text-center">
                    <div class="text-[9px] text-gray-500 mb-1 font-bold uppercase">Brightness</div>
                    <input type="number" id="cBright" value="10" class="bg-transparent text-center font-black text-xl w-full outline-none" oninput="updateSelectedClip()">
                </div>
                <div class="bg-gray-900/40 p-3 rounded-2xl border border-gray-800">
                    <select id="cFX" class="w-full h-full bg-transparent text-xs font-black text-green-400 uppercase outline-none" onchange="updateSelectedClip()">
                        <option value="o">Static</option><option value="u">Fade Up</option><option value="f">Fade Out</option><option value="s">Strobe</option><option value="b">Blink</option>
                    </select>
                </div>
            </div>
            <div class="bg-gray-900/40 p-3 rounded-2xl border border-gray-800">
                <div id="ledGrid" class="grid grid-cols-10 gap-1 h-32 overflow-y-auto bg-black p-2 rounded-lg border border-gray-900"></div>
            </div>
        </div>
    </div>

    <script>
        let device, characteristic;
        let patterns = Array.from({length: 60}, (_, i) => ({ id: i, code: "" }));
        
        let clips = []; 
        let selectedClipId = null;
        let selectedIdx = -1;
        let playheadTime = 0;
        let isPlaying = false;
        let playInterval, startAnimateTime;
        let currentLoopLimit = 1.0;
        const pxPerSec = 100;
        const colorMap = { 'bl': '#0000FF', 're': '#FF0000', 'gr': '#00FF00', 'ye': '#FFFF00', 'wh': '#FFFFFF', 'pu': '#8000FF', 'aq': '#00FFFF', 'or': '#FF8000' };

        const grid = document.getElementById('padGrid');
        let sortableInstance = null; // ตัวแปรเก็บระบบลาก
        let isDraggingPad = false; 

        async function autoSyncTop10() {
            if(!characteristic) return; 
            const btn = document.getElementById('connectBtn');
            btn.innerText = "SYNCING...";
            btn.className = "bg-yellow-500 text-black text-[10px] font-black px-4 py-2 rounded-xl transition";
            try {
                for(let i=0; i<10; i++) {
                    let codeToSend = patterns[i].code ? patterns[i].code : ""; 
                    await characteristic.writeValue(new TextEncoder().encode(`S${i}:${codeToSend}`));
                    await new Promise(r => setTimeout(r, 60)); 
                }
                btn.innerText = "ONLINE";
                btn.className = "bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl shadow-[0_0_15px_#00e676]";
            } catch(e) { 
                btn.innerText = "ONLINE";
                btn.className = "bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl shadow-[0_0_15px_#00e676]";
            }
        }

        // --- ฟังก์ชันวาดปุ่ม (เรียกใช้ครั้งเดียวตอนเปิดแอป) ---
        function renderPads() {
            grid.innerHTML = '';
            patterns.forEach((p, index) => {
                const btn = document.createElement('div');
                const isPotenZone = index < 10;
                
                btn.className = `pad-btn ${isPotenZone ? 'poten-slot' : ''} ${p.code ? 'has-code' : ''}`;
                
                if(!p.code) {
                    const hue = (p.id * 6) % 360;
                    btn.style.backgroundColor = `hsl(${hue}, 30%, 15%)`;
                }

                btn.innerHTML = `<span class="text-lg font-black pad-num">${p.id + 1}</span>`;
                
                let clickTimer = null;
                btn.addEventListener('pointerdown', (e) => {
                    if (isDraggingPad) return; 
                    
                    const currentVisualIndex = patterns.indexOf(p);
                    if (clickTimer) {
                        clearTimeout(clickTimer);
                        clickTimer = null;
                        openPopup(currentVisualIndex); 
                    } else {
                        playFX(currentVisualIndex, btn); 
                        clickTimer = setTimeout(() => {
                            clickTimer = null; 
                        }, 300);
                    }
                });

                grid.appendChild(btn);
            });

            // สร้างระบบลากแค่ครั้งเดียว
            if (sortableInstance) sortableInstance.destroy();
            sortableInstance = new Sortable(grid, {
                animation: 150,
                delay: 250, 
                delayOnTouchOnly: false, 
                touchStartThreshold: 5,
                forceFallback: true,
                fallbackClass: "sortable-drag",
                fallbackOnBody: true,
                swapThreshold: 0.65,
                onStart: (evt) => {
                    isDraggingPad = true; 
                    if (window.navigator.vibrate) window.navigator.vibrate(30);
                },
                onEnd: (evt) => {
                    const item = patterns.splice(evt.oldIndex, 1)[0];
                    patterns.splice(evt.newIndex, 0, item);
                    
                    Array.from(grid.children).forEach((btn, i) => {
                        if (i < 10) btn.classList.add('poten-slot');
                        else btn.classList.remove('poten-slot');
                    });

                    autoSyncTop10();
                    setTimeout(() => { isDraggingPad = false; }, 50);
                }
            });
        }

        // --- ไม้ตายแก้บัค: ฟังก์ชันอัปเดตแค่ภาพกราฟิก ไม่ทำลายระบบลาก ---
        function updatePadsVisuals() {
            const btns = grid.children;
            patterns.forEach((p, index) => {
                const btn = btns[index];
                if (!btn) return;
                
                if(p.code) {
                    btn.classList.add('has-code');
                    btn.style.backgroundColor = ""; // เคลียร์สีรุ้งออก
                } else {
                    btn.classList.remove('has-code');
                    const hue = (p.id * 6) % 360;
                    btn.style.backgroundColor = `hsl(${hue}, 30%, 15%)`;
                }
            });
        }

        async function playFX(idx, btnElement) {
            document.querySelectorAll('.pad-btn').forEach(b => b.classList.remove('playing'));
            if(btnElement) btnElement.classList.add('playing');
            setTimeout(() => { if(btnElement) btnElement.classList.remove('playing'); }, 200);

            if(!characteristic || !patterns[idx].code) return;
            try { 
                await characteristic.writeValueWithoutResponse(new TextEncoder().encode("5" + patterns[idx].code)); 
            } catch(e){}
        }

        document.getElementById('connectBtn').onclick = async () => {
            try {
                device = await navigator.bluetooth.requestDevice({ 
                    filters: [{ namePrefix: 'PocketDJ-' }], 
                    optionalServices: ["0000ffe0-0000-1000-8000-00805f9b34fb"] 
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
                characteristic = await service.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");
                
                const btn = document.getElementById('connectBtn');
                btn.innerText = "ONLINE";
                btn.className = "bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl shadow-[0_0_15px_#00e676]";
                
                await characteristic.startNotifications();
                
                // รับข้อมูลจาก ESP32
                characteristic.addEventListener('characteristicvaluechanged', (e) => {
                    let val = new TextDecoder().decode(e.target.value);
                    if (val.startsWith("D")) {
                        let p = val.substring(1).split(":");
                        if(p.length >= 3) { 
                            patterns[parseInt(p[0])].code = p[2] || ""; 
                            // ใช้ updatePadsVisuals แทน renderPads ตรงนี้แหละครับกุญแจสำคัญ!
                            updatePadsVisuals(); 
                        }
                    }
                });
                await characteristic.writeValue(new TextEncoder().encode("GET_ALL"));
            } catch (e) { alert("BT Error: " + e.message); }
        };

        const sideScroll = document.getElementById('sideScroll');
        let isScrolling = false, startY, startScrollTop;

        sideScroll.addEventListener('touchstart', (e) => {
            isScrolling = true; startY = e.touches[0].pageY; startScrollTop = grid.scrollTop;
        }, {passive: true});
        sideScroll.addEventListener('touchmove', (e) => {
            if (!isScrolling) return;
            grid.scrollTop = startScrollTop - ((e.touches[0].pageY - startY) * 2); 
        }, {passive: true});
        sideScroll.addEventListener('touchend', () => isScrolling = false);

        function openPopup(idx) {
            selectedIdx = idx; clips = [];
            let rawCode = patterns[idx].code || "";
            let brackets = rawCode.match(/m?\(([^)]+)\)/g);
            if (brackets) {
                brackets.forEach((bracket, i) => {
                    let m = bracket.startsWith('m');
                    let content = bracket.replace('m','').replace('(','').replace(')','').split(',');
                    if(content.length >= 5) {
                        clips.push({ 
                            id: Date.now() + i, start: parseInt(content[0].substring(0,2))/10, bright: parseInt(content[0].substring(2,4)), 
                            target: content[1], color: content[2], fx: content[3].charAt(0), duration: parseInt(content[3].substring(1,3))/10, 
                            loop: 1, mirror: m, track: i % 4 
                        });
                    }
                });
            }
            document.getElementById('modal').classList.remove('hidden');
            initColors(); renderClips();
            if(clips.length > 0) selectClip(clips[0].id);
        }

        function closePopup() { 
            stopPlayback(); 
            document.getElementById('modal').classList.add('hidden'); 
            selectedIdx = -1; 
            // อัปเดตแค่ภาพกราฟิก ไม่ลบปุ่มทิ้ง
            updatePadsVisuals(); 
        }

        function renderClips() {
            const area = document.getElementById('trackArea'); area.innerHTML = '';
            clips.forEach(c => {
                const div = document.createElement('div');
                div.id = `clip-${c.id}`; div.className = `light-clip ${selectedClipId === c.id ? 'selected' : ''}`;
                div.style.left = (c.start * pxPerSec) + 'px'; div.style.width = (c.duration * pxPerSec) + 'px'; div.style.top = (c.track * 40) + 'px';
                div.innerText = c.color.toUpperCase();
                if(c.color.includes('2')) {
                    const parts = c.color.split('2');
                    div.style.background = `linear-gradient(to right, ${colorMap[parts[0]] || '#333'}, ${colorMap[parts[1]] || '#333'})`;
                } else { div.style.backgroundColor = colorMap[c.color] || '#555'; }
                
                div.addEventListener('pointerdown', (e) => { e.stopPropagation(); selectClip(c.id); });
                area.appendChild(div);
                
                interact(div).draggable({ listeners: { move(e) { c.start += e.dx/pxPerSec; c.start=Math.max(0, c.start); renderClips(); if(!isPlaying) sendLiveFrame(); } } })
                            .resizable({ edges: { right: true }, listeners: { move(e) { c.duration = e.rect.width/pxPerSec; c.duration=Math.max(0.1, c.duration); renderClips(); if(!isPlaying) sendLiveFrame(); } } });
            });
            updateLoopLine();
        }

        function selectClip(id) {
            selectedClipId = id; const c = clips.find(x => x.id === id);
            document.getElementById('editorPanel').style.opacity = "1"; document.getElementById('editorPanel').style.pointerEvents = "auto";
            document.getElementById('cBright').value = c.bright; document.getElementById('cFX').value = c.fx; document.getElementById('customColor').value = c.color;
            renderLEDGrid(); renderClips(); if(!isPlaying) sendLiveFrame();
        }

        function updateSelectedClip() {
            if(!selectedClipId) return; const c = clips.find(x => x.id === selectedClipId);
            c.bright = document.getElementById('cBright').value; c.fx = document.getElementById('cFX').value; c.color = document.getElementById('customColor').value;
            renderClips(); if(!isPlaying) sendLiveFrame(); else sendFullCodeToBT();
        }

        async function saveAndSend() {
            let code = "";
            clips.sort((a,b)=>a.start-b.start).forEach(c => {
                let m = c.mirror ? 'm' : '';
                let s = Math.round(c.start*10).toString().padStart(2,'0'), b = parseInt(c.bright).toString().padStart(2,'0'), d = Math.round(c.duration*10).toString().padStart(2,'0');
                code += `${m}(${s}${b},${c.target || 'a'},${c.color},${c.fx}${d}00,1)`;
            });
            patterns[selectedIdx].code = code;
            if(characteristic) await characteristic.writeValue(new TextEncoder().encode(`S${selectedIdx}:${code}`));
            closePopup(); 
            
            if(selectedIdx < 10) autoSyncTop10();
        }

        function renderLEDGrid() {
            const grid = document.getElementById('ledGrid'); grid.innerHTML = '';
            const c = clips.find(x => x.id === selectedClipId);
            if(!c) return;
            for(let i=1; i<=300; i++) { 
                const d = document.createElement('div'); d.innerText = i;
                d.className = `text-[8px] h-7 bg-[#111] border border-[#222] rounded flex items-center justify-center cursor-pointer ${c.target.includes('<'+i+'>')?'bg-green-500 text-black font-bold':''}`;
                d.addEventListener('pointerdown', (e) => { 
                    e.preventDefault(); 
                    if(c.target.includes('<'+i+'>')) c.target = c.target.replace('<'+i+'>',''); else c.target += `<${i}>`; 
                    renderLEDGrid(); updateSelectedClip(); 
                });
                grid.appendChild(d);
            }
        }
        
        function initColors() {
            const p = document.getElementById('colorPalette'); p.innerHTML = '';
            Object.keys(colorMap).forEach(k => {
                const d = document.createElement('div'); d.className = 'w-8 h-8 rounded-lg cursor-pointer border-2 border-transparent'; d.style.backgroundColor = colorMap[k];
                d.addEventListener('pointerdown', () => { const c = clips.find(x => x.id === selectedClipId); if (c) { c.color = k; document.getElementById('customColor').value = k; updateSelectedClip(); } });
                p.appendChild(d);
            });
        }
        
        function updateLoopLine() { let maxT = 0; clips.forEach(c => { let end = c.start + c.duration; if (end > maxT) maxT = end; }); currentLoopLimit = maxT > 0 ? maxT : 1.0; const ll = document.getElementById('loopLine'); if (ll) { ll.style.left = (currentLoopLimit * pxPerSec) + 'px'; ll.style.display = clips.length > 0 ? 'block' : 'none'; } }
        function addClipAtPlayhead() { const id = Date.now(); clips.push({ id, start: playheadTime, duration: 1.0, target: "", color: "bl", fx: "o", bright: 10, loop: 1, mirror: false, track: clips.length % 4 }); renderClips(); selectClip(id); }
        function deleteSelectedClip() { if(selectedClipId) { clips = clips.filter(c => c.id !== selectedClipId); selectedClipId = null; renderClips(); } }
        function handleTimelineClick(e) { if(isPlaying) return; const rect = document.getElementById('timelineContent').getBoundingClientRect(); playheadTime = Math.max(0, (e.clientX - rect.left) / pxPerSec); document.getElementById('playhead').style.left = (playheadTime * pxPerSec) + 'px'; }
        
        function togglePlay() { const btn = document.getElementById('playBtn'); if (!isPlaying) { isPlaying = true; btn.innerText = "STOP"; btn.classList.replace('bg-blue-600', 'bg-red-600'); sendFullCodeToBT(); startAnimateTime = performance.now() - (playheadTime * 1000); playInterval = requestAnimationFrame(animatePlayhead); } else { stopPlayback(); } }
        function stopPlayback() { isPlaying = false; const btn = document.getElementById('playBtn'); if (btn) { btn.innerText = "PLAY"; btn.classList.replace('bg-red-600', 'bg-blue-600'); } cancelAnimationFrame(playInterval); if(selectedClipId) sendLiveFrame(); }
        function animatePlayhead(currentTime) { if (!isPlaying) return; let elapsed = (currentTime - startAnimateTime) / 1000; if (elapsed >= currentLoopLimit) { startAnimateTime = currentTime; elapsed = 0; sendFullCodeToBT(); } playheadTime = elapsed; document.getElementById('playhead').style.left = (playheadTime * pxPerSec) + 'px'; document.getElementById('timeText').innerText = `PLAYHEAD: ${playheadTime.toFixed(1)}s / END: ${currentLoopLimit.toFixed(1)}s`; playInterval = requestAnimationFrame(animatePlayhead); }
        
        async function sendFullCodeToBT() { if(!characteristic) return; let code = "5"; clips.sort((a,b)=>a.start-b.start).forEach(c => { let s = Math.round(c.start*10).toString().padStart(2,'0'), b = parseInt(c.bright).toString().padStart(2,'0'), d = Math.round(c.duration*10).toString().padStart(2,'0'); code += `${c.mirror?'m':''}(${s}${b},${c.target||'a'},${c.color},${c.fx}${d}00,1)`; }); try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode(code)); } catch(e){} }
        async function sendLiveFrame() { if(!characteristic || !selectedClipId) return; const c = clips.find(x => x.id === selectedClipId); let b = parseInt(c.bright).toString().padStart(2,'0'); let code = `5${c.mirror?'m':''}(00${b},${c.target || 'a'},${c.color},o9900,1)`; try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode(code)); } catch(e){} }

        // เรียกวาดปุ่มแค่ครั้งเดียวตอนโหลดแอป!
        renderPads();
    </script>
</body>
</html>
