<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket DJ Studio - 2 Layers Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; background: #050505; color: white; 
            user-select: none; overflow: hidden; height: 100dvh; 
            display: flex; flex-direction: column; touch-action: none; 
            margin: 0; padding: 0;
        }

        #mainView {
            display: flex;
            flex-direction: column;
            height: calc(100dvh - 5px); 
            overflow: hidden; 
            padding: 5px 5px 5px 5px; 
            box-sizing: border-box;
            gap: 5px;
        }

        .header-section {
            flex: 0 0 8%; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.5);
            padding: 0 15px;
            border-radius: 15px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .power-bar-container {
            width: 60px;
            height: 12px;
            background-color: #333;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #555;
            position: relative;
        }
        .power-bar-fill {
            height: 100%;
            width: 0%; 
            background-color: #22c55e; 
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .power-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 8px;
            font-weight: 900;
            line-height: 12px;
            color: white;
            text-shadow: 1px 1px 2px black;
        }

        .layer-block {
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            padding: 10px;
            position: relative;
            background-color: rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .layer-bg { 
            flex: 0 0 45%; 
            border: 2px solid #22c55e; 
            background-color: rgba(20, 83, 45, 0.2); 
        }
        
        .layer-fg { 
            flex: 0 0 35%; 
            border: 2px solid #3b82f6; 
            background-color: rgba(30, 58, 138, 0.2); 
        }

        .layer-title {
            position: absolute;
            top: -10px;
            left: 15px;
            background-color: #050505;
            padding: 0 10px;
            font-weight: 900;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .pad-container { 
            flex: 1; 
            width: 100%; 
            overflow-y: scroll; 
            padding: 5px; 
            touch-action: pan-y; 
            margin-bottom: 5px;
        }
        
        .pad-container::-webkit-scrollbar { display: block; width: 26px; }
        .pad-container::-webkit-scrollbar-track { background: #0a0a0a; border-radius: 8px; }
        .pad-container::-webkit-scrollbar-thumb { background: #444; border-radius: 8px; border: 4px solid #0a0a0a; }

        .grid-style { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }

        .pad-btn { background: #151515; border: 1px solid #333; aspect-ratio: 1/1; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: transform 0.05s, box-shadow 0.1s; }
        .pad-btn:active { transform: scale(0.92); box-shadow: inset 0 0 15px rgba(255,255,255,0.2); }
        .pad-btn.playing { box-shadow: 0 0 20px #fff; border-color: #fff; background: #fff !important; color: black; }

        .pad-btn.has-code { border: 2px solid #555; background-color: #151515 !important; }

        .sortable-drag { opacity: 1 !important; transform: scale(1.1) !important; z-index: 9999 !important; box-shadow: 0 10px 30px #000 !important; border: 2px solid #fff !important; pointer-events: none; }
        .sortable-ghost { opacity: 0.1; background: #fff !important; }

        #timelineViewport { background: #0a0a0a; border-bottom: 1px solid #222; position: relative; height: 160px; overflow-x: auto; overflow-y: hidden; scroll-behavior: auto; touch-action: pan-x; }
        #timelineContent { position: relative; height: 100%; width: 2000px; }
        
        #playhead { position: absolute; top: 0; width: 2px; height: 100%; background: #ff3d00; z-index: 50; pointer-events: none; box-shadow: 0 0 8px #ff3d00; }
        #loopLine { position: absolute; top: 0; width: 2px; height: 100%; background: #00e676; z-index: 45; pointer-events: none; box-shadow: 0 0 10px #00e676; opacity: 0.8; }
        
        .light-clip { position: absolute; height: 16px; color: black; border-radius: 4px; font-size: 8px; font-weight: 900; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; border: 1px solid rgba(255,255,255,0.4); cursor: grab; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .light-clip:active { cursor: grabbing; }
        .light-clip.selected { border: 2px solid white; box-shadow: 0 0 10px #00e676; z-index: 40; }
        
        .color-scroll::-webkit-scrollbar { height: 4px; }
        .color-scroll::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        #ledGrid { touch-action: pan-y; padding-right: 5px; overflow-y: auto; }
        #ledGrid::-webkit-scrollbar { display: block; width: 14px; }
        #ledGrid::-webkit-scrollbar-track { background: #0a0a0a; border-radius: 8px; }
        #ledGrid::-webkit-scrollbar-thumb { background: #333; border-radius: 8px; border: 3px solid #0a0a0a; }

        .led-mark { border: 1px solid #444 !important; background: #151515; }
        .led-active { background: #00e676 !important; color: #000 !important; border-color: #fff !important; box-shadow: 0 0 8px #00e676; }
        
        .modal-overlay { background: rgba(0,0,0,0.85); backdrop-filter: blur(3px); }
    </style>
</head>
<body>

    <div id="mainView">
        
        <div class="header-section">
            <h1 class="text-sm font-black text-white italic uppercase tracking-wider">Pocket DJ <span class="text-orange-500">Ultimate</span></h1>
            
            <div class="flex items-center space-x-3">
                <div class="flex flex-col items-center">
                    <span id="powerLabel" class="text-[7px] text-gray-400 font-bold mb-[1px]">POWER</span>
                    <div class="power-bar-container">
                        <div id="powerBarFill" class="power-bar-fill"></div>
                        <div id="powerBarText" class="power-text">OFF</div>
                    </div>
                </div>
                <button id="connectBtn" class="bg-blue-600 text-white text-[10px] font-black px-4 py-2 rounded-xl active:scale-95 transition">CONNECT</button>
            </div>
        </div>

        <div class="flex items-center justify-between bg-gray-900/50 p-2 mx-1 mt-1 rounded-xl border border-gray-800 flex-none shadow-lg">
            <div class="flex space-x-1">
                <button id="btnAutoTempo" onclick="toggleMicListen()" class="bg-blue-600 hover:bg-blue-500 text-white px-2 py-1.5 rounded-lg text-[9px] font-black flex items-center space-x-1 transition shadow-lg w-[60px] justify-center">
                    <span>🎙️</span><span>AUTO</span>
                </button>
                <button id="btnKickListen" onclick="toggleKickListen()" class="bg-purple-600 hover:bg-purple-500 text-white px-2 py-1.5 rounded-lg text-[9px] font-black flex items-center space-x-1 transition shadow-lg w-[60px] justify-center">
                    <span>🥁</span><span>KICK</span>
                </button>
            </div>
            <div class="flex flex-col items-center flex-1">
                <span class="text-[7px] text-gray-500 font-bold uppercase tracking-widest mb-[2px]">Master Tempo</span>
                <div class="text-green-400 font-black text-xl leading-none tracking-wider" id="globalBpmDisplay" style="text-shadow: 0 0 10px rgba(74,222,128,0.5);">128 <span class="text-[10px] text-gray-500 font-bold">BPM</span></div>
            </div>
            <button id="btnTapTempo" onclick="tapTempo()" class="bg-orange-600 hover:bg-orange-500 text-white px-3 py-1.5 rounded-lg text-[9px] font-black flex items-center space-x-1 transition shadow-lg w-[60px] justify-center active:scale-90">
                <span>👆</span><span>TAP</span>
            </button>
        </div>

        <div class="layer-block layer-bg mt-1">
            <h2 class="layer-title text-green-500">BACKGROUND LAYER</h2>
            
            <div class="flex space-x-2 mb-2 bg-gray-900/50 p-2 px-3 mx-1 rounded-xl flex-none mt-2">
                <div class="flex-1 flex items-center space-x-2">
                    <button onclick="resetSpeed('BG')" class="text-[9px] font-bold text-gray-400 bg-gray-800 px-2 py-1 rounded shadow active:bg-gray-600">SPD</button>
                    <input type="range" id="bgSpeedSlider" min="0" max="8" step="0.1" value="1.0" class="flex-1 accent-orange-500 h-2 bg-gray-700 rounded-lg appearance-none" oninput="updateSpeed(this.value, 'BG')">
                    <span id="bgSpeedText" class="text-orange-500 font-black text-[10px] w-6 shrink-0 text-right">1.0</span>
                </div>
                <div class="w-[1px] bg-gray-700"></div>
                <div class="flex-1 flex items-center space-x-2">
                    <button onclick="resetBright('BG')" class="text-[9px] font-bold text-gray-400 bg-gray-800 px-2 py-1 rounded shadow active:bg-gray-600">BRT</button>
                    <input type="range" id="bgBrightSlider" min="0" max="1" step="0.05" value="1.0" class="flex-1 accent-yellow-500 h-2 bg-gray-700 rounded-lg appearance-none" oninput="updateBright(this.value, 'BG')">
                    <span id="bgBrightText" class="text-yellow-500 font-black text-[10px] w-9 shrink-0 text-right">100%</span>
                </div>
            </div>

            <div class="pad-container">
                <div id="padGridBG" class="grid-style"></div>
            </div>
            <button id="stopBtnBG" onclick="stopBG()" class="w-full flex-none bg-red-900/80 hover:bg-red-600 text-white font-black text-[10px] py-2 rounded-lg shadow-lg transition">STOP BACKGROUND</button>
        </div>

        <div class="layer-block layer-fg">
            <h2 class="layer-title text-blue-500">FOREGROUND LAYER</h2>
            
            <div class="flex space-x-2 mb-2 bg-gray-900/50 p-2 px-3 mx-1 rounded-xl flex-none mt-2">
                <div class="flex-1 flex items-center space-x-2">
                    <button onclick="resetSpeed('FG')" class="text-[9px] font-bold text-gray-400 bg-gray-800 px-2 py-1 rounded shadow active:bg-gray-600">SPD</button>
                    <input type="range" id="fgSpeedSlider" min="0" max="8" step="0.1" value="1.0" class="flex-1 accent-orange-500 h-2 bg-gray-700 rounded-lg appearance-none" oninput="updateSpeed(this.value, 'FG')">
                    <span id="fgSpeedText" class="text-orange-500 font-black text-[10px] w-6 shrink-0 text-right">1.0</span>
                </div>
                <div class="w-[1px] bg-gray-700"></div>
                <div class="flex-1 flex items-center space-x-2">
                    <button onclick="resetBright('FG')" class="text-[9px] font-bold text-gray-400 bg-gray-800 px-2 py-1 rounded shadow active:bg-gray-600">BRT</button>
                    <input type="range" id="fgBrightSlider" min="0" max="1" step="0.05" value="1.0" class="flex-1 accent-yellow-500 h-2 bg-gray-700 rounded-lg appearance-none" oninput="updateBright(this.value, 'FG')">
                    <span id="fgBrightText" class="text-yellow-500 font-black text-[10px] w-9 shrink-0 text-right">100%</span>
                </div>
            </div>

            <div class="pad-container">
                <div id="padGridFG" class="grid-style"></div>
            </div>
            <button id="stopBtnFG" onclick="stopFG()" class="w-full flex-none bg-red-900/80 hover:bg-red-600 text-white font-black text-[10px] py-2 rounded-lg shadow-lg transition">STOP FOREGROUND</button>
        </div>

    </div>

    <div id="modal" class="fixed inset-0 hidden z-40 flex flex-col bg-[#050505] pb-[40px]">
        <div class="flex justify-between items-center p-2 bg-gray-900 border-b border-gray-800 flex-none">
            <button onclick="handleBack()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold text-[10px] uppercase px-3 py-2 rounded-lg transition shadow-md">🔙</button>
            <div class="flex space-x-1">
                <button id="playBtn" onclick="togglePlay()" class="bg-red-600 text-white px-3 py-2 rounded-lg text-[10px] font-black shadow-lg w-12">STOP</button>
                <button onclick="addClipAtPlayhead()" class="bg-green-600 text-black px-3 py-2 rounded-lg text-[10px] font-black">+ CLIP</button>
                <button onclick="deleteSelectedClip()" class="bg-red-900 text-white px-2 py-2 rounded-lg text-[10px] font-black">DEL</button>
            </div>
            <div class="flex space-x-1">
                <button onclick="undoState()" class="bg-gray-700 hover:bg-gray-600 text-white px-2 py-2 rounded-lg text-[10px] shadow">↩️</button>
                <button onclick="redoState()" class="bg-gray-700 hover:bg-gray-600 text-white px-2 py-2 rounded-lg text-[10px] shadow">↪️</button>
                <button onclick="saveAndSend()" class="bg-white text-black font-black px-3 py-2 rounded-lg text-[10px] uppercase active:bg-gray-300 shadow">SAVE</button>
            </div>
        </div>
        
        <div id="timelineViewport" class="flex-none">
            <div id="timelineContent">
                <div id="playhead"></div>
                <div id="loopLine"></div>
                <div id="trackArea" class="relative h-full py-2"></div>
            </div>
        </div>
        <div class="flex justify-between bg-black text-[9px] text-gray-500 font-mono px-2 py-1 border-b border-gray-800 flex-none">
            <span id="timeText">PLAYHEAD: 0.0s</span>
            <span>* กดก้อนแช่ไว้เพื่อ COPY</span>
        </div>

        <div class="bg-gray-900 border-b border-gray-800 p-2 flex items-center space-x-2 flex-none overflow-hidden">
            <button onclick="fitToScreen()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-[9px] font-black shadow-lg flex-none">FIT</button>
            <button id="followBtn" onclick="toggleFollow()" class="bg-gray-700 text-white px-3 py-1.5 rounded-lg text-[9px] font-bold flex-none">FOL</button>
            
            <div class="flex flex-col flex-1 justify-center space-y-1">
                <div class="flex items-center space-x-1">
                    <span class="text-[7px] text-gray-400 font-bold w-4 text-right">ZOM</span>
                    <input type="range" id="zoomSlider" min="20" max="300" value="100" class="flex-1 accent-blue-500" oninput="updateZoom(this.value)">
                </div>
                <div class="flex items-center space-x-1">
                    <span class="text-[7px] text-gray-400 font-bold w-4 text-right">SCL</span>
                    <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" class="flex-1 accent-orange-500" onchange="applySpeedScale(this.value)">
                </div>
            </div>
            
            <button id="editorTapBtn" onclick="editorTapTempo()" class="bg-orange-600 hover:bg-orange-500 text-white px-3 py-1.5 rounded-lg text-[10px] font-black shadow-lg flex-none transition duration-75">TAP</button>
        </div>
        
        <div id="editorPanel" class="flex-1 flex flex-col p-2 space-y-2 opacity-30 pointer-events-none overflow-hidden">
            
            <div class="bg-gray-900/40 p-2 rounded-xl border border-gray-800 flex justify-between items-center flex-none">
                <button onclick="addColorSlot()" class="bg-blue-600 text-white font-bold text-[9px] px-2 py-1 rounded shadow mr-2 flex-shrink-0">+ ADD</button>
                <div id="colorSlots" class="flex items-center space-x-1 flex-1 overflow-x-auto color-scroll pb-1"></div>
                <div class="flex space-x-1 ml-2 flex-shrink-0">
                    <button onclick="delColorSlot()" class="bg-red-900 text-white font-bold text-[9px] px-2 py-1 rounded shadow">- DEL</button>
                    <button onclick="resetColorBuilder()" class="text-red-500 font-bold text-[9px] px-2">RST</button>
                </div>
            </div>
            <div id="colorPalette" class="color-scroll flex flex-nowrap overflow-x-auto gap-2 pb-1 px-1 flex-none"></div>

            <div class="grid grid-cols-3 gap-2 flex-none">
                <div class="bg-gray-900/40 p-1 rounded-xl border border-gray-800 flex items-center justify-between px-2">
                    <span class="text-[8px] text-gray-500 font-bold uppercase">Bright</span>
                    <input type="number" id="cBright" value="10" class="bg-transparent text-right font-black text-sm w-10 outline-none" oninput="updateSelectedClip()">
                </div>
                <div class="bg-gray-900/40 p-1 rounded-xl border border-gray-800 flex items-center justify-between px-2 cursor-pointer" onclick="toggleMirror()">
                    <span class="text-[8px] text-gray-500 font-bold uppercase">Mirror</span>
                    <div id="cMirrorBtn" class="w-4 h-4 rounded-full border-2 border-gray-600 transition-colors"></div>
                </div>
                <div class="bg-gray-900/40 p-1 rounded-xl border border-gray-800 flex items-center justify-between px-2">
                    <span class="text-[8px] text-gray-500 font-bold uppercase">FX</span>
                    <select id="cFX" class="bg-transparent text-[9px] font-black text-green-400 uppercase outline-none text-right flex-1 ml-1" onchange="updateSelectedClip()">
                        <option value="o">STATIC</option><option value="u">FADE UP</option><option value="f">FADE OUT</option><option value="s">STROBE</option><option value="b">BLINK</option>
                        <option value="w">WAVE</option><option value="r">RANDOM</option><option value="p">PULSE</option><option value="d">DROP</option><option value="z">ZIGZAG</option><option value="h">H-STROBE</option>
                    </select>
                </div>
            </div>

            <div class="flex-1 bg-gray-900/40 p-2 rounded-xl border border-gray-800 flex flex-col min-h-0">
                <div id="ledGrid" class="flex-1 grid grid-cols-10 gap-1 bg-black p-1 rounded-lg border border-gray-900 content-start"></div>
            </div>
        </div>

        <div class="fixed bottom-0 w-full bg-gray-950 border-t-2 border-green-500 p-3 flex justify-between items-center z-50 shadow-[0_-5px_20px_rgba(0,255,0,0.1)] cursor-pointer active:bg-gray-900" onclick="openCodeModal()">
            <div class="flex items-center space-x-2 w-full">
                <span class="text-[10px] text-green-400 font-bold bg-green-900/50 px-2 py-1 rounded">CODE</span>
                <div id="liveCode" class="text-[12px] font-mono text-green-400 overflow-hidden whitespace-nowrap text-ellipsis flex-1 font-bold tracking-widest pointer-events-none drop-shadow-[0_0_5px_#00e676]">...</div>
            </div>
        </div>
    </div>

    <div id="codeModal" class="fixed inset-0 hidden z-[60] modal-overlay flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-green-500 rounded-2xl p-4 w-full max-w-sm shadow-[0_0_30px_rgba(0,255,0,0.2)] flex flex-col">
            <h3 class="text-green-400 font-bold text-sm mb-2 text-center uppercase tracking-widest">RAW CODE DATA</h3>
            <textarea id="codeTextArea" class="w-full h-32 bg-black border border-gray-700 rounded-xl p-3 text-green-400 font-mono text-xs focus:border-green-500 focus:outline-none resize-none shadow-inner" placeholder="Paste โค้ดที่นี่ เพื่อแปลงกลับเป็นก้อนไฟ..."></textarea>
            <div class="flex space-x-2 mt-4">
                <button onclick="closeCodeModal()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-xl text-xs font-bold flex-1 transition">ยกเลิก</button>
                <button onclick="copyCode()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold flex-1 transition shadow-lg">COPY</button>
                <button onclick="applyPastedCode()" class="bg-green-600 hover:bg-green-500 text-black px-4 py-2 rounded-xl text-xs font-black flex-1 shadow-[0_0_10px_#00e676] transition">PASTE & APPLY</button>
            </div>
        </div>
    </div>

    <script>
        let globalBPM = 128;
        let baseBPM = 128; 
        
        let editorBPM = 128; // NEW: ตัวแปรคุมเส้น Grid ในหน้า Edit อิสระ
        let editorTapTimes = []; // NEW: ประวัติการเคาะหน้า Edit

        let tapTimes = [];
        let audioCtx = null; let micStream = null; let analyzer = null; 
        let isListeningMic = false; let micInterval = null; let lastBeatTime = 0; let micBpmArr = [];
        
        let isListeningKick = false; let kickInterval = null; let lastKickTime = 0;

        let stateHistory = [];
        let stateIndex = -1;
        let isNavigatingHistory = false;

        function saveState() {
            if (isNavigatingHistory) return;
            stateHistory = stateHistory.slice(0, stateIndex + 1);
            stateHistory.push(JSON.stringify(clips));
            stateIndex = stateHistory.length - 1;
        }

        function undoState() {
            if (stateIndex > 0) {
                stateIndex--;
                isNavigatingHistory = true;
                clips = JSON.parse(stateHistory[stateIndex]);
                renderClips();
                updateSelectedClipUI();
                isNavigatingHistory = false;
            }
        }

        function redoState() {
            if (stateIndex < stateHistory.length - 1) {
                stateIndex++;
                isNavigatingHistory = true;
                clips = JSON.parse(stateHistory[stateIndex]);
                renderClips();
                updateSelectedClipUI();
                isNavigatingHistory = false;
            }
        }

        function updateSelectedClipUI() {
            if(selectedClipId) {
                const c = clips.find(x => x.id === selectedClipId);
                if(c) {
                    document.getElementById('cBright').value = c.bright; 
                    document.getElementById('cFX').value = c.fx;
                    updateMirrorUI(c.mirror); renderLEDGrid(); renderColorBuilderSlots();
                } else {
                    selectedClipId = null; 
                    document.getElementById('editorPanel').style.opacity = "0.3";
                    document.getElementById('editorPanel').style.pointerEvents = "none";
                }
            }
        }

        let device, characteristic;
        let bgPatterns = Array.from({length: 60}, (_, i) => ({ id: i, code: "" }));
        let fgPatterns = Array.from({length: 60}, (_, i) => ({ id: i, code: "" }));
        
        let clips = []; 
        let activeLayer = 'BG'; 
        let activeIdxBG = -1;
        let activeIdxFG = -1;
        
        let selectedClipId = null; let selectedIdx = -1;
        let playheadTime = 0; let isPlaying = false;
        let playInterval, startAnimateTime;
        let currentLoopLimit = 1.0; let pxPerSec = 100;
        let isFollowingPlayhead = false;
        
        let sortableBG = null;
        let sortableFG = null;
        let isDraggingPad = false;

        let currentPowerPercent = 0;
        let currentRawPower = 0;
        let activeColorIndex = -1; let isWritingBLE = false;

        const colorMap = { 'bl': '#0000FF', 're': '#FF0000', 'gr': '#00FF00', 'ye': '#FFFF00', 'wh': '#FFFFFF', 'pu': '#8000FF', 'aq': '#00FFFF', 'or': '#FF8000', 'pk': '#FF00FF', 'cy': '#00FFFF' };
        const fxNames = { o: 'STATIC', u: 'FADE UP', f: 'FADE OUT', s: 'STROBE', b: 'BLINK', w: 'WAVE', r: 'RANDOM', p: 'PULSE', d: 'DROP', z: 'ZIGZAG', h: 'H-STROBE' };

        function setGlobalBPM(bpm) {
            globalBPM = bpm;
            document.getElementById('globalBpmDisplay').innerHTML = `${globalBPM} <span class="text-[10px] text-gray-500 font-bold">BPM</span>`;
            
            let ratio = globalBPM / baseBPM;
            let bgSlider = document.getElementById('bgSpeedSlider');
            if(bgSlider) { bgSlider.value = ratio; updateSpeed(ratio, 'BG'); }
            let fgSlider = document.getElementById('fgSpeedSlider');

        function tapTempo() {
            const now = Date.now();
            tapTimes.push(now);
            if (tapTimes.length > 5) tapTimes.shift();
            if (tapTimes.length > 1) {
                let diffs = [];
                for (let i = 1; i < tapTimes.length; i++) diffs.push(tapTimes[i] - tapTimes[i - 1]);
                let avgDiff = diffs.reduce((a, b) => a + b) / diffs.length;
                let bpm = Math.round(60000 / avgDiff);
                if (bpm > 30 && bpm < 300) setGlobalBPM(bpm);
            }
            if (isListeningMic) toggleMicListen(); 
        }

        // --- NEW: TAP TEMPO สำหรับหน้า Edit อิสระ ---
        function editorTapTempo() {
            const now = Date.now();
            editorTapTimes.push(now);
            if (editorTapTimes.length > 5) editorTapTimes.shift();
            if (editorTapTimes.length > 1) {
                let diffs = [];
                for (let i = 1; i < editorTapTimes.length; i++) diffs.push(editorTapTimes[i] - editorTapTimes[i - 1]);
                let avgDiff = diffs.reduce((a, b) => a + b) / diffs.length;
                let bpm = Math.round(60000 / avgDiff);
                if (bpm > 30 && bpm < 300) {
                    editorBPM = bpm;
                    updateGridBackground(); // ตีเส้น Grid ใหม่ทันที
                }
            }
            // เอฟเฟกต์ปุ่มบุ๋มเวลากด
            const btn = document.getElementById('editorTapBtn');
            btn.style.transform = 'scale(0.9)';
            btn.style.backgroundColor = 'white'; btn.style.color = '#ea580c';
            setTimeout(() => { btn.style.transform = 'none'; btn.style.backgroundColor = '#ea580c'; btn.style.color = 'white'; }, 100);
        }

        async function initAudio() {
            if (!audioCtx) {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyzer = audioCtx.createAnalyser(); analyzer.fftSize = 256;
                const source = audioCtx.createMediaStreamSource(micStream);
                source.connect(analyzer);
            }
        }

        async function toggleMicListen() {
            const btn = document.getElementById('btnAutoTempo');
            if (isListeningMic) {
                isListeningMic = false; clearInterval(micInterval);
                if (micStream && !isListeningKick) { micStream.getTracks().forEach(t => t.stop()); audioCtx.close(); audioCtx = null; }
                btn.classList.replace('bg-red-600', 'bg-blue-600');
                btn.innerHTML = '<span>🎙️</span><span>AUTO</span>';
            } else {
                try {
                    await initAudio();
                    isListeningMic = true;
                    if(isListeningKick) toggleKickListen(); 
                    
                    btn.classList.replace('bg-blue-600', 'bg-red-600');
                    btn.innerHTML = '<span>🔴</span><span>LISTEN</span>';
                    
                    const bufferLength = analyzer.frequencyBinCount;
                    const dataArray = new Uint8Array(bufferLength);
                    
                    micInterval = setInterval(() => {
                        analyzer.getByteFrequencyData(dataArray);
                        let sum = 0; for(let i=0; i<10; i++) sum += dataArray[i]; 
                        let avg = sum / 10;
                        
                        if (avg > 200) { 
                            let now = Date.now();
                            if (now - lastBeatTime > 300) { 
                                let diff = now - lastBeatTime; lastBeatTime = now;
                                if (diff < 2000) { 
                                    let bpm = Math.round(60000 / diff);
                                    if (bpm > 60 && bpm < 200) {
                                        micBpmArr.push(bpm);
                                        if (micBpmArr.length > 4) micBpmArr.shift();
                                        let avgBpm = Math.round(micBpmArr.reduce((a,b)=>a+b)/micBpmArr.length);
                                        setGlobalBPM(avgBpm);
                                    }
                                }
                            }
                        }
                    }, 50);
                } catch(err) { alert('ไม่สามารถใช้ไมค์ได้ครับ: ' + err.message); }
            }
        }

        async function toggleKickListen() {
            const btn = document.getElementById('btnKickListen');
            if (isListeningKick) {
                isListeningKick = false; clearInterval(kickInterval);
                if (micStream && !isListeningMic) { micStream.getTracks().forEach(t => t.stop()); audioCtx.close(); audioCtx = null; }
                btn.classList.replace('bg-red-600', 'bg-purple-600');
                btn.innerHTML = '<span>🥁</span><span>KICK</span>';
            } else {
                try {
                    await initAudio();
                    isListeningKick = true;
                    if(isListeningMic) toggleMicListen(); 
                    
                    btn.classList.replace('bg-purple-600', 'bg-red-600');
                    btn.innerHTML = '<span>🔴</span><span>KICK</span>';
                    
                    const bufferLength = analyzer.frequencyBinCount;
                    const dataArray = new Uint8Array(bufferLength);
                    
                    kickInterval = setInterval(async () => {
                        analyzer.getByteFrequencyData(dataArray);
                        let sum = 0; for(let i=0; i<5; i++) sum += dataArray[i]; 
                        let avg = sum / 5;
                        
                        if (avg > 220) { 
                            let now = Date.now();
                            if (now - lastKickTime > 250) { 
                                lastKickTime = now;
                                if(characteristic && !isWritingBLE) {
                                    try {
                                        isWritingBLE = true;
                                        let currentCode = "";
                                        if (activeIdxBG !== -1 && bgPatterns[activeIdxBG].code) {
                                            currentCode = bgPatterns[activeIdxBG].code;
                                        }
                                        
                                        if (currentCode) {
                                            await characteristic.writeValueWithoutResponse(new TextEncoder().encode("5" + currentCode));
                                        } else {
                                            await characteristic.writeValueWithoutResponse(new TextEncoder().encode("5(0099,a,wh,s0200)"));
                                        }
                                        isWritingBLE = false;
                                    } catch(e) { isWritingBLE = false; }
                                }
                            }
                        }
                    }, 30);
                } catch(err) { alert('ไม่สามารถใช้ไมค์ได้ครับ: ' + err.message); }
            }
        }

        document.getElementById('connectBtn').onclick = async () => {
            const btn = document.getElementById('connectBtn');
            if(device && device.gatt.connected) { device.gatt.disconnect(); return; }
            try {
                device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'PocketDJ-' }], optionalServices: ["0000ffe0-0000-1000-8000-00805f9b34fb"] });
                device.addEventListener('gattserverdisconnected', onDisconnected);
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
                characteristic = await service.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");
                btn.innerText = "ONLINE"; btn.className = "bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl shadow-[0_0_15px_#00e676] transition";
                await characteristic.startNotifications();
                
                updatePowerBar(100);

                setTimeout(() => {
                    let savedBG = parseInt(localStorage.getItem('lastActiveBG'));
                    if (!isNaN(savedBG) && savedBG >= 0 && savedBG < 60 && bgPatterns[savedBG].code) {
                        playFX(savedBG, null, 'BG');
                    }
                    let savedFG = parseInt(localStorage.getItem('lastActiveFG'));
                    if (!isNaN(savedFG) && savedFG >= 0 && savedFG < 60 && fgPatterns[savedFG].code) {
                        playFX(savedFG, null, 'FG');
                    }
                }, 1500); 

                characteristic.addEventListener('characteristicvaluechanged', (e) => {
                    let val = new TextDecoder().decode(e.target.value);
                    
                    if (val.startsWith("PWR:")) {
                        let parts = val.substring(4).split(':');
                        let percent = parseInt(parts[0]);
                        let raw = parts.length > 1 ? parseInt(parts[1]) : 0;
                        updatePowerBar(percent, raw);
                    }
                    else if (val.startsWith("DB")) {
                        let p = val.substring(2).split(":");
                        if(p.length >= 3) { bgPatterns[parseInt(p[0])].code = p[2] || ""; updatePadsVisuals('BG'); }
                    } else if (val.startsWith("DF")) {
                        let p = val.substring(2).split(":");
                        if(p.length >= 3) { fgPatterns[parseInt(p[0])].code = p[2] || ""; updatePadsVisuals('FG'); }
                    } else if (val.startsWith("OBG:")) {
                        let orderStr = val.substring(4);
                        if(orderStr) {
                            localStorage.setItem('padOrderBG', orderStr);
                            loadPatternOrder();
                            renderLayerPads('BG');
                        }
                    } else if (val.startsWith("OFG:")) {
                        let orderStr = val.substring(4);
                        if(orderStr) {
                            localStorage.setItem('padOrderFG', orderStr);
                            loadPatternOrder();
                            renderLayerPads('FG');
                        }
                    }
                });
                await characteristic.writeValue(new TextEncoder().encode("GET_ALL"));
            } catch (e) { alert("BT Error: " + e.message); }
        };

        function renderLayerPads(layer) {
            const gridId = layer === 'BG' ? 'padGridBG' : 'padGridFG';
            const grid = document.getElementById(gridId);
            
            if (!grid) {
                throw new Error("หากล่อง " + gridId + " ไม่เจอ กรุณาก๊อปปี้โค้ด HTML มาให้ครบถ้วนครับ!");
            }

            grid.innerHTML = '';
            let patterns = (layer === 'BG') ? bgPatterns : fgPatterns;
            let activeIdx = (layer === 'BG') ? activeIdxBG : activeIdxFG;

            patterns.forEach((p, index) => {
                const btn = document.createElement('div');
                btn.className = `pad-btn ${p.code ? 'has-code' : ''}`;
                
                if (index === activeIdx) btn.classList.add('playing');
                if(!p.code) { const hue = (p.id * 6) % 360; btn.style.backgroundColor = `hsl(${hue}, 30%, 15%)`; }
                btn.innerHTML = `<span class="text-lg font-black pad-num text-white/80">${p.id + 1}</span>`;
                
                let clickTimer = null;
                btn.addEventListener('click', () => {
                    if (isDraggingPad) return;
                    
                    const currentVisualIndex = patterns.indexOf(p);
                    if (clickTimer) {
                        clearTimeout(clickTimer); clickTimer = null;
                        openPopup(currentVisualIndex, layer); 
                    } else {
                        playFX(currentVisualIndex, btn, layer); 
                        clickTimer = setTimeout(() => { clickTimer = null; }, 300);
                    }
                });
                grid.appendChild(btn);
            });
            setupSortable(layer);
            updatePadsVisuals(layer); 
        }

        function renderPads() {

            renderLayerPads('FG');
        }

        function setupSortable(layer) {
            try {
                if (typeof Sortable === 'undefined') return;

                const gridId = layer === 'BG' ? 'padGridBG' : 'padGridFG';
                const grid = document.getElementById(gridId);
                if (!grid) return;

                let patterns = (layer === 'BG') ? bgPatterns : fgPatterns;
                
                const config = {
                    animation: 150, delay: 250, delayOnTouchOnly: false, touchStartThreshold: 5,
                    forceFallback: true, fallbackClass: "sortable-drag", fallbackOnBody: true,
                    onStart: () => { 
                        isDraggingPad = true; 
                        if (window.navigator.vibrate) window.navigator.vibrate(30); 
                    },
                    onEnd: (evt) => {
                        const item = patterns.splice(evt.oldIndex, 1)[0];
                        patterns.splice(evt.newIndex, 0, item);
                        if(layer === 'BG') {
                            if(activeIdxBG === evt.oldIndex) activeIdxBG = evt.newIndex;
                            else if(activeIdxBG === evt.newIndex) activeIdxBG = evt.oldIndex;
                        } else {
                            if(activeIdxFG === evt.oldIndex) activeIdxFG = evt.newIndex;
                            else if(activeIdxFG === evt.newIndex) activeIdxFG = evt.oldIndex;
                        }
                        savePatternOrder(layer); 
                        renderLayerPads(layer); 
                        setTimeout(() => { isDraggingPad = false; }, 50);
                    }
                };

                if(layer === 'BG') {
                    if (sortableBG) sortableBG.destroy();
                    sortableBG = new Sortable(grid, config);
                } else {
                    if (sortableFG) sortableFG.destroy();
                    sortableFG = new Sortable(grid, config);
                }
            } catch (err) {}
        }

        function updatePadsVisuals(layer) {

            let patterns = (layer === 'BG') ? bgPatterns : fgPatterns;

                else { btn.classList.remove('has-code'); const hue = (p.id * 6) % 360; btn.style.backgroundColor = `hsl(${hue}, 30%, 15%)`; }
                
                if (index === activeIdx) btn.classList.add('playing');

        }

                const vp = document.getElementById('timelineViewport');
                vp.dataset.ignoreScroll = "true";
                vp.scrollLeft = playheadTime * pxPerSec;
                setTimeout(() => { vp.dataset.ignoreScroll = "false"; }, 50);
                document.getElementById('playhead').style.left = (playheadTime * pxPerSec) + 'px';
            }
        }

        function applySpeedScale(val) {
            let scaleRatio = parseFloat(val);
            clips.forEach(c => { c.start = c.start * scaleRatio; c.duration = c.duration * scaleRatio; });
            document.getElementById('speedSlider').value = 1.0;
            markUnsaved(); renderClips(); updateCodeMonitor();
        }

        function renderClips() {
            const area = document.getElementById('trackArea'); area.innerHTML = '';
            clips.forEach(c => {
                const div = document.createElement('div');
                div.id = `clip-${c.id}`; div.className = `light-clip ${selectedClipId === c.id ? 'selected' : ''}`;
                div.style.left = (c.start * pxPerSec) + 'px'; div.style.width = (c.duration * pxPerSec) + 'px'; 
                div.style.top = (c.track * 20) + 'px';
                div.innerText = fxNames[c.fx] || c.fx.toUpperCase();
                
                if (!c.target || c.target === '') { div.style.backgroundColor = '#555555'; div.style.color = '#aaaaaa'; } 
                else if(c.color.includes('2')) {
                    const parts = c.color.split('2');
                    div.style.background = `linear-gradient(to right, ${colorMap[parts[0]] || '#333'}, ${colorMap[parts[1]] || '#333'})`;
                } else { div.style.backgroundColor = colorMap[c.color] || '#555'; }
                
                area.appendChild(div);
                
                // --- NEW: MAGNETIC SMART SNAP LOGIC ---
                interact(div).draggable({
                    listeners: {
                        start(e) { c.tempY = c.track * 20; c.tempStart = c.start; },
                        move(e) {
                            c.tempStart += e.dx / pxPerSec;
                            let beatTime = 60 / editorBPM; 
                            let closestBeat = Math.round(c.tempStart / beatTime) * beatTime;
                            let threshold = 15 / pxPerSec; // รัศมีแม่เหล็กดูด 15 pixels
                            
                            if (Math.abs(c.tempStart - closestBeat) <= threshold) {
                                c.start = closestBeat;
                            } else {
                                c.start = c.tempStart;
                            }
                            c.start = Math.max(0, c.start);
                            
                            c.tempY += e.dy; c.track = Math.max(0, Math.min(5, Math.round(c.tempY / 20))); 
                            e.target.style.left = (c.start * pxPerSec) + 'px'; e.target.style.top = (c.track * 20) + 'px';
                            if(!isPlaying) scrubLiveFrame();
                        },
                        end(e) { 
                            c.tempY = undefined; c.tempStart = undefined;
                            markUnsaved(); updateLoopLine(); renderClips(); sendFullCodeToBT(); updateCodeMonitor(); 
                        }
                    }
                }).resizable({ 
                    edges: { right: true, left: true }, 
                    listeners: { 
                        start(e) { c.tempStart = c.start; },
                        move(e) { 
                            let beatTime = 60 / editorBPM;
                            let threshold = 15 / pxPerSec;
                            
                            if(e.edges.left) { 
                                c.tempStart += e.dx / pxPerSec; 
                                let closestBeat = Math.round(c.tempStart / beatTime) * beatTime;
                                c.start = Math.abs(c.tempStart - closestBeat) <= threshold ? closestBeat : c.tempStart;
                                c.start = Math.max(0, c.start); 
                            }
                            let rawDur = e.rect.width / pxPerSec;
                            let closestDur = Math.round(rawDur / beatTime) * beatTime;
                            
                            c.duration = Math.abs(rawDur - closestDur) <= threshold ? Math.max(beatTime/4, closestDur) : rawDur; 
                            c.duration = Math.max(0.1, c.duration); 
                            
                            e.target.style.left = (c.start * pxPerSec) + 'px'; e.target.style.width = (c.duration * pxPerSec) + 'px'; 
                            if(!isPlaying) scrubLiveFrame(); 
                        },
                        end(e) { 
                            c.tempStart = undefined;
                            markUnsaved(); updateLoopLine(); renderClips(); sendFullCodeToBT(); updateCodeMonitor(); 
                        }
                    } 
                }).on('tap', function(event) { selectClip(c.id); })
                  .on('hold', function(event) {
                    selectClip(c.id);
                    let newClip = JSON.parse(JSON.stringify(c));
                    newClip.id = Date.now(); newClip.start += 0.5; newClip.track = Math.min(5, newClip.track + 1); 
                    clips.push(newClip); markUnsaved(); renderClips();
                    if (window.navigator.vibrate) window.navigator.vibrate(50);
                });
            });
            updateLoopLine(); updateCodeMonitor();
        }

        function addColorSlot() {
            const c = clips.find(x => x.id === selectedClipId);
            if(c) {
                let parts = c.color.split('2'); parts.push(parts[parts.length-1]); 
                c.color = parts.join('2'); activeColorIndex = parts.length - 1; 
                markUnsaved(); updateSelectedClip();
            }
        }
        function delColorSlot() {
            const c = clips.find(x => x.id === selectedClipId);
            if(c) {
                let parts = c.color.split('2');
                if(parts.length > 1) { 
                    parts.pop(); c.color = parts.join('2'); activeColorIndex = parts.length - 1; 
                    markUnsaved(); updateSelectedClip();
                }
            }
        }
        function setActiveColor(k) {
            const c = clips.find(x => x.id === selectedClipId);
            if(c) {
                let parts = c.color.split('2');
                if (activeColorIndex >= 0 && activeColorIndex < parts.length) { parts[activeColorIndex] = k; } 
                else { parts[parts.length - 1] = k; }
                c.color = parts.join('2');
                markUnsaved(); updateSelectedClip();
            }
        }
        function resetColorBuilder() { const c = clips.find(x => x.id === selectedClipId); if(c) { c.color = 'bl'; activeColorIndex = 0; markUnsaved(); updateSelectedClip(); } }

        function renderColorBuilderSlots() {
            const c = clips.find(x => x.id === selectedClipId);
            const slots = document.getElementById('colorSlots'); slots.innerHTML = '';
            if(!c) return;

            let colors = c.color.split('2');
            if (activeColorIndex >= colors.length || activeColorIndex < 0) activeColorIndex = colors.length - 1;

            colors.forEach((col, idx) => {
                let box = document.createElement('div');
                const isSelected = (idx === activeColorIndex);
                box.className = `w-6 h-6 rounded border-2 shadow-lg flex-shrink-0 transition-transform cursor-pointer ${isSelected ? 'border-white scale-110' : 'border-gray-700'}`;
                box.style.backgroundColor = colorMap[col] || '#333';
                box.onclick = () => { activeColorIndex = idx; renderColorBuilderSlots(); };
                slots.appendChild(box);
            });
        }

        function initColors() {
            const p = document.getElementById('colorPalette'); p.innerHTML = '';
            Object.keys(colorMap).forEach(k => {
                const d = document.createElement('div'); d.className = 'w-6 h-6 rounded border border-gray-700 flex-shrink-0 cursor-pointer shadow active:scale-95'; d.style.backgroundColor = colorMap[k];
                d.onclick = () => setActiveColor(k);
                p.appendChild(d);
            });
        }

        function toggleMirror() {
            const c = clips.find(x => x.id === selectedClipId);
            if(c) {
                c.mirror = !c.mirror;
                if(c.mirror) {
                    let currentLEDs = c.target.match(/<(\d+)>/g) || [];
                    currentLEDs.forEach(led => {
                        let num = parseInt(led.replace(/<|>/g, ''));
                        let pair = 68 - num; 
                        if(pair > 0 && pair <= 300 && !c.target.includes('<'+pair+'>')) { c.target += '<'+pair+'>'; }
                    });
                }
                markUnsaved(); updateSelectedClip();
            }
        }
        function updateMirrorUI(isMirror) {
            const btn = document.getElementById('cMirrorBtn');
            if(isMirror) { btn.className = "w-4 h-4 rounded-full border-2 border-green-500 bg-green-500 shadow-[0_0_8px_#00e676]"; } 
            else { btn.className = "w-4 h-4 rounded-full border-2 border-gray-600 bg-transparent"; }
        }

        function selectClip(id) {
            selectedClipId = id; const c = clips.find(x => x.id === id);
            document.getElementById('editorPanel').style.opacity = "1"; document.getElementById('editorPanel').style.pointerEvents = "auto";
            document.getElementById('cBright').value = c.bright; document.getElementById('cFX').value = c.fx;
            activeColorIndex = -1; updateMirrorUI(c.mirror); renderLEDGrid(); renderColorBuilderSlots();
            
            document.querySelectorAll('.light-clip').forEach(el => {
                if (el.id === `clip-${id}`) el.classList.add('selected'); else el.classList.remove('selected');
            });
            
            if(!isPlaying) {
                playheadTime = c.start;
                const vp = document.getElementById('timelineViewport');
                vp.dataset.ignoreScroll = "true";
                vp.scrollTo({ left: playheadTime * pxPerSec, behavior: 'smooth' });
                setTimeout(() => { vp.dataset.ignoreScroll = "false"; }, 500);
                
                document.getElementById('playhead').style.left = (playheadTime * pxPerSec) + 'px';
                document.getElementById('timeText').innerText = `PLAYHEAD: ${playheadTime.toFixed(1)}s / END: ${currentLoopLimit.toFixed(1)}s`;
                scrubLiveFrame();
            }
        }

        function updateSelectedClip() {
            if(!selectedClipId) return; const c = clips.find(x => x.id === selectedClipId);
            c.bright = document.getElementById('cBright').value; c.fx = document.getElementById('cFX').value;
            markUnsaved(); updateMirrorUI(c.mirror);
            renderClips(); renderColorBuilderSlots(); if(!isPlaying) scrubLiveFrame(); else sendFullCodeToBT();
        }

        function renderLEDGrid() {
            const grid = document.getElementById('ledGrid'); grid.innerHTML = '';
            const c = clips.find(x => x.id === selectedClipId);
            if(!c) return;

            const markers = [7,8,9,10, 18,19,20,21, 29,30,31,32, 37,38,39,40, 48,49,50,51, 59,60,61,62, 68,69,70];

            for(let i=1; i<=300; i++) { 
                const d = document.createElement('div'); d.innerText = i;
                let isMarked = markers.includes(i) ? 'led-mark' : 'border-[#222]';
                let isActive = c.target.includes('<'+i+'>') ? 'led-active' : 'bg-[#111] text-gray-400';
                
                d.className = `text-[8px] h-6 border rounded flex items-center justify-center cursor-pointer ${isMarked} ${isActive}`;
                d.addEventListener('click', (e) => { 
                    let targetStr = '<' + i + '>';
                    let pair = c.mirror ? (68 - i) : null;
                    let pairStr = pair ? '<' + pair + '>' : '';

                    if(c.target.includes(targetStr)) { 
                        c.target = c.target.replace(targetStr,''); 
                        if(pairStr) c.target = c.target.replace(pairStr,'');
                    } else { 
                        c.target += targetStr; 
                        if(pairStr && !c.target.includes(pairStr)) c.target += pairStr;
                    } 
                    markUnsaved(); renderLEDGrid(); updateSelectedClip(); 
                });
                grid.appendChild(d);
            }
        }

        function generateCodeStr() {
            let code = "";
            clips.sort((a,b)=>a.start-b.start).forEach(c => {
                let m = c.mirror ? 'm' : '';
                let s = Math.min(99, Math.round(c.start*10)).toString().padStart(2,'0'), b = parseInt(c.bright).toString().padStart(2,'0'), d = Math.min(99, Math.round(c.duration*10)).toString().padStart(2,'0');
                code += `${m}(${s}${b},${c.target || 'a'},${c.color},${c.fx}${d}00)`; 
            });
            return code;
        }

        async function saveAndSend() {
            let patterns = (activeLayer === 'BG') ? bgPatterns : fgPatterns;
            patterns[selectedIdx].code = generateCodeStr();
            
            let prefix = (activeLayer === 'BG') ? 'SB' : 'SF';
            if(characteristic) await characteristic.writeValue(new TextEncoder().encode(`${prefix}${selectedIdx}:${patterns[selectedIdx].code}`));
            
            if(window.location.hash === '#edit') history.back();
            else closePopupDirectly();
        }
        
        function updateLoopLine() { let maxT = 0; clips.forEach(c => { let end = c.start + c.duration; if (end > maxT) maxT = end; }); currentLoopLimit = maxT > 0 ? maxT : 1.0; const ll = document.getElementById('loopLine'); if (ll) { ll.style.left = (currentLoopLimit * pxPerSec) + 'px'; ll.style.display = clips.length > 0 ? 'block' : 'none'; } }
        function addClipAtPlayhead() { const id = Date.now(); clips.push({ id, start: playheadTime, duration: 1.0, target: "", color: "bl", fx: "o", bright: 10, loop: 1, mirror: false, track: clips.length % 6 }); markUnsaved(); renderClips(); selectClip(id); }
        function deleteSelectedClip() { if(selectedClipId) { clips = clips.filter(c => c.id !== selectedClipId); selectedClipId = null; markUnsaved(); renderClips(); } }
        
        document.getElementById('timelineViewport').addEventListener('scroll', function() {
            if (!isPlaying && this.dataset.ignoreScroll !== "true") {
                playheadTime = Math.max(0, this.scrollLeft / pxPerSec);
                document.getElementById('playhead').style.left = (playheadTime * pxPerSec) + 'px';
                document.getElementById('timeText').innerText = `PLAYHEAD: ${playheadTime.toFixed(1)}s / END: ${currentLoopLimit.toFixed(1)}s`;
                scrubLiveFrame();
            }
        });

        function togglePlay() { 
            const btn = document.getElementById('playBtn'); 
            if (!isPlaying) { 
                isPlaying = true; btn.innerText = "STOP"; btn.classList.replace('bg-red-600', 'bg-blue-600'); 
                sendFullCodeToBT(); 
                startAnimateTime = performance.now() - (playheadTime * 1000); 
                playInterval = requestAnimationFrame(animatePlayhead); 
            } else { stopPlayback(); } 
        }
        
        function stopPlayback() { 
            isPlaying = false; 
            const btn = document.getElementById('playBtn'); 
            if (btn) { btn.innerText = "STOP"; btn.classList.replace('bg-blue-600', 'bg-red-600'); } 
            cancelAnimationFrame(playInterval); 
            
            const vp = document.getElementById('timelineViewport');
            vp.dataset.ignoreScroll = "true";
            vp.scrollTo({ left: playheadTime * pxPerSec, behavior: 'smooth' });
            setTimeout(() => { vp.dataset.ignoreScroll = "false"; }, 50);

            document.getElementById('playhead').style.left = (playheadTime * pxPerSec) + 'px';
            document.getElementById('timeText').innerText = `PLAYHEAD: ${playheadTime.toFixed(1)}s / END: ${currentLoopLimit.toFixed(1)}s`;
            
            scrubLiveFrame(); 
        }
        
        function animatePlayhead(currentTime) { 
            if (!isPlaying) return; 
            let elapsed = (currentTime - startAnimateTime) / 1000; 
            if (elapsed >= currentLoopLimit) { startAnimateTime = currentTime; elapsed = 0; sendFullCodeToBT(); } 
            playheadTime = elapsed; 
            
            document.getElementById('playhead').style.left = (playheadTime * pxPerSec) + 'px'; 
            document.getElementById('timeText').innerText = `PLAYHEAD: ${playheadTime.toFixed(1)}s / END: ${currentLoopLimit.toFixed(1)}s`; 
            
            if(isFollowingPlayhead) {
                const vp = document.getElementById('timelineViewport');
                vp.dataset.ignoreScroll = "true";
                vp.scrollLeft = playheadTime * pxPerSec;
            }
            playInterval = requestAnimationFrame(animatePlayhead); 
        }

        function updateCodeMonitor() { document.getElementById('liveCode').innerText = generateCodeStr() || "CODE..."; }
        
        async function sendFullCodeToBT() { 
            if(!characteristic) return; 
            let codeStr = generateCodeStr();
            let cmd = (activeLayer === 'BG') ? "5" + codeStr : "FG:5" + codeStr;
            try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode(cmd)); } catch(e){} 
        }
        
        let lastSentOff = false;

        async function scrubLiveFrame() { 
            if(!characteristic || isPlaying || isWritingBLE) return; 
            
            let activeClips = clips.filter(c => playheadTime >= c.start && playheadTime <= c.start + c.duration);
            if (activeClips.length === 0) {
                if (!lastSentOff) {
                    try { 
                        isWritingBLE = true;
                        let cmd = (activeLayer === 'BG') ? "off" : "FG:off";
                        await characteristic.writeValueWithoutResponse(new TextEncoder().encode(cmd)); 
                        isWritingBLE = false; lastSentOff = true;
                    } catch(e){ isWritingBLE = false; }
                }
                return;
            }
            
            lastSentOff = false;
            let code = (activeLayer === 'BG') ? "5" : "FG:5";

            activeClips.forEach(c => {
                let p = (playheadTime - c.start) / c.duration;
                if(p < 0) p = 0; if(p > 1) p = 1;
                
                let f = 1.0;
                if (c.fx === 'u') f = p;
                else if (c.fx === 'f') f = 1.0 - p;
                else if (c.fx === 'w') f = 0.3 + (0.7 * Math.sin(Math.PI * p));
                else if (c.fx === 'p') f = Math.pow(Math.sin(Math.PI * p), 4);
                else if (c.fx === 'd') f = Math.pow(1.0 - p, 4);
                else if (c.fx === 'z') f = 1.0 - ((p * 4.0) % 1.0);
                
                let br = Math.max(0, Math.min(99, Math.round(c.bright * f)));
                let bStr = br.toString().padStart(2, '0');
                let m = c.mirror ? 'm' : '';
                
                let colorCodes = c.color.split('2');
                let step = 1.0 / (colorCodes.length > 1 ? colorCodes.length - 1 : 1);
                let idx = Math.floor(p / step);
                if (idx >= colorCodes.length) idx = colorCodes.length - 1;
                let showColor = colorCodes[idx] || colorCodes[0];
                
                code += `${m}(00${bStr},${c.target || 'a'},${showColor},o9900)`; 
            });
            try { 
                isWritingBLE = true;
                await characteristic.writeValueWithoutResponse(new TextEncoder().encode(code)); 
                isWritingBLE = false;
            } catch(e){ isWritingBLE = false; } 
        }

        let wakeLock = null;
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (err) {}
        }
        document.addEventListener('pointerdown', () => { if (!wakeLock) requestWakeLock(); }, { once: true });
        document.addEventListener('visibilitychange', async () => { if (wakeLock !== null && document.visibilityState === 'visible') await requestWakeLock(); });

        window.onload = () => {
            try {
                renderPads();
                updateGridBackground(); 
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message + "\n\n(รบกวนแคปจอนี้ให้พี่เจดูหน่อยนะครับ)");
            }
        };
    </script>
</body>
