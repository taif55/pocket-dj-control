<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket DJ Studio Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #2ecc71;
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* แถบปรับความเร็ว */
        .controls {
            width: 100%;
            max-width: 500px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .speed-slider {
            width: 100%;
            accent-color: #2ecc71;
        }

        /* ตารางปุ่ม */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }

        .dj-button {
            aspect-ratio: 1 / 1;
            background-color: #1e1e1e;
            border: 2px solid #2ecc71;
            border-radius: 12px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: grab;
            transition: transform 0.1s, background-color 0.2s;
            user-select: none;
        }

        .dj-button:active {
            cursor: grabbing;
            background-color: #2ecc71;
            color: black;
        }

        /* สไตล์ตอนกำลังลาก */
        .sortable-ghost {
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="font-style: italic;">POCKET DJ STUDIO</h2>
        <div style="background: #2ecc71; color: black; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold;">ONLINE</div>
    </div>

    <div class="controls">
        <label for="speed">SPEED: <span id="speed-val">1.0</span>x</label>
        <input type="range" id="speed" class="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="grid-container" id="grid">
        </div>

    <script>
        const grid = document.getElementById('grid');
        const speedSlider = document.getElementById('speed');
        const speedVal = document.getElementById('speed-val');

        // 1. สร้างปุ่ม 60 ปุ่ม
        for (let i = 1; i <= 60; i++) {
            const btn = document.createElement('div');
            btn.className = 'dj-button';
            btn.innerText = i;
            // ใส่ฟังก์ชันเมื่อคลิกที่ปุ่ม
            btn.onclick = () => console.log(`เล่นเสียงที่ ${i}`);
            grid.appendChild(btn);
        }

        // 2. ตั้งค่าการลากวาง (SortableJS)
        new Sortable(grid, {
            animation: 150,
            ghostClass: 'sortable-ghost'
        });

        // 3. อัปเดตตัวเลขความเร็ว
        speedSlider.oninput = function() {
            speedVal.innerText = this.value;
        };
    </script>
</body>
</html>
