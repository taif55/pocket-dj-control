<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket DJ Studio - Final Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; background: #050505; color: white; 
            user-select: none; overflow: hidden; height: 100vh;
            display: flex; flex-direction: column;
        }

        .pad-container {
            margin: 0 auto; width: 95%; height: 70vh; 
            background: #0a0a0a; border: 2px solid #222; border-radius: 20px;
            position: relative; overflow: hidden; display: flex;
        }

        #padGrid {
            flex: 1; display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 10px; padding: 15px;
            overflow-y: auto; scrollbar-width: none; 
            touch-action: none; /* ล็อคการสไลด์เพื่อส่งสิทธิ์ให้ SortableJS 100% */
        }
        #padGrid::-webkit-scrollbar { display: none; } 

        .side-scroll-track {
            width: 30px; background: #111; border-left: 1px solid #222;
            display: flex; align-items: center; justify-content: center;
            touch-action: pan-y;
        }
        .side-scroll-track::after { content: '↕'; color: #444; font-size: 20px; }

        .pad-btn { 
            background: #151515; border: 1px solid #333; aspect-ratio: 1/1; 
            border-radius: 12px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; position: relative;
        }

        .drag-handle { 
            position: absolute; top: 0; left: 0; width: 40px; height: 40px; 
            display: flex; align-items: center; justify-content: center; 
            color: #444; font-size: 18px; cursor: grab; z-index: 10;
        }

        /* หัวใจสำคัญ: สไตล์สำหรับตัวที่กำลังถูกลาก (ลอยติดนิ้ว) */
        .sortable-drag { 
            opacity: 1 !important; 
            z-index: 9999 !important; 
            background: #222 !important;
            border: 2px solid #00e676 !important;
            box-shadow: 0 20px 50px rgba(0,0,0,1) !important;
            pointer-events: none; /* สำคัญ: ปิดเพื่อให้เบราว์เซอร์มองทะลุไปเห็นช่องที่จะวางข้างใต้ */
        }
        .sortable-ghost { opacity: 0.1; background: #00e676 !important; }
    </style>
</head>
<body class="p-4">

    <div id="consoleView" class="max-w-xl mx-auto w-full">
        <div class="flex justify-between items-center mb-4 bg-gray-900/50 p-4 rounded-3xl border border-gray-800">
            <h1 class="text-lg font-black text-green-500 italic uppercase">DJ Master Sync</h1>
            <button id="connectBtn" class="bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl active:scale-95 transition">CONNECT</button>
        </div>
    </div>

    <div class="pad-container max-w-xl">
        <div id="padGrid"></div>
        <div class="side-scroll-track" id="sideScroll"></div>
    </div>

    <script>
        let patterns = Array.from({length: 60}, (_, i) => ({ id: i }));
        const grid = document.getElementById('padGrid');

        function renderPads() {
            grid.innerHTML = '';
            patterns.forEach((p, idx) => {
                const btn = document.createElement('div');
                btn.className = 'pad-btn';
                btn.innerHTML = `
                    <div class="drag-handle">⠿</div>
                    <span class="text-xs font-black pad-num">${idx+1}</span>
                `;
                
                btn.onclick = (e) => {
                    if (e.target.classList.contains('drag-handle')) return;
                    // playFX(idx); 
                };
                grid.appendChild(btn);
            });

            // แก้ไข Logic การวาง (Drop) ให้หนึบที่สุด
            new Sortable(grid, {
                handle: '.drag-handle',
                animation: 150,
                forceFallback: true,        // ใช้ระบบจำลองการลาก
                fallbackClass: "sortable-drag",
                fallbackOnBody: true,       // ดึงปุ่มที่ลากออกมาไว้ข้างนอกเพื่อให้วางง่ายขึ้น
                swapThreshold: 0.65,        // ลากทับแค่ 65% ของปุ่มอื่นก็ให้สลับที่ทันที
                invertSwap: true,           // ช่วยให้การสลับที่แม่นยำขึ้นในพื้นที่แคบ
                
                onStart: (evt) => {
                    if (window.navigator.vibrate) window.navigator.vibrate(30);
                },
                onEnd: (evt) => {
                    // ปรับตำแหน่งใน Array จริง
                    const item = patterns.splice(evt.oldIndex, 1)[0];
                    patterns.splice(evt.newIndex, 0, item);
                    
                    // อัปเดตเลขหน้าจอใหม่
                    grid.querySelectorAll('.pad-num').forEach((num, i) => {
                        num.innerText = i + 1;
                    });
                }
            });
        }

        // ระบบสไลด์แถบข้าง (Side Scroll)
        const sideScroll = document.getElementById('sideScroll');
        let isScrolling = false;
        let startY, startScrollTop;

        sideScroll.addEventListener('touchstart', (e) => {
            isScrolling = true;
            startY = e.touches[0].pageY;
            startScrollTop = grid.scrollTop;
        }, {passive: true});

        sideScroll.addEventListener('touchmove', (e) => {
            if (!isScrolling) return;
            const deltaY = (e.touches[0].pageY - startY) * 2.5; 
            grid.scrollTop = startScrollTop - deltaY;
        }, {passive: true});

        sideScroll.addEventListener('touchend', () => isScrolling = false);

        renderPads();
    </script>
</body>
</html>
