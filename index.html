<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket DJ Studio - PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: white; user-select: none; overflow-x: hidden; }
        .pad-btn { 
            background: #151515; border: 1px solid #333; aspect-ratio: 1/1; 
            border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            cursor: pointer; transition: transform 0.1s; position: relative; overflow: hidden; touch-action: none; 
        }
        .pad-btn:active { transform: scale(0.95); background: #222; }
        .pad-btn.active { background: #00e676 !important; color: black; box-shadow: 0 0 15px #00e676; border-color: #fff; }
        .pad-btn.has-code { border-color: #00e676; }
        
        .hold-ring { position: absolute; inset: 0; border: 4px solid transparent; border-top-color: #00e676; border-radius: 12px; opacity: 0; pointer-events: none; z-index: 10; }
        .is-holding .hold-ring { opacity: 1; animation: spin 0.5s linear forwards; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        #timelineViewport { background: #0a0a0a; border-bottom: 1px solid #222; position: relative; height: 180px; overflow-x: auto; overflow-y: hidden; }
        #timelineContent { position: relative; height: 100%; width: 2000px; background-image: linear-gradient(to right, #1a1a1a 1px, transparent 1px); background-size: 100px 100%; }
        #playhead { position: absolute; top: 0; width: 2px; height: 100%; background: #ff3d00; z-index: 50; pointer-events: none; box-shadow: 0 0 8px #ff3d00; }
        #loopLine { position: absolute; top: 0; width: 2px; height: 100%; background: #00e676; z-index: 45; pointer-events: none; box-shadow: 0 0 10px #00e676; opacity: 0.8; }
        
        .light-clip { 
            position: absolute; height: 34px; color: black; border-radius: 6px; font-size: 9px; font-weight: 900; 
            display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; 
            border: 1px solid rgba(255,255,255,0.2); 
        }
        .light-clip.selected { border: 2px solid white; box-shadow: 0 0 12px #00e676; z-index: 40; }
        
        .sortable-ghost { opacity: 0.2; }
        .sortable-chosen { opacity: 0.7; }
        .sortable-drag { opacity: 0.92; transform: scale(1.08) rotate(3deg); box-shadow: 0 20px 40px rgba(0,0,0,0.7); z-index: 9999; }
    </style>
</head>
<body class="p-4">
    <div id="consoleView" class="max-w-xl mx-auto">
        <div class="bg-gray-900/50 p-5 rounded-3xl border border-gray-800 shadow-xl mb-4">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-black text-green-500 italic uppercase">DJ Studio Pro</h1>
                <button id="connectBtn" class="bg-green-500 text-black text-[10px] font-black px-5 py-2 rounded-2xl transition">CONNECT</button>
            </div>
            <div class="space-y-1">
                <div class="flex justify-between text-[10px] font-bold text-gray-500 uppercase">
                    <span>Global Playback Speed</span>
                    <span id="speedVal" class="text-green-500 text-sm">1.0x</span>
                </div>
                <input type="range" id="globalSpeed" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full accent-green-500 h-8" oninput="speedVal.innerText=this.value+'x'; updateGlobalSpeed(this.value)">
            </div>
        </div>
        <div id="padGrid" class="grid grid-cols-5 gap-3 pb-32"></div>
    </div>

    <!-- Modal / Timeline Editor -->
    <div id="modal" class="fixed inset-0 hidden z-50 flex flex-col bg-[#050505]">
        <div class="flex justify-between items-center p-3 bg-gray-900 border-b border-gray-800">
            <button onclick="closePopup()" class="text-gray-400 font-bold text-xs uppercase">Back</button>
            <div class="flex space-x-2">
                <button id="playBtn" onclick="togglePlay()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black shadow-lg">PLAY</button>
                <button onclick="addClipAtPlayhead()" class="bg-green-600 text-black px-4 py-2 rounded-xl text-[10px] font-black">+ CLIP</button>
                <button onclick="deleteSelectedClip()" class="bg-red-900 text-white px-4 py-2 rounded-xl text-[10px] font-black">Del</button>
            </div>
            <button onclick="saveAndSend()" class="bg-white text-black font-black px-4 py-2 rounded-lg text-xs uppercase">Save</button>
        </div>
        <div id="timelineViewport" onclick="handleTimelineClick(event)">
            <div id="timelineContent">
                <div id="playhead"></div>
                <div id="loopLine"></div>
                <div id="trackArea" class="relative h-full py-6"></div>
            </div>
        </div>
        <div id="timeText" class="bg-black text-[10px] text-center p-1 text-gray-500 font-mono">PLAYHEAD: 0.0s</div>
        <div id="editorPanel" class="flex-1 overflow-y-auto p-4 space-y-3 opacity-30 pointer-events-none pb-12">
            <!-- ... ส่วน editor เหมือนเดิม ... -->
            <div class="bg-gray-900/40 p-3 rounded-2xl border border-gray-800">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] font-black text-gray-400 uppercase">Color Selection</span>
                    <input type="text" id="customColor" class="bg-black border border-gray-800 px-2 py-1 rounded text-[10px] text-green-500 outline-none w-20 text-center" oninput="updateSelectedClip()">
                </div>
                <div id="colorPalette" class="flex flex-wrap gap-2 justify-center"></div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-gray-900/40 p-3 rounded-2xl border border-gray-800 text-center">
                    <div class="text-[9px] text-gray-500 mb-1 font-bold uppercase">Brightness</div>
                    <input type="number" id="cBright" value="10" class="bg-transparent text-center font-black text-xl w-full outline-none" oninput="updateSelectedClip()">
                </div>
                <div class="bg-gray-900/40 p-3 rounded-2xl border border-gray-800">
                    <select id="cFX" class="w-full h-full bg-transparent text-xs font-black text-green-400 uppercase outline-none" onchange="updateSelectedClip()">
                        <option value="o">Static</option>
                        <option value="u">Fade Up</option>
                        <option value="f">Fade Out</option>
                        <option value="s">Strobe</option>
                        <option value="b">Blink</option>
                    </select>
                </div>
            </div>
            <div class="bg-gray-900/40 p-3 rounded-2xl border border-gray-800">
                <div id="ledGrid" class="grid grid-cols-10 gap-1 h-32 overflow-y-auto bg-black p-2 rounded-lg border border-gray-900"></div>
            </div>
        </div>
    </div>

    <script>
        // ────────────────────────────────────────────────
        // ตัวแปรหลัก
        // ────────────────────────────────────────────────
        let device, characteristic;
        let patterns = Array.from({length: 60}, (_, i) => ({ id: i, code: "" }));
        let clips = [];
        let selectedClipId = null;
        let selectedIdx = -1;
        let playheadTime = 0;
        let isPlaying = false;
        let playInterval;
        let startAnimateTime;
        let currentLoopLimit = 1.0;
        const pxPerSec = 100;
        const colorMap = { 
            'bl': '#0000FF', 're': '#FF0000', 'gr': '#00FF00', 'ye': '#FFFF00', 
            'wh': '#FFFFFF', 'pu': '#8000FF', 'aq': '#00FFFF', 'or': '#FF8000' 
        };

        // ────────────────────────────────────────────────
        // Render ปุ่ม 60 ปุ่ม + ลากสลับได้ + กดสั้นเล่น / กดค้าง popup
        // ────────────────────────────────────────────────
        function renderPads() {
            const grid = document.getElementById('padGrid');
            grid.innerHTML = '';

            patterns.forEach((p, idx) => {
                const btn = document.createElement('div');
                btn.className = `pad-btn ${p.code ? 'has-code' : ''}`;
                btn.dataset.idx = idx;
                
                btn.innerHTML = `
                    <div class="hold-ring"></div>
                    <span class="text-xs font-black pad-num">${idx + 1}</span>
                `;

                let tapTimer = null;
                let startX, startY;

                btn.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    startX = e.clientX;
                    startY = e.clientY;
                    btn.classList.add('is-holding');

                    tapTimer = setTimeout(() => {
                        btn.classList.remove('is-holding');
                        openPopup(parseInt(btn.dataset.idx));
                    }, 550);
                });

                btn.addEventListener('pointerup', (e) => {
                    clearTimeout(tapTimer);
                    btn.classList.remove('is-holding');

                    const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
                    if (dist > 12) return;

                    playFX(parseInt(btn.dataset.idx), btn);
                });

                btn.addEventListener('contextmenu', e => e.preventDefault());

                grid.appendChild(btn);
            });

            new Sortable(grid, {
                animation: 180,
                delay: 300,
                delayOnTouchOnly: true,
                touchStartThreshold: 6,
                fallbackTolerance: 8,
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                dragClass: 'sortable-drag',

                onStart: (evt) => {
                    clearTimeout(window.popupTimer);
                    evt.item.classList.remove('is-holding');
                    evt.item.classList.add('is-dragging');
                },

                onEnd: (evt) => {
                    evt.item.classList.remove('is-dragging');

                    patterns = Array.from(grid.children).map(el => 
                        patterns[parseInt(el.dataset.idx)]
                    );

                    grid.querySelectorAll('.pad-btn').forEach((el, newIdx) => {
                        el.querySelector('.pad-num').textContent = newIdx + 1;
                        el.dataset.idx = newIdx;
                    });
                }
            });
        }

        // ────────────────────────────────────────────────
        // ฟังก์ชันอื่น ๆ (เหมือนเดิม แต่ผมย่อบางส่วนเพื่อความกระชับ)
        // ────────────────────────────────────────────────
        async function playFX(idx, el) {
            if (!characteristic || !patterns[idx].code) return;
            document.querySelectorAll('.pad-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            try {
                await characteristic.writeValueWithoutResponse(
                    new TextEncoder().encode("5" + patterns[idx].code)
                );
            } catch(e) {}
        }

        async function updateGlobalSpeed(v) {
            if (characteristic) {
                await characteristic.writeValueWithoutResponse(
                    new TextEncoder().encode("T" + v)
                );
            }
        }

        // ... ฟังก์ชันที่เหลือเหมือนเดิม (openPopup, saveAndSend, renderClips, etc.) ...
        // คุณสามารถ copy ส่วนที่เหลือจากโค้ดเดิมมาแปะต่อได้เลย

        // เริ่มต้น
        renderPads();

        document.getElementById('connectBtn').onclick = async () => {
            // ... โค้ดเชื่อม Bluetooth เดิม ...
        };
    </script>
</body>
</html>
