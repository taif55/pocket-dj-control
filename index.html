<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket DJ - Ultimate Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #080808; color: white; user-select: none; }
        .slider-box { background: #151515; padding: 12px; border-radius: 18px; border: 1px solid #222; margin-bottom: 8px; }
        .led-dot { transition: 0.1s; border: 1px solid #222; font-size: 9px; display: flex; align-items: center; justify-content: center; height: 32px; border-radius: 6px; background: #111; }
        .led-dot.active { background: #00e676; color: black; font-weight: bold; box-shadow: 0 0 12px #00e676; border-color: #fff; }
        input[type=range] { width: 100%; accent-color: #00e676; cursor: pointer; }
        #status { font-size: 10px; letter-spacing: 1px; font-weight: bold; }
        .layer-card { background: #111; border-left: 4px solid #00e676; border-radius: 12px; padding: 12px; margin-bottom: 8px; border-top: 1px solid #222; border-right: 1px solid #222; border-bottom: 1px solid #222; }
    </style>
</head>
<body class="p-4 pb-32">

    <div class="max-w-md mx-auto">
        <div class="flex justify-between items-center mb-4 bg-gray-900/50 p-3 rounded-2xl border border-gray-800">
            <div>
                <h1 class="text-lg font-black text-green-500 tracking-tighter">POCKET DJ PRO</h1>
                <div id="status" class="text-red-500 uppercase">● Offline</div>
            </div>
            <select id="profile" onchange="changeProfile()" class="bg-black text-[10px] border border-gray-700 p-2 rounded-lg outline-none uppercase font-bold text-gray-400">
                <option value="68">Small (68 LED)</option>
                <option value="300">Large (300 LED)</option>
            </select>
        </div>

        <button id="connectBtn" class="w-full bg-green-500 text-black font-black py-4 rounded-2xl mb-6 shadow-lg active:scale-95 transition">
            CONNECT & SYNC BOARD
        </button>

        <div id="listContainer"></div>
    </div>

    <div class="fixed bottom-8 left-0 right-0 flex justify-center space-x-4 px-8 z-40">
        <button onclick="openPopup()" class="bg-green-500 text-black w-16 h-16 rounded-full text-4xl shadow-2xl font-bold active:scale-90 transition">+</button>
        <button id="updateBtn" onclick="sendToESP()" class="bg-blue-600 flex-1 rounded-2xl font-bold uppercase tracking-widest active:bg-blue-500 shadow-xl">Update Board</button>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/95 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-[#111] w-full max-w-sm rounded-3xl p-6 overflow-y-auto max-h-[90vh] border border-gray-800 shadow-2xl">
            <h2 class="text-center font-black text-green-400 mb-4 tracking-widest uppercase">Layer Designer</h2>
            
            <div class="slider-box">
                <div class="flex justify-between text-[10px] mb-2 uppercase font-bold text-gray-500">
                    <span>Select LEDs</span>
                    <button onclick="clearSelectedLEDs()" class="text-red-500">Clear All</button>
                </div>
                <div id="ledGrid" class="grid grid-cols-8 gap-1 h-44 overflow-y-auto p-2 bg-black rounded-xl border border-gray-800"></div>
            </div>

            <div class="space-y-1">
                <div class="slider-box">
                    <div class="flex justify-between text-[10px] text-gray-400 font-bold uppercase"><span>Start Time</span><span id="v1" class="text-green-500">0</span></div>
                    <input type="range" id="s1" min="0" max="99" value="0" oninput="v1.innerText=this.value; livePre();">
                </div>
                <div class="slider-box">
                    <div class="flex justify-between text-[10px] text-gray-400 font-bold uppercase"><span>Brightness</span><span id="v2" class="text-green-500">10</span></div>
                    <input type="range" id="s2" min="0" max="99" value="10" oninput="v2.innerText=this.value; livePre();">
                </div>
                <div class="grid grid-cols-2 gap-2 py-1">
                    <input type="text" id="s4" placeholder="Group (a,b)" class="bg-black border border-gray-800 p-3 rounded-xl text-center text-sm outline-none" oninput="livePre();">
                    <select id="s5" class="bg-black border border-gray-800 p-3 rounded-xl text-sm outline-none font-bold" onchange="livePre();">
                        <option value="bl">Blue</option><option value="re">Red</option><option value="gr">Green</option><option value="ye">Yellow</option><option value="wh">White</option><option value="pu">Purple</option><option value="aq">Aqua</option>
                    </select>
                </div>
                <div class="slider-box">
                    <select id="s6" class="w-full bg-transparent outline-none text-sm font-black uppercase text-center text-green-400" onchange="livePre();">
                        <option value="u">Effect: Fade Up/Down</option><option value="f">Effect: Fade Out</option><option value="s">Effect: Strobe</option><option value="o">Effect: Static</option><option value="b">Effect: Blink</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="slider-box"><div class="text-[9px] text-gray-500 uppercase text-center">Dur (s)</div><input type="number" id="s7" value="1.0" step="0.1" class="w-full bg-transparent text-center font-bold" oninput="livePre();"></div>
                    <div class="slider-box"><div class="text-[9px] text-gray-500 uppercase text-center">Off (s)</div><input type="number" id="s8" value="0.0" step="0.1" class="w-full bg-transparent text-center font-bold" oninput="livePre();"></div>
                </div>
                <div class="slider-box">
                    <div class="flex justify-between text-[10px] text-gray-400 font-bold uppercase"><span>Loop</span><span id="v9" class="text-green-500">1</span></div>
                    <input type="range" id="s9" min="0" max="20" value="1" oninput="v9.innerText=this.value; livePre();">
                </div>
                <div class="flex items-center justify-center space-x-2 p-3 bg-gray-900 rounded-2xl active:bg-gray-800 transition" onclick="document.getElementById('sM').click()">
                    <input type="checkbox" id="sM" class="w-5 h-5 accent-green-500" onchange="livePre();">
                    <label class="text-[10px] font-black uppercase tracking-widest">Mirror Mode</label>
                </div>
            </div>

            <div class="flex space-x-3 mt-6">
                <button onclick="closePopup()" class="flex-1 py-4 bg-gray-800 rounded-2xl text-[10px] font-bold text-gray-500 uppercase tracking-widest">Cancel</button>
                <button onclick="saveLayer()" class="flex-1 py-4 bg-green-500 text-black font-black rounded-2xl text-[10px] uppercase tracking-widest">Save Layer</button>
            </div>
        </div>
    </div>

    <script>
        let device, characteristic;
        let layers = [];
        let editingIdx = null;
        let selectedLEDs = new Set();
        let currentMaxLEDs = 68;

        const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
        const CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";

        function changeProfile() {
            currentMaxLEDs = parseInt(document.getElementById('profile').value);
            genGrid();
        }

        function genGrid() {
            const grid = document.getElementById('ledGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= currentMaxLEDs; i++) {
                const dot = document.createElement('div');
                dot.innerText = i;
                dot.className = `led-dot ${selectedLEDs.has(i) ? 'active' : ''}`;
                dot.id = `led-${i}`;
                dot.onclick = () => {
                    if (selectedLEDs.has(i)) { selectedLEDs.delete(i); dot.classList.remove('active'); }
                    else { selectedLEDs.add(i); dot.classList.add('active'); }
                    livePre();
                };
                grid.appendChild(dot);
            }
        }

        function clearSelectedLEDs() {
            selectedLEDs.clear();
            document.querySelectorAll('.led-dot').forEach(d => d.classList.remove('active'));
            livePre();
        }

        document.getElementById('connectBtn').onclick = async () => {
            try {
                device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'PocketDJ-' }], optionalServices: [SERVICE_UUID] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                document.getElementById('status').innerText = "● Connected: Syncing...";
                document.getElementById('status').className = "text-green-500";
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (e) => {
                    let val = new TextDecoder().decode(e.target.value);
                    if (val.startsWith("SYNC_NOW:")) {
                        importData(val.substring(9));
                    }
                });

                await characteristic.writeValue(new TextEncoder().encode("GET_ALL"));
            } catch (e) { alert("BT Error: " + e.message); }
        };

        function buildBracket(l) {
            let m = l.isMirror ? 'm' : '';
            let s = l.startTime.toString().padStart(2, '0');
            let b = l.brightness.toString().padStart(2, '0');
            let d = (parseFloat(l.duration)*10).toString().padStart(2,'0');
            let o = (parseFloat(l.pause)*10).toString().padStart(2,'0');
            return `${m}(${s}${b},${l.target},${l.color},${l.effect}${d}${o},${l.loop})`;
        }

        async function livePre() {
            if (!characteristic) return;
            let target = selectedLEDs.size > 0 ? Array.from(selectedLEDs).map(id => `<${id}>`).join('') : (document.getElementById('s4').value.trim() || "a");
            let current = {
                startTime: document.getElementById('s1').value,
                brightness: document.getElementById('s2').value,
                target: target,
                color: document.getElementById('s5').value,
                effect: document.getElementById('s6').value,
                duration: document.getElementById('s7').value,
                pause: document.getElementById('s8').value,
                loop: document.getElementById('s9').value,
                isMirror: document.getElementById('sM').checked
            };

            let allStr = "5";
            layers.forEach((l, i) => { if (i !== editingIdx) allStr += buildBracket(l); });
            allStr += buildBracket(current);
            try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode(allStr)); } catch (e) {}
        }

        function saveLayer() {
            let target = selectedLEDs.size > 0 ? Array.from(selectedLEDs).map(id => `<${id}>`).join('') : (document.getElementById('s4').value.trim() || "a");
            const data = {
                startTime: document.getElementById('s1').value, brightness: document.getElementById('s2').value,
                target: target, color: document.getElementById('s5').value, effect: document.getElementById('s6').value,
                duration: document.getElementById('s7').value, pause: document.getElementById('s8').value,
                loop: document.getElementById('s9').value, isMirror: document.getElementById('sM').checked
            };
            if (editingIdx !== null) layers[editingIdx] = data;
            else layers.push(data);
            renderList();
            closePopup();
        }

        function renderList() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';
            layers.forEach((l, i) => {
                const div = document.createElement('div');
                div.className = "layer-card flex justify-between items-center active:scale-95 transition cursor-pointer";
                div.innerHTML = `
                    <div onclick="openPopup(${i})" class="flex-1">
                        <div class="text-[9px] text-green-500 font-black uppercase">Layer ${i+1}</div>
                        <div class="text-xs font-bold uppercase">${l.target.length > 15 ? l.target.substring(0,15)+'...' : l.target} | ${l.color} | FX: ${l.effect}</div>
                    </div>
                    <button onclick="layers.splice(${i},1); renderList();" class="text-red-500 text-xl font-black px-2">&times;</button>
                `;
                container.appendChild(div);
            });
        }

        function importData(raw) {
            layers = [];
            let startIndex = 0;
            while (true) {
                let o = raw.indexOf('(', startIndex), c = raw.indexOf(')', o);
                if (o === -1 || c === -1) break;
                let m = raw.substring(startIndex, o).includes('m');
                let content = raw.substring(o+1, c);
                let p = content.split(',');
                layers.push({
                    startTime: parseInt(p[0].substring(0,2)), brightness: parseInt(p[0].substring(2,4)),
                    target: p[1], color: p[2], effect: p[3].charAt(0),
                    duration: parseInt(p[3].substring(1,3))/10, pause: parseInt(p[3].substring(3,5))/10,
                    loop: parseInt(p[4]), isMirror: m
                });
                startIndex = c + 1;
            }
            renderList();
            document.getElementById('status').innerText = "● Connected: Ready";
        }

        async function sendToESP() {
            if (!characteristic) return alert("Connect First");
            let allStr = "5";
            layers.forEach(l => allStr += buildBracket(l));
            try { await characteristic.writeValue(new TextEncoder().encode(allStr)); alert("Board Updated!"); } catch (e) { alert(e.message); }
        }

        function openPopup(index = null) {
            editingIdx = index;
            selectedLEDs.clear();
            if (index !== null) {
                const l = layers[index];
                document.getElementById('s1').value = l.startTime;
                document.getElementById('s2').value = l.brightness;
                document.getElementById('s4').value = l.target.includes('<') ? "" : l.target;
                document.getElementById('s5').value = l.color;
                document.getElementById('s6').value = l.effect;
                document.getElementById('s7').value = l.duration;
                document.getElementById('s8').value = l.pause;
                document.getElementById('s9').value = l.loop;
                document.getElementById('sM').checked = l.isMirror;
                if (l.target.includes('<')) {
                    const ids = l.target.match(/\d+/g);
                    if(ids) ids.forEach(id => selectedLEDs.add(parseInt(id)));
                }
            }
            genGrid();
            document.getElementById('modal').classList.remove('hidden');
        }

        function closePopup() { document.getElementById('modal').classList.add('hidden'); }
        
        genGrid();
    </script>
</body>
</html>
