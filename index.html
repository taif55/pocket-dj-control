<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket DJ Studio - PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #050505; color: white; user-select: none; overflow-x: hidden; }
        .pad-btn { background: #151515; border: 1px solid #333; aspect-ratio: 1/1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; touch-action: manipulation; }
        .pad-btn.active { background: #00e676 !important; color: black; box-shadow: 0 0 15px #00e676; border-color: #fff; }
        .pad-btn.has-code { border-color: #00e676; }
        
        /* จุดไข่ปลาสำหรับลาก (ทำให้ใหญ่ขึ้นให้จิ้มง่าย) */
        .drag-handle { 
            position: absolute; top: 0; left: 0; width: 40px; height: 40px; 
            color: #444; display: flex; align-items: center; justify-content: center; 
            font-size: 20px; cursor: grab; z-index: 30; 
        }
        .drag-handle:active { color: #00e676; }

        /* สไตล์ตอนกำลังลาก */
        .sortable-ghost { opacity: 0.1; }
        .sortable-drag { opacity: 0.9; transform: scale(1.1); z-index: 9999; border: 2px solid #00e676 !important; }

        #timelineViewport { background: #0a0a0a; border-bottom: 1px solid #222; position: relative; height: 180px; overflow-x: auto; }
        #timelineContent { position: relative; height: 100%; width: 2000px; background-image: linear-gradient(to right, #1a1a1a 1px, transparent 1px); background-size: 100px 100%; }
        #playhead { position: absolute; top: 0; width: 2px; height: 100%; background: #ff3d00; z-index: 50; pointer-events: none; }
    </style>
</head>
<body class="p-4">

    <div id="consoleView" class="max-w-xl mx-auto">
        <div class="bg-gray-900/50 p-5 rounded-3xl border border-gray-800 shadow-xl mb-4">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-black text-green-500 italic uppercase">DJ Studio Pro</h1>
                <button id="connectBtn" class="bg-green-500 text-black text-[10px] font-black px-5 py-2 rounded-2xl transition active:scale-90">CONNECT</button>
            </div>
            <div class="space-y-1">
                <input type="range" id="globalSpeed" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full accent-green-500 h-8">
            </div>
        </div>
        <div id="padGrid" class="grid grid-cols-5 gap-3 pb-32"></div>
    </div>

    <script>
        let device, characteristic;
        let patterns = Array.from({length: 60}, (_, i) => ({ id: i, code: "" }));
        let lastTap = 0;

        // ฟังก์ชันวาดปุ่ม
        function renderPads() {
            const grid = document.getElementById('padGrid');
            grid.innerHTML = '';
            patterns.forEach((p, idx) => {
                const btn = document.createElement('div');
                btn.className = `pad-btn ${p.code ? 'has-code' : ''}`;
                
                // 1. จุดไข่ปลา (Handle)
                const handle = document.createElement('div');
                handle.className = 'drag-handle';
                handle.innerHTML = '⠿';
                btn.appendChild(handle);

                // 2. ตัวเลขปุ่ม
                const num = document.createElement('span');
                num.className = 'text-xs font-black pad-num';
                num.innerText = idx + 1;
                btn.appendChild(num);

                // 3. ระบบคลิก (แยกออกจาก handle)
                btn.onpointerdown = (e) => {
                    // ถ้าจิ้มโดนจุดไข่ปลา ไม่ต้องเล่นไฟ (ปล่อยให้เป็นหน้าที่ Sortable)
                    if (e.target.classList.contains('drag-handle')) return;
                    
                    const now = Date.now();
                    if (now - lastTap < 300) { 
                        if(typeof openPopup === "function") openPopup(idx); // เคาะ 2 ทีแก้ไฟ
                    } else {
                        playFX(idx, btn); // เคาะทีเดียวเล่นไฟ
                    }
                    lastTap = now;
                };

                grid.appendChild(btn);
            });

            // ตั้งค่า Sortable
            new Sortable(grid, { 
                handle: '.drag-handle', // ลากได้เฉพาะตรงจุดไข่ปลาเท่านั้น
                animation: 150,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                onEnd: (evt) => {
                    const item = patterns.splice(evt.oldIndex, 1)[0];
                    patterns.splice(evt.newIndex, 0, item);
                    grid.querySelectorAll('.pad-btn').forEach((p, i) => {
                        p.querySelector('.pad-num').innerText = i + 1;
                    });
                }
            });
        }

        // ปุ่ม Connect (แก้ไขให้ทำงานแน่นอน)
        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                device = await navigator.bluetooth.requestDevice({ 
                    filters: [{ namePrefix: 'PocketDJ-' }], 
                    optionalServices: ["0000ffe0-0000-1000-8000-00805f9b34fb"] 
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
                characteristic = await service.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");
                
                document.getElementById('connectBtn').innerText = "ONLINE";
                document.getElementById('connectBtn').classList.replace('bg-green-500', 'bg-blue-500');
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (e) => {
                    let val = new TextDecoder().decode(e.target.value);
                    if (val.startsWith("D")) {
                        let p = val.substring(1).split(":");
                        if(p.length >= 3) { patterns[parseInt(p[0])].code = p[2] || ""; renderPads(); }
                    }
                });
                await characteristic.writeValue(new TextEncoder().encode("GET_ALL"));
            } catch (e) { alert("BT Connect Error!"); }
        });

        async function playFX(idx, el) {
            if(!characteristic || !patterns[idx].code) return;
            document.querySelectorAll('.pad-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode("5" + patterns[idx].code)); } catch(e){}
        }

        renderPads();
    </script>
</body>
</html>
