<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket DJ - Real-time Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; user-select: none; }
        .slider-box { background: #1e1e1e; padding: 10px; border-radius: 12px; border: 1px solid #333; margin-bottom: 8px; }
        .slider-header { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-bottom: 2px; }
        input[type=range] { width: 100%; accent-color: #00e676; cursor: pointer; height: 25px; }
        .command-card { background: #1e1e1e; border-left: 4px solid #00e676; transition: 0.2s; cursor: pointer; }
        .command-card:active { transform: scale(0.96); opacity: 0.8; }
        #status { font-size: 12px; font-weight: bold; margin-bottom: 10px; transition: 0.3s; }
        input[type=number], input[type=text], select { background: #000; color: #00e676; border: 1px solid #444; border-radius: 8px; padding: 5px; outline: none; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto pb-24">
        <h3 class="text-xl font-bold text-center mb-1">🎛️ Pocket DJ Master</h3>
        <p class="text-[10px] text-gray-500 text-center mb-2">REAL-TIME VISUAL EDITOR</p>
        
        <div id="status" class="text-center text-red-500">● Disconnected</div>
        
        <button id="connectBtn" class="w-full bg-green-500 text-black font-bold py-3 rounded-2xl mb-6 shadow-lg active:bg-green-400">
            CONNECT & SYNC ALL
        </button>

        <div id="commandContainer" class="space-y-3">
            <p class="text-gray-600 text-center py-10 text-sm">ยังไม่มีลายไฟ กด + เพื่อเริ่ม</p>
        </div>
    </div>

    <div class="fixed bottom-6 left-0 right-0 flex justify-center space-x-4 px-6 z-40">
        <button onclick="openPopup()" class="bg-green-500 text-black w-14 h-14 rounded-full text-4xl shadow-2xl font-bold flex items-center justify-center active:scale-90 transition">+</button>
        <button onclick="sendToESP()" class="bg-blue-600 flex-1 rounded-2xl font-bold uppercase tracking-widest shadow-xl active:bg-blue-500">Update Board</button>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/95 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 w-full max-w-sm rounded-3xl p-6 overflow-y-auto max-h-[95vh] border border-gray-700 shadow-2xl">
            <h2 id="modalTitle" class="text-lg font-bold mb-4 text-green-400 text-center border-b border-gray-800 pb-2">DESIGN LAYER</h2>
            
            <div class="space-y-1">
                <div class="slider-box">
                    <div class="slider-header"><span>เริ่ม (Start Time)</span><span id="v1" class="text-green-400 font-mono">0</span></div>
                    <input type="range" id="s1" min="0" max="99" value="0" oninput="v1.innerText=this.value; sendLivePreview();">
                </div>
                <div class="slider-box">
                    <div class="slider-header"><span>สว่าง (Brightness)</span><span id="v2" class="text-green-400 font-mono">10</span></div>
                    <input type="range" id="s2" min="0" max="99" value="10" oninput="v2.innerText=this.value; sendLivePreview();">
                </div>
                <div class="slider-box">
                    <div class="slider-header"><span>เลือกหลอด (LED ID)</span><span id="v3" class="text-green-400 font-mono">1</span></div>
                    <input type="range" id="s3" min="1" max="68" value="1" oninput="v3.innerText=this.value; sendLivePreview();">
                </div>
                
                <div class="grid grid-cols-2 gap-2 py-2">
                    <div class="flex flex-col">
                        <label class="text-[10px] text-gray-500 mb-1 uppercase text-center">Group (a,b,c)</label>
                        <input type="text" id="s4" placeholder="a" class="text-center font-bold" oninput="sendLivePreview();">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-[10px] text-gray-500 mb-1 uppercase text-center">Color</label>
                        <select id="s5" class="font-bold" onchange="sendLivePreview();">
                            <option value="bl">Blue</option><option value="re">Red</option><option value="gr">Green</option>
                            <option value="ye">Yellow</option><option value="wh">White</option><option value="or">Orange</option>
                            <option value="pu">Purple</option><option value="aq">Aqua</option>
                        </select>
                    </div>
                </div>

                <div class="slider-box">
                    <div class="slider-header"><span>Effect</span><span id="v6" class="text-green-400">u</span></div>
                    <select id="s6" class="w-full bg-transparent font-bold" onchange="v6.innerText=this.value; sendLivePreview();">
                        <option value="u">Fade Up/Down (u)</option><option value="f">Fade Out (f)</option>
                        <option value="s">Strobe (s)</option><option value="o">Static (o)</option>
                        <option value="b">Blink (b)</option><option value="r">Random (r)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div class="slider-box">
                        <div class="slider-header"><span>เล่น (s)</span></div>
                        <input type="number" id="s7" value="1.0" step="0.1" class="w-full text-center font-bold" oninput="sendLivePreview();">
                    </div>
                    <div class="slider-box">
                        <div class="slider-header"><span>พัก (s)</span></div>
                        <input type="number" id="s8" value="0.0" step="0.1" class="w-full text-center font-bold" oninput="sendLivePreview();">
                    </div>
                </div>

                <div class="slider-box">
                    <div class="slider-header"><span>วนลูป (Loop)</span><span id="v9" class="text-green-400 font-mono">1</span></div>
                    <input type="range" id="s9" min="0" max="20" value="1" oninput="v9.innerText=this.value; sendLivePreview();">
                </div>
                
                <div class="flex items-center justify-center space-x-2 p-2 bg-gray-800 rounded-xl">
                    <input type="checkbox" id="sMirror" class="w-6 h-6 accent-green-500" onchange="sendLivePreview();">
                    <label class="text-sm font-bold uppercase text-gray-300">Mirror Mode (m)</label>
                </div>
            </div>

            <div class="flex space-x-3 mt-5">
                <button onclick="closePopup()" class="flex-1 py-3 bg-gray-800 rounded-2xl text-xs font-bold text-gray-400 uppercase tracking-widest">Cancel</button>
                <button onclick="saveCommand()" class="flex-1 py-3 bg-green-500 text-black font-black rounded-2xl text-xs uppercase tracking-widest shadow-lg">SAVE</button>
            </div>
        </div>
    </div>

    <script>
        let device, characteristic;
        let commandList = [];
        let editingIndex = null;

        const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
        const CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";

        // --- ระบบเชื่อมต่อ (ใช้แบบเดิมที่เสถียร) ---
        document.getElementById('connectBtn').onclick = async () => {
            try {
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'PocketDJ-' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                const statusEl = document.getElementById('status');
                statusEl.innerText = "● Connected: Live Mode Active";
                statusEl.style.color = "#00e676";
                document.getElementById('connectBtn').innerText = "CONNECTED ✅";
                document.getElementById('connectBtn').className = "w-full bg-gray-800 text-green-500 font-bold py-3 rounded-2xl mb-6 border border-green-900";
            } catch (e) { 
                console.error(e); 
                alert("Connect Error: " + e.message);
            }
        };

        // --- ระบบ Real-time Preview ---
        async function sendLivePreview() {
            if (!characteristic) return;

            // 1. อ่านค่าจาก UI ปัจจุบัน
            let s = document.getElementById('s1').value.padStart(2, '0');
            let b = document.getElementById('s2').value.padStart(2, '0');
            let id = document.getElementById('s3').value;
            let grp = document.getElementById('s4').value.trim();
            let col = document.getElementById('s5').value;
            let fx = document.getElementById('s6').value;
            let dur = (parseFloat(document.getElementById('s7').value || 1) * 10).toString().padStart(2, '0');
            let off = (parseFloat(document.getElementById('s8').value || 0) * 10).toString().padStart(2, '0');
            let loop = document.getElementById('s9').value;
            let m = document.getElementById('sMirror').checked ? 'm' : '';

            // แก้ปัญหา Group vs LED ID: ถ้าช่อง Group ว่าง ให้ใช้เลขหลอดครอบ < >
            let target = (grp !== "") ? grp : `<${id}>`;
            let currentBracket = `${m}(${s}${b},${target},${col},${fx}${dur}${off},${loop})`;

            // 2. รวบรวมคำสั่งเก่าใน List (Layer อื่นๆ)
            let allBrackets = "";
            commandList.forEach((c, index) => {
                if (index !== editingIndex) {
                    let oldM = c.isMirror ? 'm' : '';
                    let oldS = c.startTime.toString().padStart(2, '0');
                    let oldB = c.brightness.toString().padStart(2, '0');
                    let oldTarget = (c.group && isNaN(c.group)) ? c.group : `<${c.ledId}>`;
                    let oldDur = (parseFloat(c.duration) * 10).toString().padStart(2, '0');
                    let oldOff = (parseFloat(c.pause) * 10).toString().padStart(2, '0');
                    allBrackets += `${oldM}(${oldS}${oldB},${oldTarget},${c.color},${c.effect}${oldDur}${oldOff},${c.repeat})`;
                }
            });

            // 3. รวมร่างส่งไป Preview
            let finalStr = "5" + allBrackets + currentBracket;
            
            try {
                // ใช้ WithoutResponse เพื่อความเร็วในการลากสไลด์
                await characteristic.writeValueWithoutResponse(new TextEncoder().encode(finalStr));
            } catch (e) { /* ป้องกัน Error บล็อก UI */ }
        }

        // --- ระบบจัดการ List ---
        function openPopup(index = null) {
            editingIndex = index;
            if (index !== null) {
                const c = commandList[index];
                document.getElementById('modalTitle').innerText = "EDIT LAYER " + (index + 1);
                document.getElementById('s1').value = c.startTime; v1.innerText = c.startTime;
                document.getElementById('s2').value = c.brightness; v2.innerText = c.brightness;
                document.getElementById('s3').value = c.ledId; v3.innerText = c.ledId;
                document.getElementById('s4').value = (c.group.startsWith('<')) ? "" : c.group;
                document.getElementById('s5').value = c.color;
                document.getElementById('s6').value = c.effect;
                document.getElementById('s7').value = c.duration;
                document.getElementById('s8').value = c.pause;
                document.getElementById('s9').value = c.repeat;
                document.getElementById('sMirror').checked = c.isMirror;
            } else {
                document.getElementById('modalTitle').innerText = "ADD NEW LAYER";
            }
            document.getElementById('modal').classList.remove('hidden');
            sendLivePreview(); // Preview ทันทีที่เปิด
        }

        function closePopup() { document.getElementById('modal').classList.add('hidden'); }

        function saveCommand() {
            const cmd = {
                startTime: document.getElementById('s1').value,
                brightness: document.getElementById('s2').value,
                ledId: document.getElementById('s3').value,
                group: document.getElementById('s4').value.trim(),
                color: document.getElementById('s5').value,
                effect: document.getElementById('s6').value,
                duration: document.getElementById('s7').value,
                pause: document.getElementById('s8').value,
                repeat: document.getElementById('s9').value,
                isMirror: document.getElementById('sMirror').checked
            };
            if (editingIndex !== null) commandList[editingIndex] = cmd;
            else commandList.push(cmd);
            renderList();
            closePopup();
        }

        function renderList() {
            const container = document.getElementById('commandContainer');
            container.innerHTML = '';
            if (commandList.length === 0) {
                container.innerHTML = `<p class="text-gray-600 text-center py-10 text-sm">ยังไม่มีลายไฟ กด + เพื่อเริ่ม</p>`;
                return;
            }
            commandList.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = "command-card p-4 rounded-2xl flex justify-between items-center";
                let displayTarget = (c.group !== "") ? c.group : `LED ${c.ledId}`;
                div.innerHTML = `
                    <div onclick="openPopup(${i})" class="flex-1">
                        <div class="text-[10px] text-green-400 font-black uppercase">LAYER ${i+1} ${c.isMirror ? '• MIRROR' : ''}</div>
                        <div class="text-sm font-bold uppercase tracking-tighter">T:${c.startTime/10}s | ${displayTarget} | ${c.color} | FX:${c.effect}</div>
                    </div>
                    <button onclick="commandList.splice(${i},1); renderList(); event.stopPropagation();" class="text-red-900 text-xl px-2 font-bold">&times;</button>
                `;
                container.appendChild(div);
            });
        }

        async function sendToESP() {
            if (!characteristic) return alert("Please Connect Bluetooth");
            renderList(); // รีเฟรชหน้าจอ
            
            let finalStr = "5"; 
            commandList.forEach(c => {
                let m = c.isMirror ? 'm' : '';
                let s = c.startTime.toString().padStart(2, '0');
                let b = c.brightness.toString().padStart(2, '0');
                let target = (c.group !== "") ? c.group : `<${c.ledId}>`;
                let dur = (parseFloat(c.duration) * 10).toString().padStart(2, '0');
                let off = (parseFloat(c.pause) * 10).toString().padStart(2, '0');
                finalStr += `${m}(${s}${b},${target},${col},${fx}${dur}${off},${c.repeat})`;
            });

            try {
                await characteristic.writeValue(new TextEncoder().encode(finalStr));
                alert("Board Updated!");
            } catch (e) { alert("Error: " + e.message); }
        }
    </script>
</body>
</html>
