<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket DJ Studio - The Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; background: #050505; color: white; 
            user-select: none; overflow: hidden; height: 100vh;
            display: flex; flex-direction: column; touch-action: none; 
        }

        .pad-container { margin: 0 auto; width: 95%; height: 60vh; background: #0a0a0a; border: 2px solid #222; border-radius: 20px; position: relative; overflow: hidden; display: flex; }
        #padGrid { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 15px; overflow-y: scroll; scrollbar-width: none; touch-action: none; }
        #padGrid::-webkit-scrollbar { display: none; } 
        .side-scroll-track { width: 30px; background: #111; border-left: 1px solid #222; display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
        .side-scroll-track::after { content: '↕'; color: #444; font-size: 20px; }

        .pad-btn { background: #151515; border: 1px solid #333; aspect-ratio: 1/1; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: transform 0.05s, box-shadow 0.1s; }
        .pad-btn:active { transform: scale(0.92); box-shadow: inset 0 0 15px rgba(255,255,255,0.2); }
        .pad-btn.playing { box-shadow: 0 0 20px #00e676; border-color: #fff; background: #00e676 !important; color: black; }

        .poten-slot { border: 2px dashed #ff9100 !important; background: rgba(255, 145, 0, 0.05); }
        .poten-slot::before { content: 'POTEN'; position: absolute; top: 4px; font-size: 7px; font-weight: 900; color: #ff9100; letter-spacing: 0.5px; opacity: 0.9; }
        .poten-slot.has-code { border: 2px solid #ff9100 !important; box-shadow: inset 0 0 15px rgba(255, 145, 0, 0.3), 0 0 10px rgba(255, 145, 0, 0.5) !important; }
        .pad-btn:not(.poten-slot).has-code { border: 2px solid #00e676 !important; box-shadow: inset 0 0 10px rgba(0,230,118,0.2) !important; background-color: #151515 !important; }

        .sortable-drag { opacity: 1 !important; transform: scale(1.1) !important; z-index: 9999 !important; box-shadow: 0 10px 30px #000 !important; border: 2px solid #00e676 !important; pointer-events: none; }
        .sortable-ghost { opacity: 0.1; background: #00e676 !important; }

        /* เปิด touch-action: pan-x ให้ปัดจอได้ */
        #timelineViewport { background: #0a0a0a; border-bottom: 1px solid #222; position: relative; height: 160px; overflow-x: auto; overflow-y: hidden; scroll-behavior: auto; touch-action: pan-x; }
        #timelineContent { position: relative; height: 100%; width: 2000px; background-size: 100px 100%; background-image: linear-gradient(to right, rgba(255,255,255,0.25) 1px, transparent 1px); }
        
        #playhead { position: absolute; top: 0; width: 2px; height: 100%; background: #ff3d00; z-index: 50; pointer-events: none; box-shadow: 0 0 8px #ff3d00; }
        #loopLine { position: absolute; top: 0; width: 2px; height: 100%; background: #00e676; z-index: 45; pointer-events: none; box-shadow: 0 0 10px #00e676; opacity: 0.8; }
        
        .light-clip { position: absolute; height: 16px; color: black; border-radius: 4px; font-size: 8px; font-weight: 900; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; border: 1px solid rgba(255,255,255,0.4); cursor: grab; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .light-clip:active { cursor: grabbing; }
        .light-clip.selected { border: 2px solid white; box-shadow: 0 0 10px #00e676; z-index: 40; }
        
        .color-scroll::-webkit-scrollbar { height: 4px; }
        .color-scroll::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        #ledGrid { touch-action: pan-y; padding-right: 5px; overflow-y: auto; }
        #ledGrid::-webkit-scrollbar { display: block; width: 14px; }
        #ledGrid::-webkit-scrollbar-track { background: #0a0a0a; border-radius: 8px; }
        #ledGrid::-webkit-scrollbar-thumb { background: #333; border-radius: 8px; border: 3px solid #0a0a0a; }

        .led-mark { border: 1px solid #444 !important; background: #151515; }
        .led-active { background: #00e676 !important; color: #000 !important; border-color: #fff !important; box-shadow: 0 0 8px #00e676; }
        
        .modal-overlay { background: rgba(0,0,0,0.85); backdrop-filter: blur(3px); }
    </style>
</head>
<body class="p-4">

    <div id="consoleView" class="max-w-xl mx-auto w-full">
        <div class="flex justify-between items-center mb-2 bg-gray-900/50 p-4 rounded-3xl border border-gray-800 shadow-xl">
            <h1 class="text-lg font-black text-green-500 italic uppercase">DJ Master Sync</h1>
            <button id="connectBtn" class="bg-blue-600 text-white text-[10px] font-black px-4 py-2 rounded-xl active:scale-95 transition">CONNECT</button>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-2 mb-4 flex items-center space-x-3 shadow-lg">
            <input type="range" id="masterSpeedSlider" min="0" max="8" step="0.1" value="1.0" class="flex-1 accent-orange-500 h-2 bg-gray-700 rounded-lg appearance-none" oninput="updateMasterSpeed(this.value)">
            <div id="masterSpeedText" class="text-orange-500 font-black text-xs w-8 text-right">1.0x</div>
            <button onclick="resetMasterSpeed()" class="bg-gray-700 text-white rounded-full w-6 h-6 flex items-center justify-center text-[10px] font-bold active:bg-gray-500 transition">1x</button>
        </div>
    </div>

    <div class="pad-container max-w-xl shadow-2xl">
        <div id="padGrid"></div>
        <div class="side-scroll-track" id="sideScroll"></div>
    </div>

    <div id="modal" class="fixed inset-0 hidden z-40 flex flex-col bg-[#050505] pb-[40px]">
        
        <div class="flex justify-between items-center p-2 bg-gray-900 border-b border-gray-800 flex-none">
            <button onclick="handleBack()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold text-[10px] uppercase px-3 py-2 rounded-lg transition shadow-md">🔙 BACK</button>
            <div class="flex space-x-1">
                <button id="playBtn" onclick="togglePlay()" class="bg-red-600 text-white px-3 py-2 rounded-lg text-[10px] font-black shadow-lg w-16">STOP</button>
                <button onclick="addClipAtPlayhead()" class="bg-green-600 text-black px-3 py-2 rounded-lg text-[10px] font-black">+ CLIP</button>
                <button onclick="deleteSelectedClip()" class="bg-red-900 text-white px-3 py-2 rounded-lg text-[10px] font-black">DEL</button>
            </div>
            <button onclick="saveAndSend()" class="bg-white text-black font-black px-3 py-2 rounded-lg text-[10px] uppercase active:bg-gray-300">SAVE</button>
        </div>
        
        <div id="timelineViewport" class="flex-none">
            <div id="timelineContent">
                <div id="playhead"></div>
                <div id="loopLine"></div>
                <div id="trackArea" class="relative h-full py-2"></div>
            </div>
        </div>
        <div class="flex justify-between bg-black text-[9px] text-gray-500 font-mono px-2 py-1 border-b border-gray-800 flex-none">
            <span id="timeText">PLAYHEAD: 0.0s</span>
            <span>* กดก้อนแช่ไว้ 0.6 วิเพื่อ COPY</span>
        </div>

        <div class="bg-gray-900 border-b border-gray-800 p-2 grid grid-cols-2 gap-4 flex-none">
            <div class="flex items-center space-x-2">
                <button onclick="fitToScreen()" class="bg-gray-700 text-white px-2 py-1 rounded text-[9px] font-bold">FIT</button>
                <input type="range" id="zoomSlider" min="20" max="300" value="100" class="flex-1 accent-blue-500" oninput="updateZoom(this.value)">
                <button id="followBtn" onclick="toggleFollow()" class="bg-gray-700 text-white px-2 py-1 rounded text-[9px] font-bold">FOLLOW</button>
            </div>
            <div class="flex items-center space-x-2 text-[9px] font-bold text-gray-400">
                <span>TIME SCL</span>
                <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" class="flex-1 accent-orange-500" onchange="applySpeedScale(this.value)">
            </div>
        </div>
        
        <div id="editorPanel" class="flex-1 flex flex-col p-2 space-y-2 opacity-30 pointer-events-none overflow-hidden">
            
            <div class="bg-gray-900/40 p-2 rounded-xl border border-gray-800 flex justify-between items-center flex-none">
                <button onclick="addColorSlot()" class="bg-blue-600 text-white font-bold text-[9px] px-2 py-1 rounded shadow mr-2 flex-shrink-0">+ ADD</button>
                <div id="colorSlots" class="flex items-center space-x-1 flex-1 overflow-x-auto color-scroll pb-1"></div>
                <button onclick="resetColorBuilder()" class="text-red-500 font-bold text-[9px] px-2 flex-shrink-0">RST</button>
            </div>
            <div id="colorPalette" class="color-scroll flex flex-nowrap overflow-x-auto gap-2 pb-1 px-1 flex-none"></div>

            <div class="grid grid-cols-3 gap-2 flex-none">
                <div class="bg-gray-900/40 p-1 rounded-xl border border-gray-800 flex items-center justify-between px-2">
                    <span class="text-[8px] text-gray-500 font-bold uppercase">Bright</span>
                    <input type="number" id="cBright" value="10" class="bg-transparent text-right font-black text-sm w-10 outline-none" oninput="updateSelectedClip()">
                </div>
                <div class="bg-gray-900/40 p-1 rounded-xl border border-gray-800 flex items-center justify-between px-2 cursor-pointer" onclick="toggleMirror()">
                    <span class="text-[8px] text-gray-500 font-bold uppercase">Mirror</span>
                    <div id="cMirrorBtn" class="w-4 h-4 rounded-full border-2 border-gray-600 transition-colors"></div>
                </div>
                <div class="bg-gray-900/40 p-1 rounded-xl border border-gray-800 flex items-center justify-between px-2">
                    <span class="text-[8px] text-gray-500 font-bold uppercase">FX</span>
                    <select id="cFX" class="bg-transparent text-[9px] font-black text-green-400 uppercase outline-none text-right flex-1 ml-1" onchange="updateSelectedClip()">
                        <option value="o">STATIC</option><option value="u">FADE UP</option><option value="f">FADE OUT</option><option value="s">STROBE</option><option value="b">BLINK</option>
                        <option value="w">WAVE</option><option value="r">RANDOM</option><option value="p">PULSE</option><option value="d">DROP</option><option value="z">ZIGZAG</option><option value="h">H-STROBE</option>
                    </select>
                </div>
            </div>

            <div class="flex-1 bg-gray-900/40 p-2 rounded-xl border border-gray-800 flex flex-col min-h-0">
                <div id="ledGrid" class="flex-1 grid grid-cols-10 gap-1 bg-black p-1 rounded-lg border border-gray-900 content-start"></div>
            </div>
        </div>

        <div class="fixed bottom-0 w-full bg-gray-950 border-t border-gray-800 p-2 flex justify-between items-center z-50 cursor-pointer" onclick="openCodeModal()">
            <div id="liveCode" class="text-[10px] font-mono text-green-400 overflow-hidden whitespace-nowrap text-ellipsis flex-1 px-2 font-bold tracking-widest pointer-events-none">No code yet...</div>
            <button onclick="event.stopPropagation(); copyCode()" class="bg-gray-700 text-white text-[9px] font-bold px-3 py-1 rounded shadow">COPY</button>
        </div>
    </div>

    <div id="codeModal" class="fixed inset-0 hidden z-[70] bg-[#050505] p-4 flex flex-col">
        <div class="flex justify-between items-center mb-3">
            <span class="text-green-500 font-bold text-sm">💻 LIVE CODE EDITOR</span>
            <button onclick="closeCodeModal()" class="text-gray-400 font-bold text-xs px-2 py-1">CLOSE</button>
        </div>
        <textarea id="codeTextarea" class="flex-1 w-full bg-gray-900 text-green-400 font-mono p-4 rounded-xl border border-gray-700 outline-none focus:border-green-500 text-sm tracking-wider"></textarea>
        <div class="flex space-x-2 mt-4 flex-none">
            <button onclick="pasteCode()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">PASTE</button>
            <button onclick="copyFromModal()" class="flex-1 bg-gray-700 text-white py-3 rounded-xl font-bold">COPY</button>
            <button onclick="applyCodeModal()" class="flex-1 bg-green-600 text-black py-3 rounded-xl font-bold shadow-[0_0_15px_#00e676]">APPLY TO PADS</button>
        </div>
    </div>

    <div id="unsavedModal" class="fixed inset-0 hidden z-[60] modal-overlay flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 text-center space-y-4 w-full max-w-sm shadow-2xl">
            <h3 class="text-white font-bold text-lg">มีข้อมูลยังไม่ได้บันทึก!</h3>
            <p class="text-gray-400 text-xs">คุณต้องการเซฟลายไฟนี้ก่อนกลับไปหน้าแรกหรือไม่?</p>
            <div class="flex space-x-3 justify-center pt-3">
                <button onclick="discardAndClose()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-xl text-xs font-bold flex-1 transition">ทิ้งข้อมูล</button>
                <button onclick="saveAndSend()" class="bg-green-500 hover:bg-green-400 text-black px-4 py-2 rounded-xl text-xs font-bold flex-1 shadow-[0_0_10px_#00e676] transition">เซฟก่อน</button>
            </div>
        </div>
    </div>

    <script>
        let device, characteristic;
        let patterns = Array.from({length: 60}, (_, i) => ({ id: i, code: "" }));
        
        let clips = []; 
        let selectedClipId = null;
        let selectedIdx = -1;
        let playheadTime = 0;
        let isPlaying = false;
        let playInterval, startAnimateTime;
        let currentLoopLimit = 1.0;
        let pxPerSec = 100;
        let isFollowingPlayhead = false;
        let hasUnsavedChanges = false; 
        let activePadIndex = -1; 
        let activeColorIndex = -1; 
        
        // เพิ่มตัวแปรกันบลูทูธค้าง
        let isWritingBLE = false;

        const colorMap = { 'bl': '#0000FF', 're': '#FF0000', 'gr': '#00FF00', 'ye': '#FFFF00', 'wh': '#FFFFFF', 'pu': '#8000FF', 'aq': '#00FFFF', 'or': '#FF8000', 'pi': '#FF00FF', 'cy': '#00FFFF' };
        const fxNames = { o: 'STATIC', u: 'FADE UP', f: 'FADE OUT', s: 'STROBE', b: 'BLINK', w: 'WAVE', r: 'RANDOM', p: 'PULSE', d: 'DROP', z: 'ZIGZAG', h: 'H-STROBE' };

        const grid = document.getElementById('padGrid');
        let sortableInstance = null; 
        let isDraggingPad = false; 

        window.addEventListener('hashchange', function() {
            const hash = window.location.hash;
            if (hash === '#edit') { document.getElementById('codeModal').classList.add('hidden'); } 
            else if (hash === '') {
                if (!document.getElementById('modal').classList.contains('hidden')) {
                    if (hasUnsavedChanges) {
                        window.location.hash = 'edit';
                        document.getElementById('unsavedModal').classList.remove('hidden');
                    } else {
                        closePopupDirectly();
                    }
                }
            }
        });

        function closePopupDirectly() {
            document.getElementById('unsavedModal').classList.add('hidden');
            stopPlayback(); document.getElementById('modal').classList.add('hidden'); 
            if(selectedIdx !== -1) {
                let btn = grid.children[selectedIdx];
                playFX(selectedIdx, btn);
                selectedIdx = -1; updatePadsVisuals();
            }
        }

        async function updateMasterSpeed(val) {
            document.getElementById('masterSpeedText').innerText = parseFloat(val).toFixed(1) + 'x';
            if(!characteristic) return;
            try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode("T" + parseFloat(val).toFixed(1))); } catch(e) {}
        }
        function resetMasterSpeed() { document.getElementById('masterSpeedSlider').value = 1.0; updateMasterSpeed(1.0); }

        document.getElementById('connectBtn').onclick = async () => {
            const btn = document.getElementById('connectBtn');
            if(device && device.gatt.connected) { device.gatt.disconnect(); return; }
            try {
                device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'PocketDJ-' }], optionalServices: ["0000ffe0-0000-1000-8000-00805f9b34fb"] });
                device.addEventListener('gattserverdisconnected', onDisconnected);
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService("0000ffe0-0000-1000-8000-00805f9b34fb");
                characteristic = await service.getCharacteristic("0000ffe1-0000-1000-8000-00805f9b34fb");
                btn.innerText = "ONLINE"; btn.className = "bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl shadow-[0_0_15px_#00e676] transition";
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (e) => {
                    let val = new TextDecoder().decode(e.target.value);
                    if (val.startsWith("D")) {
                        let p = val.substring(1).split(":");
                        if(p.length >= 3) { patterns[parseInt(p[0])].code = p[2] || ""; updatePadsVisuals(); }
                    }
                });
                await characteristic.writeValue(new TextEncoder().encode("GET_ALL"));
            } catch (e) { alert("BT Error: " + e.message); }
        };
        function onDisconnected() { characteristic = null; const btn = document.getElementById('connectBtn'); btn.innerText = "CONNECT"; btn.className = "bg-blue-600 text-white text-[10px] font-black px-4 py-2 rounded-xl active:scale-95 transition"; }

        async function autoSyncTop10() {
            if(!characteristic) return; 
            const btn = document.getElementById('connectBtn');
            btn.innerText = "SYNCING..."; btn.className = "bg-yellow-500 text-black text-[10px] font-black px-4 py-2 rounded-xl transition";
            try {
                for(let i=0; i<10; i++) {
                    let codeToSend = patterns[i].code ? patterns[i].code : ""; 
                    await characteristic.writeValue(new TextEncoder().encode(`S${i}:${codeToSend}`));
                    await new Promise(r => setTimeout(r, 60)); 
                }
                btn.innerText = "ONLINE"; btn.className = "bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl shadow-[0_0_15px_#00e676]";
            } catch(e) { btn.innerText = "ONLINE"; btn.className = "bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl shadow-[0_0_15px_#00e676]"; }
        }

        function renderPads() {
            grid.innerHTML = '';
            patterns.forEach((p, index) => {
                const btn = document.createElement('div');
                const isPotenZone = index < 10;
                btn.className = `pad-btn ${isPotenZone ? 'poten-slot' : ''} ${p.code ? 'has-code' : ''}`;
                
                if (index === activePadIndex) btn.classList.add('playing');
                if(!p.code) { const hue = (p.id * 6) % 360; btn.style.backgroundColor = `hsl(${hue}, 30%, 15%)`; }
                btn.innerHTML = `<span class="text-lg font-black pad-num">${p.id + 1}</span>`;
                
                let clickTimer = null;
                btn.addEventListener('pointerdown', (e) => {
                    if (isDraggingPad) return; 
                    const currentVisualIndex = patterns.indexOf(p);
                    if (clickTimer) {
                        clearTimeout(clickTimer); clickTimer = null;
                        openPopup(currentVisualIndex); 
                    } else {
                        playFX(currentVisualIndex, btn); 
                        clickTimer = setTimeout(() => { clickTimer = null; }, 300);
                    }
                });
                grid.appendChild(btn);
            });

            if (sortableInstance) sortableInstance.destroy();
            sortableInstance = new Sortable(grid, {
                animation: 150, delay: 250, delayOnTouchOnly: false, touchStartThreshold: 5,
                forceFallback: true, fallbackClass: "sortable-drag", fallbackOnBody: true, swapThreshold: 0.65,
                onStart: () => { isDraggingPad = true; if (window.navigator.vibrate) window.navigator.vibrate(30); },
                onEnd: (evt) => {
                    const item = patterns.splice(evt.oldIndex, 1)[0];
                    patterns.splice(evt.newIndex, 0, item);
                    Array.from(grid.children).forEach((btn, i) => {
                        if (i < 10) btn.classList.add('poten-slot'); else btn.classList.remove('poten-slot');
                    });
                    if(activePadIndex === evt.oldIndex) activePadIndex = evt.newIndex;
                    else if(activePadIndex === evt.newIndex) activePadIndex = evt.oldIndex;
                    autoSyncTop10();
                    setTimeout(() => { isDraggingPad = false; }, 50);
                }
            });
        }

        function updatePadsVisuals() {
            const btns = grid.children;
            patterns.forEach((p, index) => {
                const btn = btns[index];
                if (!btn) return;
                if(p.code) { btn.classList.add('has-code'); btn.style.backgroundColor = ""; } 
                else { btn.classList.remove('has-code'); const hue = (p.id * 6) % 360; btn.style.backgroundColor = `hsl(${hue}, 30%, 15%)`; }
                
                if (index === activePadIndex) btn.classList.add('playing');
                else btn.classList.remove('playing');
            });
        }

        async function playFX(idx, btnElement) {
            activePadIndex = idx;
            document.querySelectorAll('.pad-btn').forEach(b => b.classList.remove('playing'));
            if(btnElement) btnElement.classList.add('playing'); 
            
            if(!characteristic || !patterns[idx].code) return;
            try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode("5" + patterns[idx].code)); } catch(e){}
        }

        const sideScroll = document.getElementById('sideScroll');
        let isScrolling = false, startY, startScrollTop;
        sideScroll.addEventListener('touchstart', (e) => { isScrolling = true; startY = e.touches[0].pageY; startScrollTop = grid.scrollTop; }, {passive: true});
        sideScroll.addEventListener('touchmove', (e) => { if (!isScrolling) return; grid.scrollTop = startScrollTop - ((e.touches[0].pageY - startY) * 2); }, {passive: true});
        sideScroll.addEventListener('touchend', () => isScrolling = false);

        function markUnsaved() { hasUnsavedChanges = true; }

        function openPopup(idx) {
            window.location.hash = 'edit'; 
            selectedIdx = idx; clips = []; hasUnsavedChanges = false; activeColorIndex = -1;
            
            // 🔥 ปรับ Margin เพื่อให้เวลา 0.0s เข้ามาอยู่ตรงกลางหน้าจอได้พอดีเป๊ะ 🔥
            document.getElementById('modal').classList.remove('hidden');
            const vp = document.getElementById('timelineViewport');
            const padding = vp.clientWidth / 2;
            const content = document.getElementById('timelineContent');
            content.style.marginLeft = padding + 'px';
            content.style.borderRight = padding + 'px solid transparent';

            let rawCode = patterns[idx].code || "";
            let brackets = rawCode.match(/m?\(([^)]+)\)/g);
            if (brackets) {
                brackets.forEach((bracket, i) => {
                    let m = bracket.startsWith('m');
                    let content = bracket.replace('m','').replace('(','').replace(')','').split(',');
                    if(content.length >= 4) {
                        clips.push({ 
                            id: Date.now() + i, start: parseInt(content[0].substring(0,2))/10, bright: parseInt(content[0].substring(2,4)), 
                            target: content[1], color: content[2], fx: content[3].charAt(0), duration: parseInt(content[3].substring(1,3))/10, 
                            loop: 1, mirror: m, track: i % 6 
                        });
                    }
                });
            }
            initColors(); renderClips();
            if(clips.length > 0) selectClip(clips[0].id);
            if (!isPlaying) togglePlay(); 
        }

        function handleBack() {
            if (hasUnsavedChanges) document.getElementById('unsavedModal').classList.remove('hidden');
            else history.back();
        }

        function discardAndClose() {
            hasUnsavedChanges = false;
            if(window.location.hash === '#edit') history.back();
            else closePopupDirectly();
        }

        function fitToScreen() {
            const vpWidth = document.getElementById('timelineViewport').clientWidth;
            if(currentLoopLimit > 0) {
                let newPx = (vpWidth - 20) / currentLoopLimit; 
                newPx = Math.max(20, Math.min(300, newPx));
                document.getElementById('zoomSlider').value = newPx; updateZoom(newPx);
            }
        }
        function toggleFollow() {
            isFollowingPlayhead = !isFollowingPlayhead;
            const btn = document.getElementById('followBtn');
            if(isFollowingPlayhead) btn.className = "bg-blue-500 text-white px-2 py-1 rounded text-[9px] font-bold shadow";
            else btn.className = "bg-gray-700 text-white px-2 py-1 rounded text-[9px] font-bold";
        }
        function updateZoom(val) { pxPerSec = parseInt(val); document.getElementById('timelineContent').style.backgroundSize = `${pxPerSec}px 100%`; renderClips(); }

        function applySpeedScale(val) {
            let scaleRatio = parseFloat(val);
            clips.forEach(c => { c.start = c.start * scaleRatio; c.duration = c.duration * scaleRatio; });
            document.getElementById('speedSlider').value = 1.0;
            markUnsaved(); renderClips(); updateCodeMonitor();
        }

        function renderClips() {
            const area = document.getElementById('trackArea'); area.innerHTML = '';
            clips.forEach(c => {
                const div = document.createElement('div');
                div.id = `clip-${c.id}`; div.className = `light-clip ${selectedClipId === c.id ? 'selected' : ''}`;
                div.style.left = (c.start * pxPerSec) + 'px'; div.style.width = (c.duration * pxPerSec) + 'px'; 
                div.style.top = (c.track * 20) + 'px';
                div.innerText = fxNames[c.fx] || c.fx.toUpperCase();
                
                if (!c.target || c.target === '') { div.style.backgroundColor = '#555555'; div.style.color = '#aaaaaa'; } 
                else if(c.color.includes('2')) {
                    const parts = c.color.split('2');
                    div.style.background = `linear-gradient(to right, ${colorMap[parts[0]] || '#333'}, ${colorMap[parts[1]] || '#333'})`;
                } else { div.style.backgroundColor = colorMap[c.color] || '#555'; }
                
                area.appendChild(div);
                
                interact(div).draggable({
                    listeners: {
                        start(e) { c.tempY = c.track * 20; },
                        move(e) {
                            c.start += e.dx / pxPerSec; c.start = Math.max(0, c.start);
                            c.tempY += e.dy; c.track = Math.max(0, Math.min(5, Math.round(c.tempY / 20))); 
                            e.target.style.left = (c.start * pxPerSec) + 'px'; e.target.style.top = (c.track * 20) + 'px';
                            if(!isPlaying) scrubLiveFrame();
                        },
                        end(e) { c.tempY = undefined; markUnsaved(); updateLoopLine(); renderClips(); sendFullCodeToBT(); updateCodeMonitor(); }
                    }
                }).resizable({ 
                    edges: { right: true, left: true }, 
                    listeners: { 
                        move(e) { 
                            if(e.edges.left) { c.start += e.dx / pxPerSec; c.start = Math.max(0, c.start); }
                            c.duration = e.rect.width / pxPerSec; c.duration = Math.max(0.1, c.duration); 
                            e.target.style.left = (c.start * pxPerSec) + 'px'; e.target.style.width = (c.duration * pxPerSec) + 'px'; 
                            if(!isPlaying) scrubLiveFrame(); 
                        },
                        end(e) { markUnsaved(); updateLoopLine(); renderClips(); sendFullCodeToBT(); updateCodeMonitor(); }
                    } 
                }).on('tap', function(event) { selectClip(c.id); })
                  .on('hold', function(event) {
                    selectClip(c.id);
                    let newClip = JSON.parse(JSON.stringify(c));
                    newClip.id = Date.now(); newClip.start += 0.5; newClip.track = Math.min(5, newClip.track + 1); 
                    clips.push(newClip); markUnsaved(); renderClips();
                    if (window.navigator.vibrate) window.navigator.vibrate(50);
                });
            });
            updateLoopLine(); updateCodeMonitor();
        }

        function addColorSlot() {
            const c = clips.find(x => x.id === selectedClipId);
            if(c) {
                let parts = c.color.split('2');
                parts.push(parts[parts.length-1]); 
                c.color = parts.join('2');
                activeColorIndex = parts.length - 1; 
                markUnsaved(); updateSelectedClip();
            }
        }
        function setActiveColor(k) {
            const c = clips.find(x => x.id === selectedClipId);
            if(c) {
                let parts = c.color.split('2');
                if (activeColorIndex >= 0 && activeColorIndex < parts.length) { parts[activeColorIndex] = k; } 
                else { parts[parts.length - 1] = k; }
                c.color = parts.join('2');
                markUnsaved(); updateSelectedClip();
            }
        }
        function resetColorBuilder() { const c = clips.find(x => x.id === selectedClipId); if(c) { c.color = 'bl'; activeColorIndex = 0; markUnsaved(); updateSelectedClip(); } }
        
        function removeColorAtIdx(idxToRemove) {
            const c = clips.find(x => x.id === selectedClipId);
            if(c) {
                let parts = c.color.split('2');
                if(parts.length > 1) { 
                    parts.splice(idxToRemove, 1); c.color = parts.join('2');
                    activeColorIndex = parts.length - 1; markUnsaved(); updateSelectedClip();
                }
            }
        }

        function renderColorBuilderSlots() {
            const c = clips.find(x => x.id === selectedClipId);
            const slots = document.getElementById('colorSlots');
            slots.innerHTML = '';
            if(!c) return;

            let colors = c.color.split('2');
            if (activeColorIndex >= colors.length || activeColorIndex < 0) activeColorIndex = colors.length - 1;

            colors.forEach((col, idx) => {
                let wrapper = document.createElement('div');
                wrapper.className = "relative flex-shrink-0 cursor-pointer p-1";
                
                let box = document.createElement('div');
                const isSelected = (idx === activeColorIndex);
                box.className = `w-6 h-6 rounded border-2 shadow-lg transition-transform ${isSelected ? 'border-white scale-110' : 'border-gray-700'}`;
                box.style.backgroundColor = colorMap[col] || '#333';
                box.onclick = () => { activeColorIndex = idx; renderColorBuilderSlots(); };
                wrapper.appendChild(box);

                if (colors.length > 1) {
                    let delBtn = document.createElement('div');
                    delBtn.className = "absolute top-0 right-0 bg-red-600 text-white rounded-full w-3.5 h-3.5 flex items-center justify-center text-[8px] font-bold z-10 hover:bg-red-500 shadow-md";
                    delBtn.innerText = "✕";
                    delBtn.onclick = (e) => { e.stopPropagation(); removeColorAtIdx(idx); };
                    wrapper.appendChild(delBtn);
                }
                slots.appendChild(wrapper);
            });
        }

        function initColors() {
            const p = document.getElementById('colorPalette'); p.innerHTML = '';
            Object.keys(colorMap).forEach(k => {
                const d = document.createElement('div'); d.className = 'w-6 h-6 rounded border border-gray-700 flex-shrink-0 cursor-pointer shadow active:scale-95'; d.style.backgroundColor = colorMap[k];
                d.onclick = () => setActiveColor(k);
                p.appendChild(d);
            });
        }

        function toggleMirror() {
            const c = clips.find(x => x.id === selectedClipId);
            if(c) {
                c.mirror = !c.mirror;
                if(c.mirror) {
                    let currentLEDs = c.target.match(/<(\d+)>/g) || [];
                    currentLEDs.forEach(led => {
                        let num = parseInt(led.replace(/<|>/g, ''));
                        let pair = 69 - num; 
                        if(pair > 0 && pair <= 300 && !c.target.includes('<'+pair+'>')) { c.target += '<'+pair+'>'; }
                    });
                }
                markUnsaved(); updateSelectedClip();
            }
        }
        function updateMirrorUI(isMirror) {
            const btn = document.getElementById('cMirrorBtn');
            if(isMirror) { btn.className = "w-4 h-4 rounded-full border-2 border-green-500 bg-green-500 shadow-[0_0_8px_#00e676]"; } 
            else { btn.className = "w-4 h-4 rounded-full border-2 border-gray-600 bg-transparent"; }
        }

        function selectClip(id) {
            selectedClipId = id; const c = clips.find(x => x.id === id);
            document.getElementById('editorPanel').style.opacity = "1"; document.getElementById('editorPanel').style.pointerEvents = "auto";
            document.getElementById('cBright').value = c.bright; document.getElementById('cFX').value = c.fx;
            activeColorIndex = -1; updateMirrorUI(c.mirror); renderLEDGrid(); renderColorBuilderSlots();
            
            document.querySelectorAll('.light-clip').forEach(el => {
                if (el.id === `clip-${id}`) el.classList.add('selected'); else el.classList.remove('selected');
            });
            
            // 🔥 เมื่อคลิกก้อนไฟ ให้เลื่อนหน้าจอ (Scroll) ไปหาก้อนไฟแบบสมูท 🔥
            if(!isPlaying) {
                playheadTime = c.start;
                const vp = document.getElementById('timelineViewport');
                vp.dataset.ignoreScroll = "true";
                vp.scrollTo({ left: playheadTime * pxPerSec, behavior: 'smooth' });
                
                setTimeout(() => { vp.dataset.ignoreScroll = "false"; }, 500);
                
                document.getElementById('playhead').style.left = (playheadTime * pxPerSec) + 'px';
                document.getElementById('timeText').innerText = `PLAYHEAD: ${playheadTime.toFixed(1)}s / END: ${currentLoopLimit.toFixed(1)}s`;
                scrubLiveFrame();
            }
        }

        function updateSelectedClip() {
            if(!selectedClipId) return; const c = clips.find(x => x.id === selectedClipId);
            c.bright = document.getElementById('cBright').value; c.fx = document.getElementById('cFX').value;
            markUnsaved(); updateMirrorUI(c.mirror);
            renderClips(); renderColorBuilderSlots(); if(!isPlaying) scrubLiveFrame(); else sendFullCodeToBT();
        }

        function renderLEDGrid() {
            const grid = document.getElementById('ledGrid'); grid.innerHTML = '';
            const c = clips.find(x => x.id === selectedClipId);
            if(!c) return;

            const markers = [7,8,9,10, 18,19,20,21, 29,30,31,32, 37,38,39,40, 48,49,50,51, 59,60,61,62];

            for(let i=1; i<=300; i++) { 
                const d = document.createElement('div'); d.innerText = i;
                let isMarked = markers.includes(i) ? 'led-mark' : 'border-[#222]';
                let isActive = c.target.includes('<'+i+'>') ? 'led-active' : 'bg-[#111] text-gray-400';
                
                d.className = `text-[8px] h-6 border rounded flex items-center justify-center cursor-pointer ${isMarked} ${isActive}`;
                d.addEventListener('click', (e) => { 
                    let targetStr = '<' + i + '>';
                    let pair = c.mirror ? (69 - i) : null;
                    let pairStr = pair ? '<' + pair + '>' : '';

                    if(c.target.includes(targetStr)) { 
                        c.target = c.target.replace(targetStr,''); 
                        if(pairStr) c.target = c.target.replace(pairStr,'');
                    } else { 
                        c.target += targetStr; 
                        if(pairStr && !c.target.includes(pairStr)) c.target += pairStr;
                    } 
                    markUnsaved(); renderLEDGrid(); updateSelectedClip(); 
                });
                grid.appendChild(d);
            }
        }

        function generateCodeStr() {
            let code = "";
            clips.sort((a,b)=>a.start-b.start).forEach(c => {
                let m = c.mirror ? 'm' : '';
                let s = Math.min(99, Math.round(c.start*10)).toString().padStart(2,'0'), b = parseInt(c.bright).toString().padStart(2,'0'), d = Math.min(99, Math.round(c.duration*10)).toString().padStart(2,'0');
                code += `${m}(${s}${b},${c.target || 'a'},${c.color},${c.fx}${d}00)`; 
            });
            return code;
        }
        
        function openCodeModal() {
            document.getElementById('codeTextarea').value = generateCodeStr();
            document.getElementById('codeModal').classList.remove('hidden');
            document.getElementById('codeTextarea').focus();
            window.location.hash = 'code'; 
        }
        function closeCodeModal() { 
            if(window.location.hash === '#code') history.back();
            else document.getElementById('codeModal').classList.add('hidden');
        }
        
        async function pasteCode() {
            try { const text = await navigator.clipboard.readText(); document.getElementById('codeTextarea').value = text; } 
            catch (err) { alert('Paste from clipboard failed. Try manual paste.'); }
        }
        function copyFromModal() {
            const text = document.getElementById('codeTextarea').value;
            navigator.clipboard.writeText(text).then(() => alert("Copied!"));
        }
        function applyCodeModal() {
            const val = document.getElementById('codeTextarea').value;
            applyCodeFromInput(val);
            closeCodeModal();
        }

        function applyCodeFromInput(val) {
            let code = val;
            if(code.startsWith("5")) code = code.substring(1); 
            clips = [];
            let brackets = code.match(/m?\(([^)]+)\)/g);
            if (brackets) {
                brackets.forEach((bracket, i) => {
                    let m = bracket.startsWith('m');
                    let content = bracket.replace('m','').replace('(','').replace(')','').split(',');
                    if(content.length >= 4) { 
                        clips.push({ 
                            id: Date.now() + i, start: parseInt(content[0].substring(0,2))/10, bright: parseInt(content[0].substring(2,4)), 
                            target: content[1], color: content[2], fx: content[3].charAt(0), duration: parseInt(content[3].substring(1,3))/10, 
                            loop: 1, mirror: m, track: i % 6 
                        });
                    }
                });
            }
            markUnsaved(); renderClips();
            if(clips.length > 0) selectClip(clips[0].id);
        }

        async function saveAndSend() {
            document.getElementById('unsavedModal').classList.add('hidden'); 
            hasUnsavedChanges = false;
            patterns[selectedIdx].code = generateCodeStr();
            if(characteristic) await characteristic.writeValue(new TextEncoder().encode(`S${selectedIdx}:${patterns[selectedIdx].code}`));
            
            let savedIdx = selectedIdx;
            if(window.location.hash === '#edit') history.back();
            else closePopupDirectly();
            
            if(savedIdx < 10) autoSyncTop10();
        }
        
        function updateLoopLine() { let maxT = 0; clips.forEach(c => { let end = c.start + c.duration; if (end > maxT) maxT = end; }); currentLoopLimit = maxT > 0 ? maxT : 1.0; const ll = document.getElementById('loopLine'); if (ll) { ll.style.left = (currentLoopLimit * pxPerSec) + 'px'; ll.style.display = clips.length > 0 ? 'block' : 'none'; } }
        function addClipAtPlayhead() { const id = Date.now(); clips.push({ id, start: playheadTime, duration: 1.0, target: "", color: "bl", fx: "o", bright: 10, loop: 1, mirror: false, track: clips.length % 6 }); markUnsaved(); renderClips(); selectClip(id); }
        function deleteSelectedClip() { if(selectedClipId) { clips = clips.filter(c => c.id !== selectedClipId); selectedClipId = null; markUnsaved(); renderClips(); } }
        
        // 🔥 พระเอกของการปัดหน้าจอ (Scroll to Scrub) 🔥
        document.getElementById('timelineViewport').addEventListener('scroll', function() {
            if (!isPlaying && this.dataset.ignoreScroll !== "true") {
                playheadTime = Math.max(0, this.scrollLeft / pxPerSec);
                document.getElementById('playhead').style.left = (playheadTime * pxPerSec) + 'px';
                document.getElementById('timeText').innerText = `PLAYHEAD: ${playheadTime.toFixed(1)}s / END: ${currentLoopLimit.toFixed(1)}s`;
                scrubLiveFrame();
            }
        });

        function togglePlay() { 
            const btn = document.getElementById('playBtn'); 
            if (!isPlaying) { 
                isPlaying = true; btn.innerText = "STOP"; btn.classList.replace('bg-blue-600', 'bg-red-600'); 
                sendFullCodeToBT(); 
                startAnimateTime = performance.now() - (playheadTime * 1000); 
                playInterval = requestAnimationFrame(animatePlayhead); 
            } else { stopPlayback(); } 
        }
        
        function stopPlayback() { 
            isPlaying = false; 
            const btn = document.getElementById('playBtn'); 
            if (btn) { btn.innerText = "PLAY"; btn.classList.replace('bg-red-600', 'bg-blue-600'); } 
            cancelAnimationFrame(playInterval); 
            
            // 🔥 ดึงเส้นสีแดงมาไว้กลางจอแบบสมูท เมื่อกด STOP 🔥
            const vp = document.getElementById('timelineViewport');
            vp.dataset.ignoreScroll = "true";
            vp.scrollTo({ left: playheadTime * pxPerSec, behavior: 'smooth' });
            setTimeout(() => { vp.dataset.ignoreScroll = "false"; }, 50);

            document.getElementById('playhead').style.left = (playheadTime * pxPerSec) + 'px';
            document.getElementById('timeText').innerText = `PLAYHEAD: ${playheadTime.toFixed(1)}s / END: ${currentLoopLimit.toFixed(1)}s`;
            
            scrubLiveFrame(); 
        }
        
        function animatePlayhead(currentTime) { 
            if (!isPlaying) return; 
            let elapsed = (currentTime - startAnimateTime) / 1000; 
            if (elapsed >= currentLoopLimit) { startAnimateTime = currentTime; elapsed = 0; sendFullCodeToBT(); } 
            playheadTime = elapsed; 
            
            document.getElementById('playhead').style.left = (playheadTime * pxPerSec) + 'px'; 
            document.getElementById('timeText').innerText = `PLAYHEAD: ${playheadTime.toFixed(1)}s / END: ${currentLoopLimit.toFixed(1)}s`; 
            
            if(isFollowingPlayhead) {
                const vp = document.getElementById('timelineViewport');
                vp.dataset.ignoreScroll = "true";
                vp.scrollLeft = playheadTime * pxPerSec;
            }
            playInterval = requestAnimationFrame(animatePlayhead); 
        }

        function updateCodeMonitor() { document.getElementById('liveCode').innerText = generateCodeStr() || "No code yet..."; }
        async function sendFullCodeToBT() { if(!characteristic) return; let code = "5" + generateCodeStr(); try { await characteristic.writeValueWithoutResponse(new TextEncoder().encode(code)); } catch(e){} }
        
        // 🔥 ระบบส่งภาพนิ่งไปโชว์ตอนรูดหน้าจอ หรือหยุดเล่น 🔥
        async function scrubLiveFrame() { 
            if(!characteristic || isPlaying || isWritingBLE) return; 
            
            let activeClips = clips.filter(c => playheadTime >= c.start && playheadTime <= c.start + c.duration);
            if (activeClips.length === 0) {
                try { 
                    isWritingBLE = true;
                    await characteristic.writeValueWithoutResponse(new TextEncoder().encode("off")); 
                    isWritingBLE = false;
                } catch(e){ isWritingBLE = false; }
                return;
            }
            
            let code = "5";
            activeClips.forEach(c => {
                let p = (playheadTime - c.start) / c.duration;
                if(p < 0) p = 0; if(p > 1) p = 1;
                
                let f = 1.0;
                if (c.fx === 'u') f = p;
                else if (c.fx === 'f') f = 1.0 - p;
                else if (c.fx === 'w') f = 0.3 + (0.7 * Math.sin(Math.PI * p));
                else if (c.fx === 'p') f = Math.pow(Math.sin(Math.PI * p), 4);
                else if (c.fx === 'd') f = Math.pow(1.0 - p, 4);
                else if (c.fx === 'z') f = 1.0 - ((p * 4.0) % 1.0);
                
                let br = Math.max(0, Math.min(99, Math.round(c.bright * f)));
                let bStr = br.toString().padStart(2, '0');
                let m = c.mirror ? 'm' : '';
                let showColor = c.color.split('2')[0]; 
                
                code += `${m}(00${bStr},${c.target || 'a'},${showColor},o9900)`; 
            });
            try { 
                isWritingBLE = true;
                await characteristic.writeValueWithoutResponse(new TextEncoder().encode(code)); 
                isWritingBLE = false;
            } catch(e){ isWritingBLE = false; } 
        }

        renderPads();
    </script>
</body>
</html>
