<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket DJ Studio - Sync Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --primary-green: #2ecc71; --bg-dark: #0a0a0a; --card-bg: #1a1a1a; }
        body { background-color: var(--bg-dark); color: var(--primary-green); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 15px; overflow-x: hidden; }
        .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        /* ปุ่มเชื่อมต่อ */
        .connect-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .connect-btn.online { background: var(--primary-green); color: black; }

        .controls { width: 100%; max-width: 500px; background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #333; }
        .speed-slider { width: 100%; accent-color: var(--primary-green); }

        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 500px; }
        .dj-button { 
            aspect-ratio: 1 / 1; background: #1e1e1e; border: 1.5px solid var(--primary-green); 
            border-radius: 10px; color: white; display: flex; align-items: center; 
            justify-content: center; font-size: 14px; font-weight: bold; cursor: grab;
            touch-action: none; user-select: none; position: relative;
        }
        /* จุดแสดงสถานะว่ามีข้อมูล (Saved) */
        .dj-button.has-data::after {
            content: ''; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; background: var(--primary-green); border-radius: 50%;
        }
        .sortable-ghost { opacity: 0.2; }
    </style>
</head>
<body>

    <div class="header">
        <h2>POCKET DJ STUDIO</h2>
        <button id="connectBtn" class="connect-btn">CONNECT BLE</button>
    </div>

    <div class="controls">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span>SPEED CONTROL</span>
            <span><span id="speed-val">1.0</span>x</span>
        </div>
        <input type="range" id="speed" class="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="grid-container" id="grid"></div>

    <script>
        const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
        const CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";
        
        let bleCharacteristic;
        let deviceName = "";
        const grid = document.getElementById('grid');
        const connectBtn = document.getElementById('connectBtn');

        // สร้างปุ่ม 60 ปุ่มรอไว้
        const buttons = {};
        for (let i = 0; i < 60; i++) {
            const btn = document.createElement('div');
            btn.className = 'dj-button';
            btn.innerHTML = i + 1;
            btn.dataset.id = i;
            btn.onclick = () => sendPattern(i);
            grid.appendChild(btn);
            buttons[i] = btn;
        }

        // 1. ฟังก์ชันเชื่อมต่อ Bluetooth
        connectBtn.onclick = async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'PocketDJ' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                connectBtn.innerText = "ONLINE";
                connectBtn.classList.add('online');

                // เริ่มรับข้อมูลจาก ESP32
                await bleCharacteristic.startNotifications();
                bleCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

                // ส่งคำสั่งขอดึงข้อมูลทั้งหมด
                sendValue("GET_ALL");

            } catch (error) {
                console.error("Connection failed", error);
                alert("เชื่อมต่อไม่สำเร็จ: " + error);
            }
        };

        // 2. จัดการข้อมูลที่ได้รับจาก ESP32 (Sync ข้อมูลปุ่ม)
        function handleNotifications(event) {
            let value = new TextDecoder().decode(event.target.value);
            console.log("Received:", value);

            // รูปแบบข้อมูล D(index):(speed):(pattern)
            if (value.startsWith("D")) {
                let parts = value.substring(1).split(':');
                let idx = parseInt(parts[0]);
                let pattern = parts[2];

                if (pattern && pattern !== "" && pattern !== "off") {
                    buttons[idx].classList.add('has-data');
                    buttons[idx].title = pattern; // เก็บคำสั่งไว้ดูใน title
                }
            }
        }

        // 3. ส่งคำสั่งเล่น Pattern เมื่อกดปุ่ม
        async function sendPattern(index) {
            if (!bleCharacteristic) return;
            // ส่งคำสั่งเพื่อให้ ESP32 เรียกใช้ FX ที่บันทึกไว้
            // ในโค้ด ESP ของคุณต้องมีการรับค่าเพื่อ Trigger รายปุ่มด้วย
            // เบื้องต้นส่งเพื่อให้ Serial Monitor เห็น
            sendValue(`S${index}:PLAY`); 
        }

        async function sendValue(text) {
            if (!bleCharacteristic) return;
            const encoder = new TextEncoder();
            await bleCharacteristic.writeValue(encoder.encode(text));
        }

        // 4. ระบบ Drag & Drop
        new Sortable(grid, {
            animation: 150,
            delay: 200,
            onEnd: function (evt) {
                // เมื่อลากเสร็จ ส่งลำดับใหม่ไปเก็บใน ESP32
                let order = Array.from(grid.children).map(btn => btn.dataset.id).join(',');
                sendValue("ORDER:" + order);
            }
        });

        // อัปเดต Speed
        document.getElementById('speed').oninput = function() {
            document.getElementById('speed-val').innerText = this.value;
            sendValue("T" + (1/this.value).toFixed(2));
        };
    </script>
</body>
</html>
