<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket DJ Studio - Side Scroll Lock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; background: #050505; color: white; 
            user-select: none; overflow: hidden; height: 100vh;
            display: flex; flex-direction: column;
        }

        /* กรอบขังปุ่ม */
        .pad-container {
            margin: 0 auto; width: 95%; height: 70vh; 
            background: #0a0a0a; border: 2px solid #222; border-radius: 20px;
            position: relative;
            overflow: hidden; /* ปิดการสไลด์แบบปกติทับปุ่ม */
            display: flex;
        }

        /* พื้นที่แสดงปุ่ม (ล็อคการสไลด์ด้วยนิ้วบนปุ่ม) */
        #padGrid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 15px;
            overflow-y: scroll; /* เปิดให้ scroll ได้ทางเทคนิค */
            scrollbar-width: none; /* ซ่อน scrollbar สำหรับ Firefox */
            touch-action: none; /* ไม้ตาย: ห้ามสไลด์หน้าจอผ่านการรูดบนปุ่ม */
        }
        #padGrid::-webkit-scrollbar { display: none; } /* ซ่อน scrollbar สำหรับ Chrome/Safari */

        /* แถบสไลด์ด้านข้าง (Side Scroll Track) */
        .side-scroll-track {
            width: 30px;
            background: #111;
            border-left: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: ns-resize;
            touch-action: pan-y; /* อนุญาตให้สไลด์เฉพาะแถบนี้เท่านั้น */
        }
        .side-scroll-track::after {
            content: '↕';
            color: #444;
            font-size: 20px;
        }

        .pad-btn { 
            background: #151515; border: 1px solid #333; aspect-ratio: 1/1; 
            border-radius: 12px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; position: relative;
        }

        /* ไข่ปลาสำหรับลากสลับที่ */
        .drag-handle { 
            position: absolute; top: 0; left: 0; width: 35px; height: 35px; 
            display: flex; align-items: center; justify-content: center; 
            color: #333; font-size: 16px; cursor: grab; z-index: 10;
        }

        .sortable-drag { opacity: 0.9; transform: scale(1.1); z-index: 9999; box-shadow: 0 10px 30px #000; border: 2px solid #00e676 !important; }
    </style>
</head>
<body class="p-4">

    <div id="consoleView" class="max-w-xl mx-auto w-full">
        <div class="flex justify-between items-center mb-4 bg-gray-900/50 p-4 rounded-3xl border border-gray-800">
            <h1 class="text-lg font-black text-green-500 italic uppercase">DJ Master Sync</h1>
            <button id="connectBtn" class="bg-green-500 text-black text-[10px] font-black px-4 py-2 rounded-xl">CONNECT</button>
        </div>
    </div>

    <div class="pad-container max-w-xl">
        <div id="padGrid"></div>
        
        <div class="side-scroll-track" id="sideScroll"></div>
    </div>

    <script>
        let patterns = Array.from({length: 60}, (_, i) => ({ id: i }));
        const grid = document.getElementById('padGrid');

        function renderPads() {
            grid.innerHTML = '';
            patterns.forEach((p, idx) => {
                const btn = document.createElement('div');
                btn.className = 'pad-btn';
                btn.innerHTML = `
                    <div class="drag-handle">⠿</div>
                    <span class="text-xs font-black pad-num">${idx+1}</span>
                `;
                
                btn.onclick = (e) => {
                    if (e.target.classList.contains('drag-handle')) return;
                    console.log("Play:", idx + 1);
                };
                grid.appendChild(btn);
            });

            new Sortable(grid, {
                handle: '.drag-handle',
                animation: 150,
                onEnd: (evt) => {
                    const item = patterns.splice(evt.oldIndex, 1)[0];
                    patterns.splice(evt.newIndex, 0, item);
                    grid.querySelectorAll('.pad-num').forEach((num, i) => num.innerText = i + 1);
                }
            });
        }

        // ระบบเชื่อมโยงแถบสไลด์ข้าง (Side Scroll Logic)
        const sideScroll = document.getElementById('sideScroll');
        let isScrolling = false;
        let startY, startScrollTop;

        sideScroll.addEventListener('touchstart', (e) => {
            isScrolling = true;
            startY = e.touches[0].pageY;
            startScrollTop = grid.scrollTop;
        }, {passive: true});

        sideScroll.addEventListener('touchmove', (e) => {
            if (!isScrolling) return;
            const deltaY = (e.touches[0].pageY - startY) * 2; // คูณ 2 เพื่อให้เลื่อนไวขึ้น
            grid.scrollTop = startScrollTop - deltaY;
        }, {passive: true});

        sideScroll.addEventListener('touchend', () => isScrolling = false);

        renderPads();
    </script>
</body>
</html>
